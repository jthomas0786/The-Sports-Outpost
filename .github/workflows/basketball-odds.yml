name: Basketball Odds Snapshots

on:
  push:
    paths:
      - 'scripts/basketball-odds-refresh.mjs'
      - '.github/workflows/basketball-odds.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basketball-odds-snapshots-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh NBA/NCAAB/WNBA sportsbook props
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: node scripts/basketball-odds-refresh.mjs NBA NCAAB WNBA
      - name: Commit changed snapshots
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          changes="$(git status --porcelain -- slates/nba-odds.json slates/ncaab-odds.json slates/wnba-odds.json)"
          if [ -z "$changes" ]; then
            echo 'No basketball snapshot changes.'
            exit 0
          fi
          printf '%s\n' "$changes"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add slates/nba-odds.json slates/ncaab-odds.json slates/wnba-odds.json
          git commit -m 'Refresh basketball odds snapshots'
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
