name: Global Info Button QA

on:
  push:
    branches: [main]
    paths:
      - 'sports/global-info-button-v956.js'
      - 'sports/registry.js'
      - 'sports/router.js'
      - 'scripts/global-info-button-browser-qa.mjs'
      - '.github/workflows/global-info-button-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Info button on desktop and mobile
        run: node scripts/global-info-button-browser-qa.mjs
