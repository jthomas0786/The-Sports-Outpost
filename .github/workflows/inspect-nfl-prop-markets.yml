name: Inspect NFL prop market catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-nfl-prop-markets.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect generic FanDuel milestone ladders
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          MARKETS="player_passing_yards_milestones,player_receiving_yards_milestones,player_rushing_yards_milestones"
          curl -fsS \
            -H "X-API-Key: ${PARLAY_API_KEY}" \
            "https://api.parlay-api.com/v1/sports/americanfootball_nfl/props?markets=${MARKETS}&bookmakers=fanduel&includeSids=true&includeLinks=true&limit=5000&maxAgeSec=3600" \
            -D /tmp/headers.txt \
            -o /tmp/rows.json
          echo "RESULT_HEADERS"
          grep -Ei '^x-result-|^x-next-offset|^x-markets-' /tmp/headers.txt || true
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/rows.json'))
          rows=d if isinstance(d,list) else d.get('data') or d.get('results') or d.get('props') or []
          wanted={'Patrick Mahomes','Rashee Rice','Kenneth Walker III','Kenneth Walker','Jaxon Smith-Njigba','Sam Darnold','Stefon Diggs'}
          print('ROW_COUNT',len(rows) if isinstance(rows,list) else 0)
          print('MATCHING_ROWS')
          for r in rows if isinstance(rows,list) else []:
              player=str(r.get('player') or r.get('player_name') or '')
              if player not in wanted: continue
              clean={
                'player':player,
                'market_key':r.get('market_key') or r.get('market'),
                'market':r.get('market'),
                'line':r.get('line'),
                'over_price':r.get('over_price'),
                'under_price':r.get('under_price'),
                'bookmaker':r.get('bookmaker') or r.get('book'),
                'event_id':r.get('event_id'),
                'selection_id':r.get('selection_id'),
                'selection_by_side':r.get('selection_by_side'),
                'over_link':r.get('over_link'),
                'under_link':r.get('under_link'),
                'link':r.get('link'),
                'raw_keys':sorted(r.keys()),
              }
              print(json.dumps(clean,separators=(',',':')))
          PY
