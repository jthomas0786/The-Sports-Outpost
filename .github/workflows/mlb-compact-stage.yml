name: MLB Compact Snapshot Stage

on:
  push:
    branches: [mlb-parlayapi-odds-stage]
    paths: ['.github/workflows/mlb-compact-stage.yml']

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compact current verified MLB snapshot without another API call
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='slates/mlb-odds.json';
          const doc=JSON.parse(fs.readFileSync(file,'utf8'));
          const finite=v=>v===null||v===undefined||v===''?null:(Number.isFinite(Number(v))?Number(v):null);
          const rows=(doc.rows||[]).map(row=>({
            eventId:String(row.eventId||''),providerEventId:String(row.providerEventId||''),
            commenceTime:row.commenceTime||null,homeTeam:row.homeTeam||null,awayTeam:row.awayTeam||null,
            player:row.player||null,market:row.market||null,line:finite(row.line),period:row.period||'FULL',
            book:row.book||null,bookKey:String(row.bookKey||row.book||'').toLowerCase().replace(/[^a-z0-9]/g,''),
            overPrice:finite(row.overPrice),underPrice:finite(row.underPrice),deepLink:row.deepLink||null,
            snapshotTime:row.snapshotTime||null,preserved:Boolean(row.preserved)
          }));
          doc.rows=rows;doc.meta={...(doc.meta||{}),rows:rows.length,format:'compact-v1'};
          for(const player of ['Riley Greene','Coby Mayo','Josh Bell','Jake Burger']){
            if(!rows.some(r=>r.player===player&&r.market==='homeRun'&&Number.isFinite(r.overPrice)))throw new Error(`${player}: verified HR price missing during compaction`);
          }
          fs.writeFileSync(file,JSON.stringify(doc)+'\n');
          console.log(`Compacted ${rows.length} verified MLB sportsbook rows.`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slates/mlb-odds.json
          git commit -m "Compact staged MLB sportsbook odds"
          git push origin HEAD:mlb-parlayapi-odds-stage
