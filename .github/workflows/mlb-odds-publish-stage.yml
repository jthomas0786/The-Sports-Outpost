name: MLB Odds Publish Stage

on:
  push:
    branches: [mlb-parlayapi-odds-stage]
    paths: ['.github/workflows/mlb-odds-publish-stage.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate current MLB odds snapshot
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          MLB_ODDS_FORCE: '1'
        run: node scripts/mlb-odds-refresh.mjs --force
      - name: Verify exact reported slip and commit stage snapshot
        run: |
          node <<'NODE'
          const fs=require('fs');
          const doc=JSON.parse(fs.readFileSync('slates/mlb-odds.json','utf8'));
          for(const player of ['Riley Greene','Coby Mayo','Josh Bell','Jake Burger']){
            const rows=(doc.rows||[]).filter(r=>r.player===player&&r.market==='homeRun'&&Number.isFinite(Number(r.overPrice)));
            if(!rows.length)throw new Error(`${player}: missing verified HR price`);
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slates/mlb-odds.json
          git commit -m "Stage current MLB sportsbook odds"
          git push origin HEAD:mlb-parlayapi-odds-stage
