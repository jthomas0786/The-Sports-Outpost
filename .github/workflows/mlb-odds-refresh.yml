name: MLB Odds Refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mlb-odds-refresh.mjs'
      - 'scripts/mlb-odds-primary-refresh.mjs'
      - 'scripts/parlayapi-pregame-cadence.mjs'
      - 'scripts/parlayapi-pregame-cadence-selftest.mjs'
      - '.github/workflows/mlb-odds-refresh.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-odds-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate shared ParlayAPI cadence
        run: node scripts/parlayapi-pregame-cadence-selftest.mjs
      - name: Refresh verified MLB prop prices when due
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          MLB_ODDS_FORCE: ${{ github.event_name == 'push' && '1' || (github.event_name == 'workflow_dispatch' && '1' || '0') }}
        run: node scripts/mlb-odds-primary-refresh.mjs
      - name: Validate MLB ParlayAPI snapshot
        run: |
          node - <<'NODE'
          const fs=require('fs');
          if(!fs.existsSync('slates/mlb-odds.json')) process.exit(0);
          const d=JSON.parse(fs.readFileSync('slates/mlb-odds.json','utf8'));
          if(d.meta?.source!=='parlayapi'||d.meta?.sample!==false) throw new Error('MLB snapshot is not verified ParlayAPI data');
          const zero=v=>v!==null&&v!==undefined&&v!==''&&Number(v)===0;
          if((d.rows||[]).some(r=>zero(r.overPrice)||zero(r.underPrice))) throw new Error('MLB snapshot contains a zero price');
          console.log(`✓ MLB ParlayAPI snapshot rows=${(d.rows||[]).length} books=${(d.meta?.books||[]).length} markets=${(d.meta?.markets||[]).length}`);
          NODE
      - name: Persist MLB odds snapshot
        run: |
          if git diff --quiet -- slates/mlb-odds.json; then
            echo "No MLB odds snapshot change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slates/mlb-odds.json
          git commit -m "Refresh MLB sportsbook odds [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
