name: NCAAF Odds Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ncaaf-odds-refresh.mjs'
      - '.github/workflows/ncaaf-odds.yml'
  schedule:
    # Keep the college-football snapshot reasonably fresh while staying light
    # on ParlayAPI credits. Each props call costs 3 credits.
    - cron: '23 */4 * * *'

permissions:
  contents: write

concurrency:
  group: ncaaf-odds-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh NCAAF player props
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: node scripts/ncaaf-odds-refresh.mjs

      - name: Validate NCAAF snapshot
        run: |
          node -e "const d=require('./slates/ncaaf-odds.json');if(d.meta?.source!=='parlayapi'||d.meta?.sample!==false||d.meta?.sport!=='NCAAF'||!Array.isArray(d.rows))process.exit(2);console.log('NCAAF snapshot:',d.rows.length,'rows across',(d.meta.books||[]).length,'books')"

      - name: Commit snapshot when changed
        run: |
          git config user.name 'TSO NCAAF Odds Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add slates/ncaaf-odds.json
          git diff --staged --quiet && echo "no NCAAF odds changes" && exit 0
          git commit -m "Refresh NCAAF odds"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected — rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 3))
          done
          exit 1
