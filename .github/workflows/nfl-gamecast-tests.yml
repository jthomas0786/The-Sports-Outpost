name: NFL Gamecast Checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'sports/router.js'
      - 'sports/nfl/live.js'
      - 'sports/nfl/live-game-switcher-v894.js'
      - 'sports/mlb/live-game-switcher-v901.js'
      - 'sports/mlb/playstage-v901.js'
      - 'sports/mlb/playstage-concept-v904.js'
      - 'sports/mlb/playstage-concept-v905.js'
      - 'sports/mlb/playstage-concept-v906.js'
      - 'sports/mlb/playstage-concept-v907.js'
      - 'sports/mlb/playstage-concept-v908.js'
      - 'sports/mlb/playstage-concept-v909.js'
      - 'sports/mlb/playstage-concept-v910.js'
      - 'sports/mlb/playstage-concept-v911.js'
      - 'sports/mlb/playstage-concept-v912.js'
      - 'sports/mlb/playstage-concept-v913.js'
      - 'sports/mlb/playstage-concept-v914.js'
      - 'images/mlb/playstage-field-v914.jpg'
      - 'sports/nfl/gamecast-field-state-v8912.js'
      - 'sports/nfl/gamecast-replay-lab-v8916.js'
      - 'sports/nfl-preview-v893.js'
      - 'sports/nfl/quarter-parlay-ui-v893.js'
      - 'sports/nfl/sim/quarter-board.js'
      - 'scripts/live-game-switcher-selftest.mjs'
      - 'scripts/mlb-playstage-selftest.mjs'
      - 'scripts/nfl-v893-selftest.mjs'
      - 'scripts/nfl-quarter-selftest.mjs'
      - 'scripts/nfl-v8915-gamecast-motion-selftest.mjs'
      - 'scripts/nfl-v8916-live-personnel-selftest.mjs'
      - 'scripts/nfl-v8916-replay-lab-selftest.mjs'
      - '.github/workflows/nfl-gamecast-tests.yml'

permissions:
  contents: read

jobs:
  gamecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check sports/router.js
          node --check sports/nfl/live.js
          node --check sports/nfl/live-game-switcher-v894.js
          node --check sports/mlb/live-game-switcher-v901.js
          node --check sports/mlb/playstage-v901.js
          node --check sports/mlb/playstage-concept-v904.js
          node --check sports/mlb/playstage-concept-v905.js
          node --check sports/mlb/playstage-concept-v906.js
          node --check sports/mlb/playstage-concept-v907.js
          node --check sports/mlb/playstage-concept-v908.js
          node --check sports/mlb/playstage-concept-v909.js
          node --check sports/mlb/playstage-concept-v910.js
          node --check sports/mlb/playstage-concept-v911.js
          node --check sports/mlb/playstage-concept-v912.js
          node --check sports/mlb/playstage-concept-v913.js
          node --check sports/mlb/playstage-concept-v914.js
          node --check sports/nfl/gamecast-field-state-v8912.js
          node --check sports/nfl/gamecast-replay-lab-v8916.js
          node --check sports/nfl-preview-v893.js
          node --check sports/nfl/quarter-parlay-ui-v893.js
      - name: MLB PlayStage deployment graph
        run: |
          grep -F './sports/router.js?v=90.20' index.html
          grep -F "./mlb/playstage-v901.js?v=90.4" sports/router.js
          grep -F "./mlb/playstage-concept-v904.js?v=90.4" sports/router.js
          grep -F "./mlb/playstage-concept-v905.js?v=90.51" sports/router.js
          grep -F "./mlb/playstage-concept-v906.js?v=90.60" sports/router.js
          grep -F "./mlb/playstage-concept-v907.js?v=90.70" sports/router.js
          grep -F "./mlb/playstage-concept-v908.js?v=90.80" sports/router.js
          grep -F "./mlb/playstage-concept-v909.js?v=90.90" sports/router.js
          grep -F "./mlb/playstage-concept-v910.js?v=91.00" sports/router.js
          grep -F "./mlb/playstage-concept-v911.js?v=91.10" sports/router.js
          grep -F "./mlb/playstage-concept-v912.js?v=91.20" sports/router.js
          grep -F "./mlb/playstage-concept-v913.js?v=91.30" sports/router.js
          grep -F "./mlb/playstage-concept-v914.js?v=91.40" sports/router.js
          grep -F "installMlbPlaystageConceptV904" sports/router.js
          grep -F "installMlbPlaystageConceptV905" sports/router.js
          grep -F "installMlbPlaystageConceptV906" sports/router.js
          grep -F "installMlbPlaystageConceptV907" sports/router.js
          grep -F "installMlbPlaystageConceptV908" sports/router.js
          grep -F "installMlbPlaystageConceptV909" sports/router.js
          grep -F "installMlbPlaystageConceptV910" sports/router.js
          grep -F "installMlbPlaystageConceptV911" sports/router.js
          grep -F "installMlbPlaystageConceptV912" sports/router.js
          grep -F "installMlbPlaystageConceptV913" sports/router.js
          grep -F "installMlbPlaystageConceptV914" sports/router.js
          grep -F 'ps909-scene' sports/mlb/playstage-concept-v909.js
          grep -F 'ps908-foreground' sports/mlb/playstage-concept-v908.js
          grep -F 'ps910-gloss' sports/mlb/playstage-concept-v910.js
          grep -F 'ps911-fieldfx' sports/mlb/playstage-concept-v911.js
          grep -F 'ps912-plate' sports/mlb/playstage-concept-v912.js
          grep -F 'ps913BatSwing' sports/mlb/playstage-concept-v913.js
          grep -F 'ps914-field' sports/mlb/playstage-concept-v914.js
          test -s images/mlb/playstage-field-v914.jpg
          grep -F 'Schematic reconstruction' sports/mlb/playstage-v901.js
      - name: Live game switcher tests
        run: node scripts/live-game-switcher-selftest.mjs
      - name: MLB PlayStage tests
        run: node scripts/mlb-playstage-selftest.mjs
      - name: Parlay generator contract tests
        run: |
          node scripts/nfl-v893-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
      - name: Motion planner tests
        run: node scripts/nfl-v8915-gamecast-motion-selftest.mjs
      - name: Live personnel tests
        run: node scripts/nfl-v8916-live-personnel-selftest.mjs
      - name: Replay Lab contract tests
        run: node scripts/nfl-v8916-replay-lab-selftest.mjs
