name: NFL Halftime Fast Path

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nfl-halftime-fast.yml'
  schedule:
    # Official halftime must stay in the 50K board window; late Q2 remains prewarm only.
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

jobs:
  halftime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: nfl-halftime-dedicated-fast
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate halftime scheduler and phase logic
        run: |
          node --check sports/nfl/sim/auto.js
          node --check scripts/nfl-halftime-window-refresh.mjs
          node --check sports/nfl/halftime-validity.js
          node scripts/nfl-sim-auto-selftest.mjs
          node scripts/nfl-halftime-readiness-selftest.mjs
          node --input-type=module <<'NODE'
          import {automationPhase,isHalftimeWarmupState} from './sports/nfl/sim/auto.js';
          const ok=(v,m)=>{if(!v) throw new Error(m)};
          ok(automationPhase({status:'halftime',period:2,clockMin:0})==='halftime','official halftime must map to halftime phase');
          ok(automationPhase({status:'half',quarter:2,clock:'0:00'})==='halftime','half alias must map to halftime phase');
          ok(isHalftimeWarmupState({status:'in',quarter:2,clock:'7:30'}),'late Q2 must warm halftime board');
          ok(automationPhase({status:'in',quarter:3,clock:'15:00'})==='live','Q3 must map to live');
          console.log('✓ halftime phase regression passed');
          NODE

      - name: Refresh authoritative NFL live snapshot
        run: node scripts/nfl-live-poller.mjs

      - name: Prefetch sportsbook props from 10:00 Q2 through halftime
        continue-on-error: true
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          NFL_LIVE_ENDPOINT: https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live
          NFL_HALFTIME_PREFETCH_MINUTES: 10
        run: |
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "Halftime sportsbook refresh attempt $attempt/6"
            if node scripts/nfl-halftime-window-refresh.mjs --live-file slates/nfl-live.json; then
              ok=1
              break
            fi
            sleep $((attempt * 2))
          done
          [ "$ok" -eq 1 ]

      - name: Detect halftime-window games
        id: window
        run: |
          IDS=$(node - <<'NODE'
          const fs=require('fs');
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const entries=live?.games&&typeof live.games==='object'?Object.entries(live.games):[];
          const clockMinutes=g=>{
            const d=Number(g?.clockMin); if(Number.isFinite(d)) return d;
            const s=Number(g?.secondsRemaining ?? g?.status?.seconds ?? g?.seconds); if(Number.isFinite(s)) return s/60;
            const m=String(g?.clock ?? g?.lastPlay?.clock ?? '').trim().match(/^(\d{1,2}):(\d{2})$/);
            return m?Number(m[1])+Number(m[2])/60:NaN;
          };
          const ids=entries.filter(([,g])=>{
            const st=String(g?.status ?? g?.state ?? g?.status?.state ?? '').toLowerCase();
            const detail=`${g?.statusDetail||''} ${g?.status?.detail||''} ${g?.detail||''} ${g?.clock||''}`.toLowerCase();
            const q=Number(g?.period ?? g?.quarter ?? g?.status?.period);
            const c=clockMinutes(g);
            const half=g?.isHalftime===true||st==='halftime'||st==='half'||/half\s*time|halftime|end of (?:the )?2nd|end of second/.test(detail)||((st==='in'||st==='live')&&q===2&&Number.isFinite(c)&&c<=0.05);
            return half || ((st==='in'||st==='live') && q===2 && Number.isFinite(c) && c>=0 && c<=10.05);
          }).map(([id])=>id);
          process.stdout.write([...new Set(ids)].join(','));
          NODE
          )
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Halftime fast-path game ids: ${IDS:-none}"

      - name: Build every current halftime 50K board
        if: steps.window.outputs.ids != ''
        env:
          NFL_SIM_FORCE: 1
        run: node scripts/nfl-sim-auto.mjs --game "${{ steps.window.outputs.ids }}" --live-file slates/nfl-live.json

      - name: Verify current halftime boards
        if: steps.window.outputs.ids != ''
        env:
          IDS: ${{ steps.window.outputs.ids }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {halftimeBoardCurrent,isOfficialHalftimeState} from './sports/nfl/halftime-validity.js';
          const ids=String(process.env.IDS||'').split(',').filter(Boolean);
          const ht=JSON.parse(fs.readFileSync('slates/nfl-halftime.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          for(const id of ids){
            const b=(ht.games||[]).find(x=>String(x?.gameId||'')===String(id));
            const raw=live?.games?.[String(id)];
            const g=raw?{gameId:String(id),...raw}:null;
            if(!b?.ready) throw new Error(`halftime board ${id} not ready`);
            if(Number(b.iterations)!==50000) throw new Error(`halftime board ${id} is not 50K`);
            if((b.candidates||[]).length<2) throw new Error(`halftime board ${id} has fewer than 2 props`);
            if(!g) throw new Error(`live snapshot ${id} missing`);
            if(Number(b?.state?.period)!==2) throw new Error(`halftime board ${id} is not a Q2/halftime state`);
            if(Number(b?.state?.awayScore)!==Number(g?.awayScore)||Number(b?.state?.homeScore)!==Number(g?.homeScore)){
              throw new Error(`halftime board ${id} score does not match authoritative live snapshot`);
            }
            if(isOfficialHalftimeState(g)&&!halftimeBoardCurrent(b,g,Date.now())){
              throw new Error(`halftime board ${id} would not unlock READY against the authoritative halftime snapshot`);
            }
            console.log(`✓ ${id}: READY · ${b.candidates.length} props · 50K · score ${g.awayScore}-${g.homeScore} matches live snapshot${isOfficialHalftimeState(g)?' · official halftime gate passed':''}`);
          }
          NODE

      - name: Publish halftime code and boards immediately
        run: |
          git config user.name 'TSO NFL Halftime Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/nfl/sim/auto.js scripts/nfl-halftime-window-refresh.mjs scripts/nfl-sim-auto-selftest.mjs scripts/nfl-halftime-readiness-selftest.mjs sports/nfl/halftime-validity.js slates/nfl-live.json
          [ -e slates/nfl-live-odds.json ] && git add slates/nfl-live-odds.json || true
          [ -e slates/nfl-halftime.json ] && git add slates/nfl-halftime.json || true
          git diff --staged --quiet && echo 'No halftime change to publish.' && exit 0
          git commit -m 'Refresh NFL halftime board from authoritative snapshot'
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt*2))
          done
          exit 1
