name: NFL Halftime Fast Path

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nfl-halftime-fast.yml'
  schedule:
    # GitHub scheduled workflows have a practical 5-minute floor. Start early in Q2
    # and keep the board warm so it is usable before the third quarter begins.
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

jobs:
  halftime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: nfl-halftime-dedicated-fast
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh authoritative NFL live snapshot
        run: node scripts/nfl-live-poller.mjs

      - name: Prefetch sportsbook props from 10:00 Q2 onward
        continue-on-error: true
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          NFL_LIVE_ENDPOINT: https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live
          NFL_HALFTIME_PREFETCH_MINUTES: 10
        run: node scripts/nfl-halftime-window-refresh.mjs

      - name: Build every late-Q2 or halftime 50K board
        env:
          NFL_LIVE_ENDPOINT: https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live
          NFL_SIM_FORCE: 1
        run: |
          GAME_IDS=$(node - <<'NODE'
          const fs=require('fs');
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));

          function rows(doc){
            if(doc?.games && typeof doc.games==='object' && !Array.isArray(doc.games)) return Object.entries(doc.games);
            if(Array.isArray(doc?.games)) return doc.games.map(g=>[String(g?.gameId||g?.id||''),g]);
            if(Array.isArray(doc?.events)) return doc.events.map(g=>[String(g?.gameId||g?.id||''),g]);
            return [];
          }
          function clockMinutes(g){
            const direct=Number(g?.clockMin);
            if(Number.isFinite(direct)) return direct;
            const seconds=Number(g?.secondsRemaining ?? g?.status?.seconds ?? g?.seconds);
            if(Number.isFinite(seconds)) return seconds/60;
            const raw=String(g?.clock ?? g?.lastPlay?.clock ?? '').trim();
            const m=raw.match(/^(\d{1,2}):(\d{2})$/);
            return m ? Number(m[1])+Number(m[2])/60 : NaN;
          }
          function inWindow(g){
            const status=String(g?.status ?? g?.state ?? g?.status?.state ?? '').toLowerCase();
            const detail=`${g?.statusDetail||''} ${g?.status?.detail||''} ${g?.detail||''} ${g?.clock||''}`.toLowerCase();
            const period=Number(g?.period ?? g?.status?.period ?? g?.lastPlay?.period);
            const clock=clockMinutes(g);
            const half=/half\s*time|halftime|end of (?:the )?2nd|end of second/.test(detail);
            const active=['in','live','halftime','half'].includes(status)||half;
            return half || (active && period===2 && Number.isFinite(clock) && clock>=0 && clock<=10.05);
          }

          const ids=rows(live).filter(([,g])=>inWindow(g)).map(([id])=>id).filter(Boolean);
          process.stdout.write([...new Set(ids)].join(','));
          NODE
          )
          echo "Halftime fast-path game ids: ${GAME_IDS:-none}"
          if [ -n "$GAME_IDS" ]; then
            node scripts/nfl-sim-auto.mjs --game "$GAME_IDS"
          fi

      - name: Verify eligible boards when a game is in window
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          let ht={games:[]}; try{ht=JSON.parse(fs.readFileSync('slates/nfl-halftime.json','utf8'));}catch{}

          function rows(doc){
            if(doc?.games && typeof doc.games==='object' && !Array.isArray(doc.games)) return Object.entries(doc.games);
            if(Array.isArray(doc?.games)) return doc.games.map(g=>[String(g?.gameId||g?.id||''),g]);
            if(Array.isArray(doc?.events)) return doc.events.map(g=>[String(g?.gameId||g?.id||''),g]);
            return [];
          }
          function clockMinutes(g){
            const direct=Number(g?.clockMin);
            if(Number.isFinite(direct)) return direct;
            const seconds=Number(g?.secondsRemaining ?? g?.status?.seconds ?? g?.seconds);
            if(Number.isFinite(seconds)) return seconds/60;
            const raw=String(g?.clock ?? g?.lastPlay?.clock ?? '').trim();
            const m=raw.match(/^(\d{1,2}):(\d{2})$/);
            return m ? Number(m[1])+Number(m[2])/60 : NaN;
          }
          function inWindow(g){
            const status=String(g?.status ?? g?.state ?? g?.status?.state ?? '').toLowerCase();
            const detail=`${g?.statusDetail||''} ${g?.status?.detail||''} ${g?.detail||''} ${g?.clock||''}`.toLowerCase();
            const period=Number(g?.period ?? g?.status?.period ?? g?.lastPlay?.period);
            const clock=clockMinutes(g);
            const half=/half\s*time|halftime|end of (?:the )?2nd|end of second/.test(detail);
            const active=['in','live','halftime','half'].includes(status)||half;
            return half || (active && period===2 && Number.isFinite(clock) && clock>=0 && clock<=10.05);
          }

          const ids=rows(live).filter(([,g])=>inWindow(g)).map(([id])=>id).filter(Boolean);
          for(const id of [...new Set(ids)]){
            const b=(ht.games||[]).find(x=>String(x?.gameId||'')===String(id));
            if(!b?.ready) throw new Error(`halftime board ${id} not ready`);
            if(Number(b.iterations)!==50000) throw new Error(`halftime board ${id} not 50K`);
            if((b.candidates||[]).length<2) throw new Error(`halftime board ${id} has fewer than 2 props`);
            console.log(`✓ ${id}: READY · ${b.candidates.length} props · 50K`);
          }
          NODE

      - name: Publish live and halftime outputs immediately
        run: |
          git config user.name 'TSO NFL Halftime Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add slates/nfl-live.json
          [ -e slates/nfl-live-odds.json ] && git add slates/nfl-live-odds.json || true
          [ -e slates/nfl-halftime.json ] && git add slates/nfl-halftime.json || true
          git diff --staged --quiet && echo 'No halftime/live change to publish.' && exit 0
          git commit -m 'Refresh NFL halftime fast path'
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt*2))
          done
          exit 1
