name: NFL Live Simulation v89.18 Checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'sports/nfl/sim/engine-v8918.js'
      - 'sports/nfl/sim/live-replacements.js'
      - 'sports/nfl/sim/engine-v861.js'
      - 'sports/nfl/sim/engine.js'
      - 'sports/nfl/sim/profile.js'
      - 'sports/nfl/sim/auto.js'
      - 'sports/nfl/sim/halftime.js'
      - 'scripts/nfl-v8919-halftime-selftest.mjs'
      - 'scripts/nfl-v87-selftest.mjs'
      - 'sports/nfl/sim/config.json'
      - 'scripts/nfl-sim-auto.mjs'
      - 'scripts/nfl-v8918-live-sim-selftest.mjs'
      - 'scripts/nfl-v893-selftest.mjs'
      - '.github/workflows/nfl-live-sim-v8918-tests.yml'

permissions:
  contents: read

jobs:
  live-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check sports/nfl/sim/engine-v8918.js
          node --check sports/nfl/sim/live-replacements.js
          node --check sports/nfl/sim/auto.js
          node --check scripts/nfl-sim-auto.mjs
          node --check scripts/nfl-v8918-live-sim-selftest.mjs
          node --check scripts/nfl-v893-selftest.mjs
      - name: Live calibration tests
        run: node scripts/nfl-v8918-live-sim-selftest.mjs
      - name: Quarter compatibility tests
        run: node scripts/nfl-v893-selftest.mjs
      - name: Halftime execution and settled ATD tests
        run: node scripts/nfl-v8919-halftime-selftest.mjs
      - name: Halftime board and scheduler regression tests
        run: |
          node scripts/nfl-v87-selftest.mjs
          node scripts/nfl-sim-auto-selftest.mjs
