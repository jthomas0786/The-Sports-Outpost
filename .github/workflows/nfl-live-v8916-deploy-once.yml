name: NFL Live v89.16 One-Time Deploy

on:
  push:
    paths:
      - '.github/workflows/nfl-live-v8916-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credential
        id: auth
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment credential is configured."
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions; skipping deployment."
          fi
      - name: Deploy public nfl-live Edge Function
        if: steps.auth.outputs.ready == '1'
        run: npx --yes supabase@latest functions deploy nfl-live --project-ref hjhfbhpuuxnrexddplxd --no-verify-jwt --use-api
      - name: Verify schema v6 endpoint
        if: steps.auth.outputs.ready == '1'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            BODY="$(curl -fsS 'https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live' || true)"
            if printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.schemaVersion!==6)process.exit(1);console.log('NFL live schema v6 verified');})"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'NFL live endpoint did not report schema v6.' >&2
          exit 1
