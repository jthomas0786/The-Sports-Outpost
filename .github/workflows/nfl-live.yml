name: NFL Live Snapshot

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is a fallback source. For true near-real-time Gamecast,
    # point window.DW_NFL_LIVE_ENDPOINT at a server/edge endpoint running the
    # same scripts/nfl-live-poller.mjs normalization more frequently.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: nfl-live-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build NFL live snapshot
        run: node scripts/nfl-live-poller.mjs
      - name: Commit snapshot only when it changed
        run: |
          if git diff --quiet -- slates/nfl-live.json; then
            echo "No live-state change to publish."
            exit 0
          fi
          git config user.name "TSO NFL Live Bot"
          git config user.email "actions@users.noreply.github.com"
          git add slates/nfl-live.json
          git commit -m "Update NFL live gamecast snapshot"
          git push
