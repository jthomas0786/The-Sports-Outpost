name: NFL Live Snapshot

on:
  workflow_dispatch:
    inputs:
      force_sim:
        description: 'Also force an NFL simulation run now'
        type: boolean
        default: false
  push:
    # Editing this workflow starts one immediate recovery run. Output-only bot
    # commits do not match this path, so they cannot create a trigger loop.
    paths:
      - '.github/workflows/nfl-live.yml'
  schedule:
    # One heartbeat powers live state, halftime props and the simulation gate.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: nfl-live-snapshot
  # Halftime is time-critical. A newer heartbeat should replace an older long
  # pregame-upgrade run so the live halftime board is never stuck behind it.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build NFL live fallback snapshot
        run: node scripts/nfl-live-poller.mjs

      - name: Prefetch v88.4 Q2 / halftime sportsbook props
        continue-on-error: true
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          NFL_LIVE_ENDPOINT: https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live
        run: node scripts/nfl-halftime-window-refresh.mjs

      - name: Run priority Q2 / halftime simulation
        id: priority_halftime
        env:
          NFL_LIVE_ENDPOINT: https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live
        run: |
          GAME_IDS=$(node - <<'NODE'
          const fs=require('fs');
          let live={games:{}};
          try{live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));}catch{}
          const ids=[];
          for(const [id,g] of Object.entries(live.games||{})){
            const status=String(g?.status||'').toLowerCase();
            const detail=String(g?.statusDetail||'').toLowerCase();
            const period=Number(g?.period);
            const clock=Number(g?.clockMin);
            const active=status==='in'||status==='live';
            const inWindow=active && ((period===2 && Number.isFinite(clock) && clock<=5.05) || /half\s*time|halftime|end of (?:the )?2nd|end of second/.test(detail));
            if(inWindow) ids.push(id);
          }
          process.stdout.write(ids.join(','));
          NODE
          )
          echo "game_ids=$GAME_IDS" >> "$GITHUB_OUTPUT"
          if [ -z "$GAME_IDS" ]; then
            echo "No game is in the Q2/halftime priority window."
            exit 0
          fi
          echo "Priority halftime game(s): $GAME_IDS"
          node scripts/nfl-sim-auto.mjs --game "$GAME_IDS"

      - name: Publish priority halftime state immediately
        if: steps.priority_halftime.outputs.game_ids != ''
        run: |
          git config user.name "TSO NFL Live Bot"
          git config user.email "actions@users.noreply.github.com"
          [ -e slates/nfl-live.json ] && git add slates/nfl-live.json || true
          [ -e slates/nfl-live-odds.json ] && git add slates/nfl-live-odds.json || true
          [ -e slates/nfl-sim.json ] && git add slates/nfl-sim.json || true
          [ -e slates/nfl-sim-state.json ] && git add slates/nfl-sim-state.json || true
          [ -e slates/nfl-halftime.json ] && git add slates/nfl-halftime.json || true
          [ -e slates/nfl-quarter.json ] && git add slates/nfl-quarter.json || true
          if git diff --staged --quiet; then
            echo "Priority halftime state already published."
            exit 0
          fi
          git commit -m "Publish priority NFL halftime state"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "priority push rejected — rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 2))
          done
          exit 1

      - name: Run automatic NFL simulation / candidate gates
        env:
          NFL_SIM_FORCE: ${{ inputs.force_sim == true && '1' || '0' }}
          NFL_LIVE_ENDPOINT: https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live
        run: node scripts/nfl-sim-auto.mjs

      - name: Validate simulation cache when present
        run: |
          if [ ! -f slates/nfl-sim.json ]; then
            echo "Simulation cache not generated yet — NFL inputs/checkpoint not ready."
            exit 0
          fi
          node - <<'NODE'
          const fs=require('fs');
          const sim=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const cfg=JSON.parse(fs.readFileSync('sports/nfl/sim/config.json','utf8'));
          if(sim.engineVersion!==cfg.engineVersion) throw new Error(`unexpected engine ${sim.engineVersion}; config expects ${cfg.engineVersion}`);
          if(sim.meta?.pregameIterations!==50000) throw new Error('pregame automation is not 50K');
          if(sim.meta?.halftimeIterations!==50000) throw new Error('halftime automation is not 50K');
          console.log(`✓ ${sim.engineVersion} simulation cache: ${sim.gameCount||0} game(s)`);
          NODE

      - name: Validate halftime candidate board when present
        run: |
          if [ ! -f slates/nfl-halftime.json ]; then
            echo "No halftime candidate board yet."
            exit 0
          fi
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('slates/nfl-halftime.json','utf8'));
          if(h.orchestrationVersion!=='v87.0.0') throw new Error(`unexpected halftime orchestration version ${h.orchestrationVersion}`);
          for(const g of h.games||[]){
            if(g.iterations!==50000) throw new Error('halftime board is not based on 50K simulations');
          }
          console.log(`✓ halftime board: ${h.gameCount||0} game(s)`);
          NODE

      - name: Commit live/simulation outputs only when changed
        run: |
          git config user.name "TSO NFL Live Bot"
          git config user.email "actions@users.noreply.github.com"
          [ -e slates/nfl-live.json ] && git add slates/nfl-live.json || true
          [ -e slates/nfl-sim.json ] && git add slates/nfl-sim.json || true
          [ -e slates/nfl-sim-state.json ] && git add slates/nfl-sim-state.json || true
          [ -e slates/nfl-live-odds.json ] && git add slates/nfl-live-odds.json || true
          [ -e slates/nfl-halftime.json ] && git add slates/nfl-halftime.json || true
          [ -e slates/nfl-quarter.json ] && git add slates/nfl-quarter.json || true
          git diff --staged --quiet && echo "No NFL live/simulation change to publish." && exit 0
          git commit -m "Update NFL live and simulation state"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected — rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 3))
          done
          exit 1