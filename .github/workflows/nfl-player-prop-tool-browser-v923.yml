name: NFL Player Prop Tool Browser QA v94.1

# v94.1 validates the frozen 50K simulation authority, reference-image stat
# categories, Build Style, compact period controls, scrolling, and mobile containment.
on:
  workflow_dispatch:
  push:
    paths:
      - 'sports/nfl/player-prop-tool-v926.js'
      - 'sports/nfl/player-prop-tool-v926.css'
      - 'sports/nfl/player-prop-tool-visibility-v927.css'
      - 'sports/nfl/player-prop-tool-snapshot-v928.js'
      - 'sports/nfl/player-prop-tool-snapshot-v928.css'
      - 'sports/nfl/player-prop-tool-static-guard-v929.js'
      - 'sports/nfl/player-prop-tool-background-freeze-v930.js'
      - 'sports/nfl/player-prop-tool-ux-v930.js'
      - 'sports/nfl/player-prop-tool-controls-v933.js'
      - 'sports/nfl/player-prop-tool-theme-v936.js'
      - 'sports/nfl/player-prop-tool-theme-v936.css'
      - 'sports/nfl/player-prop-tool-polish-v938.js'
      - 'sports/nfl/player-prop-tool-polish-v938.css'
      - 'sports/nfl/player-prop-tool-sim-v939.js'
      - 'sports/nfl/player-prop-tool-build-period-v940.js'
      - 'sports/nfl/player-prop-tool-build-period-v940.css'
      - 'sports/nfl/player-prop-tool-reference-v941.js'
      - 'sports/nfl-preview-v893.js'
      - 'sports/router.js'
      - 'tests/nfl-player-prop-tool-v923.spec.js'
      - 'tests/nfl-player-prop-tool-theme-v936.spec.js'
      - 'tests/nfl-player-prop-tool-polish-v938.spec.js'
      - 'tests/nfl-player-prop-tool-sim-v939.spec.js'
      - 'tests/nfl-player-prop-tool-build-period-v940.spec.js'
      - 'tests/nfl-player-prop-tool-reference-v941.spec.js'
      - '.github/workflows/nfl-player-prop-tool-browser-v923.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static Player Prop Tool regressions
        run: |
          node scripts/nfl-player-prop-tool-v941-selftest.mjs
          node scripts/nfl-player-prop-tool-v940-selftest.mjs
          node scripts/nfl-player-prop-tool-v923-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/nfl-prop-tool-server.log 2>&1 &
          echo $! >/tmp/nfl-prop-tool-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nfl-prop-tool-server.log
          exit 1
      - name: Exercise frozen 50K-simulation Player Prop Tool in Chromium
        run: |
          npx playwright test tests/nfl-player-prop-tool-v923.spec.js tests/nfl-player-prop-tool-theme-v936.spec.js tests/nfl-player-prop-tool-polish-v938.spec.js tests/nfl-player-prop-tool-sim-v939.spec.js tests/nfl-player-prop-tool-build-period-v940.spec.js tests/nfl-player-prop-tool-reference-v941.spec.js --reporter=line --workers=1
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/nfl-prop-tool-server.log || true
