name: NFL Player Prop Tool QA v94.7

on:
  push:
    paths:
      - 'sports/nfl/player-prop-tool-v947.js'
      - 'sports/nfl/player-prop-tool-v947.css'
      - 'sports/nfl-preview-v893.js'
      - 'sports/router.js'
      - 'index.html'
      - 'sports/nfl/sim/full-prop-board-v942.js'
      - 'sports/nfl/sim/quarter-board.js'
      - 'slates/nfl-sim.json'
      - 'tests/nfl-player-prop-tool-v947.spec.js'
      - 'scripts/nfl-player-prop-tool-v947-selftest.mjs'
      - '.github/workflows/nfl-player-prop-tool-v947.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-player-prop-tool-v947
  cancel-in-progress: true

jobs:
  player-prop-tool-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static v94.7 regressions
        run: |
          node scripts/nfl-player-prop-tool-v947-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
      - name: Verify active sportsbook-backed 50K style boards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nfl.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const sim=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const isFinal=id=>['post','final','completed'].includes(String(live?.games?.[id]?.status||'').toLowerCase());
          const required=(slate.games||[]).map(g=>String(g.gameId||g.id||'')).filter(id=>id&&!isFinal(id));
          const byGame=new Map((sim.games||[]).map(g=>[String(g?.game?.gameId||g.gameId||''),g]));
          let styleRows=0;
          for(const id of required){
            const g=byGame.get(id);
            if(Number(g?.iterations)<50000||!g?.propStyles?.ready||!g?.propStyles?.candidates?.length)throw new Error(`Missing 50K propStyles for ${id}`);
            const byId=new Map(g.propStyles.candidates.map(c=>[String(c.id),c]));
            for(const style of ['tsoPick','safest','bestEdge','balanced','aggressive','correlated','longshot']){
              for(const cid of g.propStyles.rankings?.[style]||[]){
                const c=byId.get(String(cid));
                if(!c||Number(c.iterations)<50000||!Number.isFinite(Number(c.line))||!Number.isFinite(Number(c.simProbability)))throw new Error(`${id} ${style} invalid ${cid}`);
                styleRows++;
              }
            }
          }
          if(!styleRows)throw new Error('No sportsbook-backed Bet Style rows found');
          console.log(`✓ ${required.length} active/upcoming games · ${styleRows} 50K Bet Style selections verified`);
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/nfl-ppt-v947.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nfl-ppt-v947.log
          exit 1
      - name: Run uploaded-video and interaction regression
        run: npx playwright test tests/nfl-player-prop-tool-v947.spec.js --reporter=line --workers=1
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/nfl-ppt-v947.log || true
