name: NFL Historical Replay Checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'sports/nfl/sim/**'
      - 'scripts/nfl-replay*.mjs'
      - 'scripts/lib/nfl-*replay*.mjs'
      - 'scripts/lib/nfl-capture.mjs'
      - 'scripts/nfl-capture*.mjs'
      - 'scripts/nfl-live-poller.mjs'
      - '.github/workflows/nfl-archive.yml'
      - '.github/workflows/nfl-replay-tests.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Historical input isolation and production halftime simulation
        run: |
          node scripts/nfl-replay-selftest.mjs
          node scripts/nfl-replay-accuracy-selftest.mjs
          node scripts/nfl-replay-coverage-selftest.mjs
          node scripts/nfl-capture-selftest.mjs
      - name: Replay CLI syntax
        run: |
          node --check scripts/nfl-replay.mjs
          node --check scripts/nfl-replay-sim.mjs
          node --check scripts/nfl-replay-accuracy.mjs
          node --check scripts/nfl-replay-corpus.mjs
          node --check scripts/lib/nfl-replay-io.mjs
