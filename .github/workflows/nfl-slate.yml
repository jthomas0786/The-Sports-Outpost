# .github/workflows/nfl-slate.yml
#
# Rebuilds slates/nfl.json (Touchdown Watch) and commits it, so GitHub Pages
# serves it same-origin next to index.html. Deliberately separate from
# daily-slate.yml: the MLB build must never be blocked by an NFL failure, and
# vice versa. Each job commits only the files it owns.

name: Build NFL slate

on:
  schedule:
    # NFL is a WEEKLY Tuesday→Monday product. Primary roll is 08:00 UTC Tuesday
    # (03:00 Central during daylight time). A 08:30 UTC catch-up protects against
    # GitHub delaying/dropping a top-of-hour scheduled run; it skips automatically
    # when the correct weekly slate already exists.
    - cron: '0 8 * * 2'
    - cron: '30 8 * * 2'
    # Same-week Sunday refresh: updates roster/inactive context without creating
    # a new slate/week. The slateId remains the same until the next Tuesday roll.
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional build date override (YYYY-MM-DD); blank = current NFL week'
        required: false
  # Rebuild immediately whenever this workflow logic itself is repaired/changed.
  # The generated slate commit does not touch this path, so this cannot loop.
  push:
    paths:
      - '.github/workflows/nfl-slate.yml'

permissions:
  contents: write

concurrency:
  # Two overlapping runs would both try to commit slates/nfl.json.
  group: nfl-slate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ESPN's bare scoreboard can continue reporting the just-completed week on
      # Tuesday morning. Resolve the target explicitly: when every current-week
      # game is final, probe the next week and use it when ESPN has games there.
      - name: Resolve current or upcoming NFL week
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync } = require('node:fs');
          const UA = 'okhttp/4.12.0';
          const base = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
          const get = async (url) => {
            const r = await fetch(url, { headers: { 'User-Agent': UA } });
            if (!r.ok) throw new Error(`ESPN ${r.status} for ${url}`);
            return r.json();
          };

          const current = await get(base);
          const season = current.leagues?.[0]?.season || {};
          let year = Number(season.year || new Date().getUTCFullYear());
          let type = Number(season.type?.id || 2);
          let week = Number(season.week || 1);
          let events = Array.isArray(current.events) ? current.events : [];

          const isFinal = (event) => {
            const status = event?.status?.type || event?.competitions?.[0]?.status?.type || {};
            return status.completed === true || String(status.state || '').toLowerCase() === 'post';
          };
          const allFinal = events.length > 0 && events.every(isFinal);

          if (allFinal && week > 0) {
            const candidate = week + 1;
            const nextUrl = `${base}?dates=${year}&seasontype=${type}&week=${candidate}`;
            const next = await get(nextUrl);
            if (Array.isArray(next.events) && next.events.length > 0) {
              week = candidate;
              events = next.events;
              console.log(`Current ESPN week is fully final; advancing build target to week ${week}.`);
            } else {
              console.log(`Current week ${week} is final, but ESPN has no week ${candidate} games yet; keeping week ${week}.`);
            }
          }

          appendFileSync(process.env.GITHUB_ENV, `NFL_SEASON=${year}\nNFL_SEASON_TYPE=${type}\nNFL_WEEK=${week}\nRUN_NFL_BUILD=true\n`);
          console.log(`Resolved NFL target: season=${year} seasontype=${type} week=${week} (${events.length} games)`);
          NODE

      - name: Skip catch-up when primary weekly roll already succeeded
        if: github.event_name == 'schedule' && github.event.schedule == '30 8 * * 2'
        run: |
          node --input-type=commonjs <<'NODE'
          const { existsSync, readFileSync, appendFileSync } = require('node:fs');
          const shortType = { '1': 'pre', '2': 'reg', '3': 'post' }[String(process.env.NFL_SEASON_TYPE)] || 'reg';
          let fresh = false;
          if (existsSync('slates/nfl.json')) {
            try {
              const s = JSON.parse(readFileSync('slates/nfl.json', 'utf8'));
              fresh = Number(s.season) === Number(process.env.NFL_SEASON)
                && Number(s.week) === Number(process.env.NFL_WEEK)
                && String(s.seasonType) === shortType;
            } catch {}
          }
          if (fresh) {
            console.log(`Primary roll already produced ${process.env.NFL_SEASON} ${shortType} week ${process.env.NFL_WEEK}; catch-up is a no-op.`);
            appendFileSync(process.env.GITHUB_ENV, 'RUN_NFL_BUILD=false\n');
          } else {
            console.log('Primary roll is missing/stale; catch-up will rebuild the weekly slate.');
          }
          NODE

      # No npm install needed — the adapter uses only Node's built-in fetch.
      - name: Build the NFL slate
        if: env.RUN_NFL_BUILD != 'false'
        run: |
          mkdir -p slates
          if [ -n "${{ inputs.date }}" ]; then
            node build-slate.js --sport nfl --season "$NFL_SEASON" --seasontype "$NFL_SEASON_TYPE" --week "$NFL_WEEK" --date "${{ inputs.date }}" --out slates/nfl.json --verbose
          else
            node build-slate.js --sport nfl --season "$NFL_SEASON" --seasontype "$NFL_SEASON_TYPE" --week "$NFL_WEEK" --out slates/nfl.json --verbose
          fi

      - name: Sanity check output
        if: env.RUN_NFL_BUILD != 'false'
        run: |
          cat > /tmp/check-nfl.mjs << 'SCRIPT_EOF'
          import { readFileSync } from 'node:fs';
          const raw = readFileSync('slates/nfl.json', 'utf8');
          let s;
          try {
            s = JSON.parse(raw);
          } catch (err) {
            const m = raw.match(/:\s*(NaN|Infinity|-Infinity)/);
            if (m) {
              const at = raw.indexOf(m[0]);
              console.error('::error::slates/nfl.json contains bare ' + m[1] + ', which is not valid JSON.');
              console.error('Context: ' + raw.slice(Math.max(0, at - 120), at + 120).replace(/\n/g, ' '));
            } else {
              console.error('::error::slates/nfl.json is not valid JSON: ' + err.message);
              console.error('Context: ' + raw.slice(0, 300));
            }
            process.exit(1);
          }
          if (!Array.isArray(s.games)) { console.error('::error::malformed slate — no games array'); process.exit(1); }
          const players = s.games.reduce((n, g) => n + (g.players || []).length, 0);
          console.log('✓ ' + s.games.length + ' games, ' + players + ' players graded');
          console.log('  ' + s.seasonType + ' week ' + s.week + ' for ' + s.date + ', generated ' + s.generatedAt);
          const byStatus = s.games.reduce((a, g) => ((a[g.status] = (a[g.status] || 0) + 1), a), {});
          console.log('  status: ' + JSON.stringify(byStatus));
          console.log('  confidence: ' + JSON.stringify(s.rosters?.dataConfidence || {}));

          if (Number(s.season) !== Number(process.env.NFL_SEASON) || Number(s.week) !== Number(process.env.NFL_WEEK)) {
            console.error(`::error::builder returned ${s.season} week ${s.week}; expected ${process.env.NFL_SEASON} week ${process.env.NFL_WEEK}`);
            process.exit(1);
          }
          // A Tuesday weekly roll must not silently republish a fully completed
          // slate when ESPN already exposed the upcoming week.
          if (s.games.length && s.games.every(g => g.status === 'post') && process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch') {
            console.error('::error::refusing to publish an all-final weekly slate');
            process.exit(1);
          }

          // An empty slate is legitimate in the offseason / on a bye day, but a
          // slate with games and no graded players means the roster join broke.
          if (s.games.length && players === 0) {
            console.error('::error::' + s.games.length + ' games but 0 graded players — roster/depth join failed.');
            process.exit(1);
          }
          // Guard the AZ/ARI-style abbreviation mismatch that silently empties a team.
          const staffed = new Set(s.games.flatMap(g => (g.players || []).map(p => p.team)));
          const empty = s.games.flatMap(g => [g.away.abbr, g.home.abbr]).filter(a => !staffed.has(a));
          if (empty.length) {
            console.error('::error::teams with zero graded players: ' + [...new Set(empty)].join(', '));
            process.exit(1);
          }
          (s.warnings || []).forEach(w => console.log('  warn: ' + w));
          SCRIPT_EOF
          node /tmp/check-nfl.mjs

      - name: Commit if changed
        if: env.RUN_NFL_BUILD != 'false'
        run: |
          git config user.name  'slate-bot'
          git config user.email 'actions@github.com'

          # NFL owns only slates/nfl.json. MLB model-logs are intentionally
          # excluded so NFL refreshes can never rewrite calibration-history.json.
          git add slates/nfl.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "nfl slate: $(date -u +%Y-%m-%d)"

          # push.yml auto-commits every few minutes, so the checkout can go stale
          # while the build runs. Rebase onto whatever arrived and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto remote (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              echo "::error::rebase failed — resolve the conflict in slates/nfl.json manually"
              exit 1
            }
            sleep $((attempt * 3))
          done

          echo "::error::could not push after 5 attempts"
          exit 1
