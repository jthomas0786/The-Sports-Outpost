# .github/workflows/nfl-slate.yml
#
# Rebuilds the weekly NFL slate plus the synchronized research file consumed by
# the player modal. Publishing both together prevents a fresh slate from being
# paired with stale previous-week matchup context.

name: Build NFL slate

on:
  schedule:
    # NFL is a WEEKLY Tuesday→Monday product. Primary roll is 08:00 UTC Tuesday
    # (03:00 Central during daylight time). A 08:30 UTC catch-up protects against
    # GitHub delaying/dropping a top-of-hour scheduled run; it skips automatically
    # when the correct weekly slate already exists.
    - cron: '0 8 * * 2'
    - cron: '30 8 * * 2'
    # Same-week Sunday refresh: updates roster/inactive context without creating
    # a new slate/week. The slateId remains the same until the next Tuesday roll.
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional build date override (YYYY-MM-DD); blank = current NFL week'
        required: false
  push:
    paths:
      - '.github/workflows/nfl-slate.yml'

permissions:
  contents: write

concurrency:
  group: nfl-slate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve current or upcoming NFL week
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const UA = 'okhttp/4.12.0';
          const base = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
          const get = async (url) => {
            const r = await fetch(url, { headers: { 'User-Agent': UA } });
            if (!r.ok) throw new Error(`ESPN ${r.status} for ${url}`);
            return r.json();
          };

          const current = await get(base);
          const season = current.leagues?.[0]?.season || {};
          let year = Number(season.year || new Date().getUTCFullYear());
          let type = Number(season.type?.id || 2);
          const reportedWeek = Math.max(1, Number(season.week || 1));
          let week = reportedWeek;
          let events = [];

          const isFinal = (event) => {
            const status = event?.status?.type || event?.competitions?.[0]?.status?.type || {};
            return status.completed === true || String(status.state || '').toLowerCase() === 'post';
          };

          // ESPN's default scoreboard can be empty during the Tuesday rollover
          // while season.week still points at the week that just finished. Do not
          // use an empty default payload as evidence that the reported week is
          // still current. Explicitly probe weekly scoreboards and select the
          // first week at/after ESPN's reported week that contains a non-final
          // game. This naturally rolls Week 2 -> Week 3, etc. without hard-coding.
          const probes = [];
          for (let candidate = reportedWeek; candidate <= reportedWeek + 3; candidate++) {
            const url = `${base}?dates=${year}&seasontype=${type}&week=${candidate}`;
            const doc = await get(url);
            const games = Array.isArray(doc.events) ? doc.events : [];
            const nonFinal = games.filter(event => !isFinal(event));
            probes.push({ candidate, games: games.length, nonFinal: nonFinal.length });
            if (games.length > 0 && nonFinal.length > 0) {
              week = candidate;
              events = games;
              break;
            }
          }

          if (!events.length) {
            // End-of-season / provider-delay fallback: keep the reported week,
            // but still use its explicit weekly scoreboard rather than the
            // potentially empty default scoreboard response.
            const fallback = await get(`${base}?dates=${year}&seasontype=${type}&week=${reportedWeek}`);
            events = Array.isArray(fallback.events) ? fallback.events : [];
            week = reportedWeek;
            console.log(`No upcoming non-final NFL week found in probe window; keeping reported week ${week}.`);
          } else if (week !== reportedWeek) {
            console.log(`ESPN reported week ${reportedWeek}, but it has no remaining games; advancing build target to week ${week}.`);
          }

          console.log('NFL week probes:', JSON.stringify(probes));
          appendFileSync(process.env.GITHUB_ENV, `NFL_SEASON=${year}\nNFL_SEASON_TYPE=${type}\nNFL_WEEK=${week}\nRUN_NFL_BUILD=true\n`);
          console.log(`Resolved NFL target: season=${year} seasontype=${type} week=${week} (${events.length} games)`);
          NODE

      - name: Skip catch-up when primary weekly roll already succeeded
        if: github.event_name == 'schedule' && github.event.schedule == '30 8 * * 2'
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          const shortType = { '1': 'pre', '2': 'reg', '3': 'post' }[String(process.env.NFL_SEASON_TYPE)] || 'reg';
          let fresh = false;
          if (existsSync('slates/nfl.json')) {
            try {
              const s = JSON.parse(readFileSync('slates/nfl.json', 'utf8'));
              fresh = Number(s.season) === Number(process.env.NFL_SEASON)
                && Number(s.week) === Number(process.env.NFL_WEEK)
                && String(s.seasonType) === shortType;
            } catch {}
          }
          if (fresh) {
            console.log(`Primary roll already produced ${process.env.NFL_SEASON} ${shortType} week ${process.env.NFL_WEEK}; catch-up is a no-op.`);
            appendFileSync(process.env.GITHUB_ENV, 'RUN_NFL_BUILD=false\n');
          } else {
            console.log('Primary roll is missing/stale; catch-up will rebuild the weekly slate.');
          }
          NODE

      - name: Build the NFL slate
        if: env.RUN_NFL_BUILD != 'false'
        run: |
          mkdir -p slates
          if [ -n "${{ inputs.date }}" ]; then
            node build-slate.js --sport nfl --season "$NFL_SEASON" --seasontype "$NFL_SEASON_TYPE" --week "$NFL_WEEK" --date "${{ inputs.date }}" --out slates/nfl.json --verbose
          else
            node build-slate.js --sport nfl --season "$NFL_SEASON" --seasontype "$NFL_SEASON_TYPE" --week "$NFL_WEEK" --out slates/nfl.json --verbose
          fi

      - name: Sanity check slate output
        if: env.RUN_NFL_BUILD != 'false'
        run: |
          cat > /tmp/check-nfl.mjs << 'SCRIPT_EOF'
          import { readFileSync } from 'node:fs';
          const raw = readFileSync('slates/nfl.json', 'utf8');
          let s;
          try {
            s = JSON.parse(raw);
          } catch (err) {
            const m = raw.match(/:\s*(NaN|Infinity|-Infinity)/);
            if (m) {
              const at = raw.indexOf(m[0]);
              console.error('::error::slates/nfl.json contains bare ' + m[1] + ', which is not valid JSON.');
              console.error('Context: ' + raw.slice(Math.max(0, at - 120), at + 120).replace(/\n/g, ' '));
            } else {
              console.error('::error::slates/nfl.json is not valid JSON: ' + err.message);
              console.error('Context: ' + raw.slice(0, 300));
            }
            process.exit(1);
          }
          if (!Array.isArray(s.games)) { console.error('::error::malformed slate — no games array'); process.exit(1); }
          const players = s.games.reduce((n, g) => n + (g.players || []).length, 0);
          console.log('✓ ' + s.games.length + ' games, ' + players + ' players graded');
          console.log('  ' + s.seasonType + ' week ' + s.week + ' for ' + s.date + ', generated ' + s.generatedAt);
          const byStatus = s.games.reduce((a, g) => ((a[g.status] = (a[g.status] || 0) + 1), a), {});
          console.log('  status: ' + JSON.stringify(byStatus));
          console.log('  confidence: ' + JSON.stringify(s.rosters?.dataConfidence || {}));

          if (Number(s.season) !== Number(process.env.NFL_SEASON) || Number(s.week) !== Number(process.env.NFL_WEEK)) {
            console.error(`::error::builder returned ${s.season} week ${s.week}; expected ${process.env.NFL_SEASON} week ${process.env.NFL_WEEK}`);
            process.exit(1);
          }
          if (s.games.length && s.games.every(g => g.status === 'post') && process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch') {
            console.error('::error::refusing to publish an all-final weekly slate');
            process.exit(1);
          }
          if (s.games.length && players === 0) {
            console.error('::error::' + s.games.length + ' games but 0 graded players — roster/depth join failed.');
            process.exit(1);
          }
          const staffed = new Set(s.games.flatMap(g => (g.players || []).map(p => p.team)));
          const empty = s.games.flatMap(g => [g.away.abbr, g.home.abbr]).filter(a => !staffed.has(a));
          if (empty.length) {
            console.error('::error::teams with zero graded players: ' + [...new Set(empty)].join(', '));
            process.exit(1);
          }
          (s.warnings || []).forEach(w => console.log('  warn: ' + w));
          SCRIPT_EOF
          node /tmp/check-nfl.mjs

      - name: Build synchronized NFL research data
        if: env.RUN_NFL_BUILD != 'false'
        run: node scripts/nfl-research.mjs

      - name: Verify slate and player-modal matchup alignment
        if: env.RUN_NFL_BUILD != 'false'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const slate=JSON.parse(readFileSync('slates/nfl.json','utf8'));
          const research=JSON.parse(readFileSync('slates/nfl-research.json','utf8'));
          const aliases={LAR:'LA',JAC:'JAX',WAS:'WSH',OAK:'LV',SD:'LAC',STL:'LA'};
          const nt=v=>aliases[String(v||'').toUpperCase()]||String(v||'').toUpperCase();
          const nn=v=>String(v||'').toLowerCase().replace(/\./g,'').replace(/['’]/g,'').replace(/\s+(jr|sr|ii|iii|iv|v)\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const expected=new Map();
          for(const g of slate.games||[]){
            const away=nt(g.away?.abbr),home=nt(g.home?.abbr);
            for(const p of g.players||[]){
              const team=nt(p.team);
              const opp=team===away?home:team===home?away:nt(p.opponent);
              expected.set(`${team}|${nn(p.name)}`,opp);
            }
          }
          let matched=0;const bad=[];
          for(const p of research.players||[]){
            const key=`${nt(p.team)}|${nn(p.name)}`;
            if(!expected.has(key)) continue;
            matched++;
            const want=expected.get(key),got=nt(p.matchup?.opponent);
            if(want!==got) bad.push(`${p.name}: ${got||'none'} != ${want}`);
          }
          if(!matched){console.error('::error::research file matched zero current-slate players');process.exit(1);}
          if(bad.length){console.error('::error::stale NFL research matchup context: '+bad.slice(0,12).join('; '));process.exit(1);}
          console.log(`✓ ${matched} current-slate research players match week ${slate.week} opponents`);
          NODE

      - name: Commit if changed
        if: env.RUN_NFL_BUILD != 'false'
        run: |
          git config user.name  'slate-bot'
          git config user.email 'actions@github.com'

          # Publish the weekly slate and the player-modal research context in the
          # same commit so the UI can never see a new week with an old opponent.
          git add slates/nfl.json slates/nfl-research.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "nfl slate + research: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto remote (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              echo "::error::rebase failed — resolve NFL slate/research conflict manually"
              exit 1
            }
            sleep $((attempt * 3))
          done

          echo "::error::could not push after 5 attempts"
          exit 1
