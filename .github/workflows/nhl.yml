name: NHL Data and Tests
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sports/nhl/**'
      - 'sports/registry.js'
      - 'sports/router.js'
      - 'scripts/nhl-*.mjs'
      - 'scripts/parlayapi-pregame-cadence.mjs'
      - 'scripts/parlayapi-pregame-cadence-selftest.mjs'
      - 'scripts/player-modal-parity-selftest.mjs'
      - '.github/workflows/nhl.yml'
permissions:
  contents: write
concurrency:
  group: nhl-data
  cancel-in-progress: false
jobs:
  hockey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: NHL regression scenarios
        run: |
          node scripts/parlayapi-pregame-cadence-selftest.mjs
          node --check sports/nhl/odds.js
          node --check scripts/nhl-odds.mjs
          node --check sports/nhl/view.js
          node --check sports/nhl/view-v906.js
          node --check sports/nhl/launch-v922.js
          node --check sports/nhl/puck-line-jesus.js
          node --check sports/nhl/puck-line-jesus-alerts-v925.js
          node --check scripts/nhl-plj-history-lib.mjs
          node --check scripts/nhl-plj-history.mjs
          node --check sports/nhl/props-daily-guard-v919.js
          node --check sports/nhl/props-daily-guard-v920.js
          node --check sports/nhl/props-model.js
          node --check sports/nhl/gamecast.js
          node --check sports/nhl/slate-v906.js
          node --check sports/nhl/player-modal-v911.js
          node --check sports/nhl/player-modal-v912.js
          node --check sports/nhl/player-modal-v913.js
          node --check sports/nhl/player-modal-v917.js
          node --check sports/nhl/player-modal-v918.js
          node --check sports/nhl/player-modal-v921.js
          node scripts/nhl-selftest.mjs
          node scripts/nhl-daily-slate-selftest.mjs
          node scripts/nhl-props-baseline-selftest.mjs
          node scripts/nhl-v901-selftest.mjs
          node scripts/nhl-lineups-selftest.mjs
          node scripts/nhl-gamecast-selftest.mjs
          node scripts/nhl-slate-v906-selftest.mjs
          node scripts/nhl-player-modal-selftest.mjs
          node scripts/player-modal-parity-selftest.mjs
          node scripts/nhl-launch-v922-selftest.mjs
          node scripts/nhl-puck-line-jesus-selftest.mjs
          node scripts/nhl-plj-history-selftest.mjs
      - name: Refresh NHL slate
        run: node scripts/nhl-refresh.mjs
      - name: Update verified season research
        run: node scripts/nhl-research.mjs
      - name: Refresh sportsbook markets from primary ParlayAPI
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          NHL_ODDS_FORCE: ${{ github.event_name == 'push' && '1' || (github.event_name == 'workflow_dispatch' && '1' || '0') }}
        run: node scripts/nhl-odds.mjs
      - name: Validate ParlayPing-compatible NHL snapshot
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nhl.json','utf8'));
          const d=JSON.parse(fs.readFileSync('slates/nhl-odds.json','utf8'));
          const plj=JSON.parse(fs.readFileSync('slates/nhl-puck-lines.json','utf8'));
          if(d.meta?.source!=='parlayapi'||d.meta?.sample!==false) throw new Error('NHL snapshot is not verified ParlayAPI data');
          if(!Array.isArray(d.rows)) throw new Error('NHL snapshot is missing ParlayPing rows');
          if(!Array.isArray(d.gameLines)) throw new Error('NHL snapshot is missing game-line rows');
          if(plj.source!=='parlayapi'||plj.sample!==false||!Array.isArray(plj.games)) throw new Error('NHL puck-line snapshot is malformed');
          const zero=v=>v!==null&&v!==undefined&&v!==''&&Number(v)===0;
          if((d.rows||[]).some(r=>zero(r.overPrice)||zero(r.underPrice))) throw new Error('NHL snapshot contains a zero price');
          const gameIds=new Set((slate.games||[]).map(g=>String(g.id)));
          if((d.rows||[]).some(r=>r.gameId&&gameIds.size&&!gameIds.has(String(r.gameId)))) throw new Error('NHL odds row points outside refreshed slate');
          if((plj.games||[]).some(r=>r.gameId&&gameIds.size&&!gameIds.has(String(r.gameId)))) throw new Error('NHL puck-line row points outside refreshed slate');
          if((plj.games||[]).some(r=>r.puckLine&&Number(r.puckLine.line)!==-1.5)) throw new Error('Puck Line Jesus snapshot contains a non -1.5 favorite line');
          if(!slate.date||!Array.isArray(slate.games)) throw new Error('Refreshed NHL slate is malformed');
          console.log(`✓ NHL ${slate.date} games=${slate.games.length} ParlayAPI rows=${d.rows.length} puckLines=${plj.games.filter(g=>g.puckLine).length} links=${d.meta.nativeLinkRows||0} sids=${d.meta.nativeSidRows||0}`);
          NODE
      - name: Update Puck Line Jesus season history
        run: node scripts/nhl-plj-history.mjs
      - name: Simulate eligible full games
        run: node scripts/nhl-simulate.mjs
      - name: Publish NHL data only
        run: |
          git config user.name "TSO NHL Bot"
          git config user.email "actions@users.noreply.github.com"
          tmpdir="$(mktemp -d)"
          cp slates/nhl.json "$tmpdir/nhl.json"
          cp slates/nhl-research.json "$tmpdir/nhl-research.json"
          cp slates/nhl-odds.json "$tmpdir/nhl-odds.json"
          cp slates/nhl-puck-lines.json "$tmpdir/nhl-puck-lines.json"
          cp slates/nhl-plj-history.json "$tmpdir/nhl-plj-history.json"
          cp slates/nhl-sim.json "$tmpdir/nhl-sim.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmpdir/nhl.json" slates/nhl.json
            cp "$tmpdir/nhl-research.json" slates/nhl-research.json
            cp "$tmpdir/nhl-odds.json" slates/nhl-odds.json
            cp "$tmpdir/nhl-puck-lines.json" slates/nhl-puck-lines.json
            cp "$tmpdir/nhl-plj-history.json" slates/nhl-plj-history.json
            cp "$tmpdir/nhl-sim.json" slates/nhl-sim.json
            git add slates/nhl.json slates/nhl-research.json slates/nhl-odds.json slates/nhl-puck-lines.json slates/nhl-plj-history.json slates/nhl-sim.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Refresh NHL slate"
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
