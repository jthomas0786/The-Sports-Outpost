name: One-time MLB Gamecast showcase capture
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-gamecast-showcase.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Build showcase harness
        run: |
          GAME_PK=$(node --input-type=module - <<'NODE'
          outer: for(const n of [1,2,3,4,5,6,7]){
            const date=new Date(Date.now()-n*86400000).toISOString().slice(0,10);
            const sched=await (await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}`)).json();
            for(const g of (sched.dates||[]).flatMap(d=>d.games||[])){
              try{
                const feed=await (await fetch(`https://statsapi.mlb.com/api/v1.1/game/${g.gamePk}/feed/live?language=en`)).json();
                const plays=feed?.liveData?.plays?.allPlays||[];
                if(plays.some(p=>String(p?.result?.eventType||'').toLowerCase()==='home_run' && p?.hitData)){
                  console.log(g.gamePk);
                  break outer;
                }
              }catch{}
            }
          }
          NODE
          )
          test -n "$GAME_PK"
          echo "$GAME_PK" > /tmp/gamepk
          cat > /tmp/mlb-gamecast-showcase.html <<EOF
          <!doctype html><html lang="en" data-sport="mlb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#020814;color:#fff;font-family:Arial}body{padding:12px}#tsoMlbInlineGamecast{width:min(1512px,calc(100vw - 24px));margin:auto}.mlb-live-gc-shell{min-height:0}</style></head><body><div id="tsoMlbInlineGamecast" data-game-pk="$GAME_PK"><div class="mlb-live-gc-shell"></div></div><script type="module">
          import {installMlbPlaystageV901} from '/sports/mlb/playstage-v901.js?v=showcase';
          import {installMlbPlaystageConceptV904} from '/sports/mlb/playstage-concept-v904.js?v=showcase';
          import {installMlbPlaystageConceptV905} from '/sports/mlb/playstage-concept-v905.js?v=showcase';
          import {installMlbPlaystageConceptV906} from '/sports/mlb/playstage-concept-v906.js?v=showcase';
          import {installMlbPlaystageConceptV907} from '/sports/mlb/playstage-concept-v907.js?v=showcase';
          import {installMlbPlaystageConceptV908} from '/sports/mlb/playstage-concept-v908.js?v=showcase';
          import {installMlbPlaystageConceptV909} from '/sports/mlb/playstage-concept-v909.js?v=showcase';
          import {installMlbPlaystageConceptV910} from '/sports/mlb/playstage-concept-v910.js?v=showcase';
          import {installMlbPlaystageConceptV911} from '/sports/mlb/playstage-concept-v911.js?v=showcase';
          import {installMlbPlaystageConceptV912} from '/sports/mlb/playstage-concept-v912.js?v=showcase';
          import {installMlbPlaystageConceptV913} from '/sports/mlb/playstage-concept-v913.js?v=showcase';
          import {installMlbPlaystageConceptV914} from '/sports/mlb/playstage-concept-v914.js?v=showcase';
          import {installMlbPlaystageConceptV915} from '/sports/mlb/playstage-concept-v915.js?v=showcase';
          installMlbPlaystageV901();installMlbPlaystageConceptV904();installMlbPlaystageConceptV905();installMlbPlaystageConceptV906();installMlbPlaystageConceptV907();installMlbPlaystageConceptV908();installMlbPlaystageConceptV909();installMlbPlaystageConceptV910();installMlbPlaystageConceptV911();installMlbPlaystageConceptV912();installMlbPlaystageConceptV913();installMlbPlaystageConceptV914();installMlbPlaystageConceptV915();
          </script></body></html>
          EOF
      - name: Capture desktop mobile and simulation
        run: |
          cp /tmp/mlb-gamecast-showcase.html mlb-gamecast-showcase.html
          python3 -m http.server 4173 >/tmp/tso-showcase-http.log 2>&1 & SERVER_PID=$!
          mkdir -p qa/showcase /tmp/showcase-video
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const gamePk=fs.readFileSync('/tmp/gamepk','utf8').trim();
          const patchFeed=async route=>{
            const response=await route.fetch();
            const feed=await response.json();
            const plays=feed?.liveData?.plays?.allPlays||[];
            const target=[...plays].reverse().find(p=>String(p?.result?.eventType||'').toLowerCase()==='home_run' && p?.hitData);
            if(target){
              feed.liveData.plays.currentPlay=target;
              feed.gameData.status={...(feed.gameData.status||{}),detailedState:'In Progress'};
            }
            await route.fulfill({status:response.status(),headers:response.headers(),contentType:'application/json',body:JSON.stringify(feed)});
          };
          async function ready(page){
            await page.waitForSelector('.tso-mlb-concept-v915',{timeout:30000});
            await page.waitForFunction(()=>{const f=document.querySelector('.ps914-field');return f?.complete&&f.naturalWidth>0&&f.getAttribute('src')==='./field-bg.jpg'},{timeout:30000});
          }
          const browser=await chromium.launch({headless:true});
          const desktop=await browser.newPage({viewport:{width:1536,height:1100},deviceScaleFactor:1});
          await desktop.route('https://statsapi.mlb.com/api/v1.1/game/**/feed/live?language=en',patchFeed);
          await desktop.goto('http://127.0.0.1:4173/mlb-gamecast-showcase.html',{waitUntil:'domcontentloaded'});
          await ready(desktop); await desktop.waitForTimeout(4200);
          await desktop.locator('.tso-mlb-playstage-v901').screenshot({path:'qa/showcase/mlb-gamecast-desktop.png'});
          const d=await desktop.evaluate(()=>({headline:document.querySelector('.ps-play-banner b')?.textContent,metrics:[...document.querySelectorAll('.ps-metric b')].map(x=>x.textContent),field:[document.querySelector('.ps914-field')?.naturalWidth,document.querySelector('.ps914-field')?.naturalHeight]}));
          const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await mobile.route('https://statsapi.mlb.com/api/v1.1/game/**/feed/live?language=en',patchFeed);
          await mobile.goto('http://127.0.0.1:4173/mlb-gamecast-showcase.html',{waitUntil:'domcontentloaded'});
          await ready(mobile); await mobile.waitForTimeout(4200);
          await mobile.locator('.tso-mlb-playstage-v901').screenshot({path:'qa/showcase/mlb-gamecast-mobile.png'});
          const m=await mobile.evaluate(()=>({viewport:innerWidth,docWidth:document.documentElement.scrollWidth,headline:document.querySelector('.ps-play-banner b')?.textContent,fonts:{atBat:parseFloat(getComputedStyle(document.querySelector('.v915-atbat-card .ps-player h3')).fontSize),pitcher:parseFloat(getComputedStyle(document.querySelector('.v915-pitcher-card .ps-player h3')).fontSize),event:parseFloat(getComputedStyle(document.querySelector('.ps-play-banner b')).fontSize),metric:parseFloat(getComputedStyle(document.querySelector('.ps-metric b')).fontSize)}}));
          await browser.close();

          const videoContext=await chromium.launchPersistentContext('/tmp/tso-video-profile',{headless:true,viewport:{width:1280,height:900},recordVideo:{dir:'/tmp/showcase-video',size:{width:1280,height:900}}});
          const page=videoContext.pages()[0];
          await page.route('https://statsapi.mlb.com/api/v1.1/game/**/feed/live?language=en',patchFeed);
          await page.goto('http://127.0.0.1:4173/mlb-gamecast-showcase.html',{waitUntil:'domcontentloaded'});
          await ready(page);
          await page.waitForTimeout(6500);
          await videoContext.close();
          const videos=fs.readdirSync('/tmp/showcase-video').filter(x=>x.endsWith('.webm'));
          if(!videos.length) throw new Error('No simulation video captured');
          fs.copyFileSync('/tmp/showcase-video/'+videos[0],'qa/showcase/mlb-gamecast-home-run-simulation.webm');
          fs.writeFileSync('qa/showcase/mlb-gamecast-showcase.json',JSON.stringify({gamePk,desktop:d,mobile:m},null,2));
          if(d.headline!=='Home Run'||m.headline!=='Home Run'||m.docWidth>m.viewport+1||m.fonts.atBat<10||m.fonts.pitcher<10||m.fonts.event<11||m.fonts.metric<9)process.exitCode=3;
          NODE
          ffmpeg -y -i qa/showcase/mlb-gamecast-home-run-simulation.webm -vf "fps=10,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" -loop 0 qa/showcase/mlb-gamecast-home-run-simulation.gif >/tmp/ffmpeg-gif.log 2>&1
          ffmpeg -y -i qa/showcase/mlb-gamecast-home-run-simulation.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart qa/showcase/mlb-gamecast-home-run-simulation.mp4 >/tmp/ffmpeg-mp4.log 2>&1
          rm -f mlb-gamecast-showcase.html
          kill $SERVER_PID || true
      - name: Commit showcase media
        run: |
          git config user.name 'TSO MLB Showcase Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qa/showcase/mlb-gamecast-desktop.png qa/showcase/mlb-gamecast-mobile.png qa/showcase/mlb-gamecast-home-run-simulation.gif qa/showcase/mlb-gamecast-home-run-simulation.mp4 qa/showcase/mlb-gamecast-home-run-simulation.webm qa/showcase/mlb-gamecast-showcase.json
          git commit -m 'qa: add MLB Gamecast desktop mobile and simulation showcase'
          git pull --rebase origin main
          git push origin HEAD:main
