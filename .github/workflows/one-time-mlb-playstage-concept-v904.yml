name: One-time MLB PlayStage approved concept v904

on:
  push:
    paths:
      - '.github/workflows/one-time-mlb-playstage-concept-v904.yml'
      - 'scripts/apply-mlb-playstage-concept-v904.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved concept wiring
        run: node scripts/apply-mlb-playstage-concept-v904.mjs
      - name: Syntax and regression
        run: |
          node --check sports/router.js
          node --check sports/mlb/playstage-v901.js
          node --check sports/mlb/playstage-concept-v904.js
          node scripts/mlb-playstage-selftest.mjs
          node scripts/live-game-switcher-selftest.mjs
      - name: Commit approved concept
        run: |
          git config user.name 'TSO PlayStage Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sports/router.js sports/mlb/playstage-concept-v904.js scripts/mlb-playstage-selftest.mjs
          git commit -m 'Wire approved MLB PlayStage concept v904'
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
