name: One-time MLB PlayStage finalize

on:
  push:
    paths:
      - '.github/workflows/one-time-mlb-playstage-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix inning side and force PlayStage cache graph
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('sports/mlb/playstage-v901.js')
          s=p.read_text()
          old="function offenseSide(feed){const half=String(feed?.liveData?.linescore?.inningHalf||feed?.liveData?.linescore?.isTopInning?'Top':'Bottom').toLowerCase();return half.includes('top')?'away':'home';}"
          new="function offenseSide(feed){const ls=feed?.liveData?.linescore||{};const half=String(ls.inningHalf||'').toLowerCase();if(half.includes('top'))return'away';if(half.includes('bottom'))return'home';return ls.isTopInning?'away':'home';}"
          if old not in s:
              raise SystemExit('offenseSide source marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('sports/router.js')
          s=p.read_text()
          old="./mlb/playstage-v901.js?v=90.1"
          new="./mlb/playstage-v901.js?v=90.2"
          if old not in s:
              raise SystemExit('router PlayStage cache marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('scripts/mlb-playstage-selftest.mjs')
          s=p.read_text()
          old="./mlb/playstage-v901.js?v=90.1"
          new="./mlb/playstage-v901.js?v=90.2"
          if old not in s:
              raise SystemExit('PlayStage selftest cache marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('index.html')
          s=p.read_text()
          import re
          s,n=re.subn(r'(\./sports/router\.js\?v=)[A-Za-z0-9._-]+',r'\g<1>90.8',s,count=1)
          if n != 1:
              raise SystemExit('outer router cache marker missing')
          p.write_text(s)
          PY
      - name: Commit finalized PlayStage graph
        run: |
          git config user.name 'TSO PlayStage Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/mlb/playstage-v901.js sports/router.js scripts/mlb-playstage-selftest.mjs index.html
          if git diff --cached --quiet; then
            echo 'Already finalized'
            exit 0
          fi
          git commit -m 'Finalize MLB PlayStage live state and cache graph'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
