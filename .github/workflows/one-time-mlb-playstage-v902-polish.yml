name: One-time MLB PlayStage v902 polish

on:
  push:
    paths:
      - '.github/workflows/one-time-mlb-playstage-v902-polish.yml'
      - 'scripts/mlb-playstage-v902-polish.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply PlayStage polish
        run: python scripts/mlb-playstage-v902-polish.py
      - name: Syntax and regression
        run: |
          node --check sports/mlb/playstage-v901.js
          node --check sports/router.js
          node scripts/mlb-playstage-selftest.mjs
          node scripts/live-game-switcher-selftest.mjs
      - name: Commit polished PlayStage
        run: |
          git config user.name 'TSO PlayStage Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/mlb/playstage-v901.js sports/router.js scripts/mlb-playstage-selftest.mjs index.html
          git commit -m 'Polish MLB PlayStage runner and fielding motion'
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
