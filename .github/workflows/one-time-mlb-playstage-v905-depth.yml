name: One-time MLB PlayStage v905 depth pass

on:
  push:
    paths:
      - '.github/workflows/one-time-mlb-playstage-v905-depth.yml'
      - 'scripts/mlb-playstage-v905-depth.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply broadcast-perspective depth pass
        run: python scripts/mlb-playstage-v905-depth.py
      - name: Syntax and PlayStage regression
        run: |
          node --check sports/mlb/playstage-v901.js
          node --check sports/mlb/playstage-concept-v904.js
          node --check sports/mlb/playstage-concept-v905.js
          node --check sports/router.js
          node scripts/mlb-playstage-selftest.mjs
          node scripts/live-game-switcher-selftest.mjs
      - name: Commit v905 depth pass
        run: |
          git config user.name 'TSO PlayStage Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/mlb/playstage-v901.js sports/mlb/playstage-concept-v905.js sports/router.js scripts/mlb-playstage-selftest.mjs .github/workflows/nfl-gamecast-tests.yml index.html
          git commit -m 'Polish MLB PlayStage v905 depth and field projection'
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
