name: One-time MLB PlayStage v907 visual QA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-playstage-v907-visual-qa.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Build real-feed v907 PlayStage harness
        run: |
          GAME_PK=$(node --input-type=module - <<'NODE'
          const dates=[1,2,3,4,5].map(n=>new Date(Date.now()-n*86400000).toISOString().slice(0,10));
          let picked='';
          for(const date of dates){
            const r=await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}`);
            const j=await r.json();
            const games=(j.dates||[]).flatMap(d=>d.games||[]);
            const g=games.find(x=>/final|completed|game over/i.test(x.status?.detailedState||''))||games[0];
            if(g?.gamePk){picked=String(g.gamePk);break;}
          }
          if(!picked) process.exit(2);
          console.log(picked);
          NODE
          )
          echo "Using MLB game $GAME_PK"
          cat > visual-qa-v907.html <<EOF
          <!doctype html>
          <html lang="en" data-sport="mlb">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayStage v907 QA</title>
          <style>html,body{margin:0;background:#020814;color:#fff;font-family:Arial,sans-serif}body{padding:12px}#tsoMlbInlineGamecast{width:min(1512px,calc(100vw - 24px));margin:auto}.mlb-live-gc-shell{min-height:720px}</style></head>
          <body><div id="tsoMlbInlineGamecast" data-game-pk="$GAME_PK"><div class="mlb-live-gc-shell"></div></div>
          <script type="module">
            import {installMlbPlaystageV901} from './sports/mlb/playstage-v901.js?v=qa907';
            import {installMlbPlaystageConceptV904} from './sports/mlb/playstage-concept-v904.js?v=qa907';
            import {installMlbPlaystageConceptV905} from './sports/mlb/playstage-concept-v905.js?v=qa907';
            import {installMlbPlaystageConceptV906} from './sports/mlb/playstage-concept-v906.js?v=qa907';
            import {installMlbPlaystageConceptV907} from './sports/mlb/playstage-concept-v907.js?v=qa907';
            installMlbPlaystageV901();
            installMlbPlaystageConceptV904();
            installMlbPlaystageConceptV905();
            installMlbPlaystageConceptV906();
            installMlbPlaystageConceptV907();
          </script></body></html>
          EOF
      - name: Render v907 component and articulation states
        run: |
          python3 -m http.server 4173 >/tmp/tso-qa-http.log 2>&1 &
          SERVER_PID=$!
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1536,height:960},deviceScaleFactor:1});
          page.on('console',m=>console.log('[browser]',m.type(),m.text()));
          await page.goto('http://127.0.0.1:4173/visual-qa-v907.html',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('.tso-mlb-playstage-v901.tso-mlb-concept-v907',{timeout:30000});
          await page.waitForTimeout(3600);
          const root=page.locator('.tso-mlb-playstage-v901');
          const stage=page.locator('.ps-stage');
          await root.screenshot({path:'mlb-playstage-v907-qa.png'});
          await stage.screenshot({path:'mlb-playstage-v907-stage.png'});

          const snap=async(name,setup,delay=230)=>{
            await page.evaluate(()=>document.querySelectorAll('.ps-chibi').forEach(el=>el.classList.remove('ps-windup','ps-throwing','ps-swing','ps-running','ps-catching','ps905-tracking','ps905-grounder','ps905-turn','ps905-catcher-throw','ps905-slide','ps905-tag','ps905-rounding','ps906-transfer')));
            await page.evaluate(setup);
            await page.waitForTimeout(delay);
            await stage.screenshot({path:`mlb-playstage-v907-${name}.png`});
          };
          await snap('pitch',()=>{const p=document.querySelector('.ps-chibi.ps-pitcher');p?.classList.add('ps-windup','ps-throwing');},260);
          await snap('swing',()=>{document.querySelector('.ps-chibi.ps-batter')?.classList.add('ps-swing');},260);
          await snap('fly-catch',()=>{const f=document.querySelector('.ps-chibi[data-pos="CF"],.ps-chibi[data-pos="LF"],.ps-chibi[data-pos="RF"]');f?.classList.add('ps-running','ps905-tracking','ps-catching');},320);
          await snap('grounder-throw',()=>{const f=document.querySelector('.ps-chibi[data-pos="SS"],.ps-chibi[data-pos="2B"],.ps-chibi[data-pos="3B"]');f?.classList.add('ps905-grounder','ps-throwing','ps906-transfer');},330);
          await snap('double-play',()=>{const f=document.querySelector('.ps-chibi[data-pos="2B"],.ps-chibi[data-pos="SS"]');f?.classList.add('ps905-turn','ps-throwing','ps906-transfer');},330);
          await snap('catcher-throw',()=>{document.querySelector('.ps-chibi.ps-catcher')?.classList.add('ps905-catcher-throw','ps-throwing');},350);
          await snap('runner-slide',()=>{const r=document.querySelector('.ps-chibi.ps-runner')||document.querySelector('.ps-chibi.ps-batter');r?.classList.add('ps-running','ps905-rounding','ps905-slide');},380);

          const state=await page.evaluate(()=>({
            concept:document.querySelector('.tso-mlb-playstage-v901')?.dataset?.approvedConcept,
            v907Scene:document.querySelectorAll('.ps907-scene').length,
            batterRigs:document.querySelectorAll('.ps907-batter-rig').length,
            catcherRigs:document.querySelectorAll('.ps907-catcher-rig').length,
            umpires:document.querySelectorAll('.ps907-ump').length,
            legacyRigs:document.querySelectorAll('.ps905-rig').length,
            chibis:document.querySelectorAll('.ps-chibi').length,
            headshots:document.querySelectorAll('.ps-headshot img').length,
            liveBadge:!!document.querySelector('.ps-live'),
            weather:!!document.querySelector('.ps-weather'),
            rightPanel:!!document.querySelector('.ps-right'),
            tabs:[...document.querySelectorAll('.ps-tab')].map(x=>x.textContent.trim()),
            truth:document.querySelector('.ps-truth')?.textContent||''
          }));
          fs.writeFileSync('mlb-playstage-v907-qa.json',JSON.stringify(state,null,2));
          console.log(state);
          if(state.concept!=='v907'||state.v907Scene!==1||state.batterRigs<1||state.catcherRigs<1||state.umpires!==1||state.legacyRigs<8||state.headshots<2||!state.liveBadge||!state.weather||!state.rightPanel) process.exitCode=3;
          await browser.close();
          NODE
          kill $SERVER_PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-playstage-v907-visual-qa
          path: |
            mlb-playstage-v907-qa.png
            mlb-playstage-v907-stage.png
            mlb-playstage-v907-pitch.png
            mlb-playstage-v907-swing.png
            mlb-playstage-v907-fly-catch.png
            mlb-playstage-v907-grounder-throw.png
            mlb-playstage-v907-double-play.png
            mlb-playstage-v907-catcher-throw.png
            mlb-playstage-v907-runner-slide.png
            mlb-playstage-v907-qa.json
          retention-days: 2
