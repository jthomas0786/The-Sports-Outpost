name: One-time MLB PlayStage v914 realistic field apply

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-playstage-v914-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply realistic field calibration and wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          p=Path('sports/mlb/playstage-v901.js')
          s=p.read_text()
          s=must_replace(s,
              "const DEF_POS={P:[50,66],C:[50,88],'1B':[66,62],'2B':[58,51],SS:[42,51],'3B':[34,62],LF:[27,45],CF:[50,41],RF:[73,45]};",
              "const DEF_POS={P:[50,69],C:[50,90],'1B':[71,63],'2B':[58,54],SS:[42,54],'3B':[29,63],LF:[24,45],CF:[50,40],RF:[76,45]};",
              'defensive coordinates')
          s=must_replace(s,
              "const BASE_POS={home:[50,88],first:[66,68],second:[50,49],third:[34,68]};",
              "const BASE_POS={home:[50,90],first:[73,70],second:[50,58],third:[27,70]};",
              'base coordinates')
          s=must_replace(s,
              "const batPos=String(s.batter?.bats||'').toUpperCase()==='L'?[54,86]:[46,86];",
              "const batPos=String(s.batter?.bats||'').toUpperCase()==='L'?[52.6,90]:[47.4,90];",
              'batter box coordinates')
          p.write_text(s)

          p=Path('sports/router.js')
          s=p.read_text()
          s=must_replace(s,
              'conceptV910,conceptV911,conceptV912,conceptV913] = await Promise.all([',
              'conceptV910,conceptV911,conceptV912,conceptV913,conceptV914] = await Promise.all([',
              'router destructure v914')
          s=must_replace(s,
              "        import('./mlb/playstage-concept-v913.js?v=91.30')\n      ]);",
              "        import('./mlb/playstage-concept-v913.js?v=91.30'),\n        import('./mlb/playstage-concept-v914.js?v=91.40')\n      ]);",
              'router import v914')
          s=must_replace(s,
              '      conceptV913.installMlbPlaystageConceptV913?.();',
              '      conceptV913.installMlbPlaystageConceptV913?.();\n      conceptV914.installMlbPlaystageConceptV914?.();',
              'router install v914')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=must_replace(s,'./sports/router.js?v=90.19','./sports/router.js?v=90.20','index router cache')
          p.write_text(s)

          p=Path('scripts/mlb-playstage-selftest.mjs')
          s=p.read_text()
          s=must_replace(s,'assert.deepEqual(t.DEF_POS.C,[50,88]);','assert.deepEqual(t.DEF_POS.C,[50,90]);','selftest catcher coordinate')
          s=must_replace(s,'assert.deepEqual(t.BASE_POS.second,[50,49]);','assert.deepEqual(t.BASE_POS.second,[50,58]);','selftest second coordinate')
          s=must_replace(s,'assert.deepEqual(t.DEF_POS.CF,[50,41]);','assert.deepEqual(t.DEF_POS.CF,[50,40]);','selftest center coordinate')
          p.write_text(s)

          p=Path('.github/workflows/nfl-gamecast-tests.yml')
          s=p.read_text()
          s=must_replace(s,"      - 'sports/mlb/playstage-concept-v913.js'","      - 'sports/mlb/playstage-concept-v913.js'\n      - 'sports/mlb/playstage-concept-v914.js'",'workflow path v914')
          s=must_replace(s,'          node --check sports/mlb/playstage-concept-v913.js','          node --check sports/mlb/playstage-concept-v913.js\n          node --check sports/mlb/playstage-concept-v914.js','workflow syntax v914')
          s=must_replace(s,"          grep -F './sports/router.js?v=90.19' index.html","          grep -F './sports/router.js?v=90.20' index.html",'workflow router cache')
          s=must_replace(s,'          grep -F "./mlb/playstage-concept-v913.js?v=91.30" sports/router.js','          grep -F "./mlb/playstage-concept-v913.js?v=91.30" sports/router.js\n          grep -F "./mlb/playstage-concept-v914.js?v=91.40" sports/router.js','workflow import v914')
          s=must_replace(s,'          grep -F "installMlbPlaystageConceptV913" sports/router.js','          grep -F "installMlbPlaystageConceptV913" sports/router.js\n          grep -F "installMlbPlaystageConceptV914" sports/router.js','workflow install v914')
          s=must_replace(s,"          grep -F 'ps913BatSwing' sports/mlb/playstage-concept-v913.js","          grep -F 'ps913BatSwing' sports/mlb/playstage-concept-v913.js\n          grep -F 'ps914-field' sports/mlb/playstage-concept-v914.js\n          test -s images/mlb/playstage-field-v914.jpg",'workflow field asset')
          p.write_text(s)
          PY
      - name: Local checks
        run: |
          node --check sports/mlb/playstage-v901.js
          node --check sports/mlb/playstage-concept-v914.js
          node --check sports/router.js
          node scripts/mlb-playstage-selftest.mjs
          grep -F './sports/router.js?v=90.20' index.html
          test -s images/mlb/playstage-field-v914.jpg
      - name: Commit v914 implementation
        run: |
          git config user.name 'TSO MLB Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/mlb/playstage-v901.js sports/router.js index.html scripts/mlb-playstage-selftest.mjs .github/workflows/nfl-gamecast-tests.yml
          git commit -m 'Use approved realistic field in MLB Gamecast v914'
          git pull --rebase origin main
          git push origin HEAD:main
