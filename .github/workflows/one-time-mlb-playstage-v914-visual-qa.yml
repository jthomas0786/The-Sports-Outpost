name: One-time MLB PlayStage v914 visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-playstage-v914-visual-qa.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Build harness
        run: |
          GAME_PK=$(node --input-type=module - <<'NODE'
          for(const n of [1,2,3,4,5]){const date=new Date(Date.now()-n*86400000).toISOString().slice(0,10);const j=await (await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}`)).json();const games=(j.dates||[]).flatMap(d=>d.games||[]);const g=games.find(x=>/final|completed|game over/i.test(x.status?.detailedState||''))||games[0];if(g?.gamePk){console.log(g.gamePk);break;}}
          NODE
          )
          test -n "$GAME_PK"
          cat > visual-qa-v914.html <<EOF
          <!doctype html><html lang="en" data-sport="mlb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#020814;color:#fff;font-family:Arial}body{padding:12px}#tsoMlbInlineGamecast{width:min(1512px,calc(100vw - 24px));margin:auto}.mlb-live-gc-shell{min-height:720px}</style></head><body><div id="tsoMlbInlineGamecast" data-game-pk="$GAME_PK"><div class="mlb-live-gc-shell"></div></div><script type="module">
          import {installMlbPlaystageV901} from './sports/mlb/playstage-v901.js?v=qa914';
          import {installMlbPlaystageConceptV904} from './sports/mlb/playstage-concept-v904.js?v=qa914';
          import {installMlbPlaystageConceptV905} from './sports/mlb/playstage-concept-v905.js?v=qa914';
          import {installMlbPlaystageConceptV906} from './sports/mlb/playstage-concept-v906.js?v=qa914';
          import {installMlbPlaystageConceptV907} from './sports/mlb/playstage-concept-v907.js?v=qa914';
          import {installMlbPlaystageConceptV908} from './sports/mlb/playstage-concept-v908.js?v=qa914';
          import {installMlbPlaystageConceptV909} from './sports/mlb/playstage-concept-v909.js?v=qa914';
          import {installMlbPlaystageConceptV910} from './sports/mlb/playstage-concept-v910.js?v=qa914';
          import {installMlbPlaystageConceptV911} from './sports/mlb/playstage-concept-v911.js?v=qa914';
          import {installMlbPlaystageConceptV912} from './sports/mlb/playstage-concept-v912.js?v=qa914';
          import {installMlbPlaystageConceptV913} from './sports/mlb/playstage-concept-v913.js?v=qa914';
          import {installMlbPlaystageConceptV914} from './sports/mlb/playstage-concept-v914.js?v=qa914';
          installMlbPlaystageV901();installMlbPlaystageConceptV904();installMlbPlaystageConceptV905();installMlbPlaystageConceptV906();installMlbPlaystageConceptV907();installMlbPlaystageConceptV908();installMlbPlaystageConceptV909();installMlbPlaystageConceptV910();installMlbPlaystageConceptV911();installMlbPlaystageConceptV912();installMlbPlaystageConceptV913();installMlbPlaystageConceptV914();
          </script></body></html>
          EOF
      - name: Render and validate
        run: |
          node --check sports/mlb/playstage-concept-v914.js
          python3 -m http.server 4173 >/tmp/tso-v914-http.log 2>&1 & SERVER_PID=$!
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';import fs from 'node:fs';
          const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1536,height:960}});
          p.on('console',m=>console.log('[browser]',m.type(),m.text()));
          await p.goto('http://127.0.0.1:4173/visual-qa-v914.html',{waitUntil:'domcontentloaded'});
          await p.waitForSelector('.tso-mlb-concept-v914',{timeout:30000});
          await p.waitForFunction(()=>{const i=document.querySelector('.ps914-field');return i?.complete&&i.naturalWidth>0},{timeout:30000});
          await p.waitForTimeout(3000);
          const root=p.locator('.tso-mlb-playstage-v901'),stage=p.locator('.ps-stage');
          await root.screenshot({path:'mlb-playstage-v914-qa.png'});await stage.screenshot({path:'mlb-playstage-v914-stage.png'});
          const reset=async()=>p.evaluate(()=>document.querySelectorAll('.ps-chibi').forEach(e=>e.classList.remove('ps-windup','ps-throwing','ps-swing','ps-running','ps-catching','ps905-tracking','ps905-grounder','ps905-turn','ps905-catcher-throw','ps905-slide','ps905-tag','ps905-rounding','ps906-transfer')));
          await reset();await p.evaluate(()=>document.querySelector('.ps-chibi.ps-pitcher')?.classList.add('ps-windup','ps-throwing'));await p.waitForTimeout(280);await stage.screenshot({path:'mlb-playstage-v914-pitch.png'});
          await reset();await p.evaluate(()=>document.querySelector('.ps-chibi.ps-batter')?.classList.add('ps-swing'));await p.waitForTimeout(320);await stage.screenshot({path:'mlb-playstage-v914-swing.png'});
          await reset();await p.evaluate(()=>{const f=document.querySelector('.ps-chibi[data-pos="CF"],.ps-chibi[data-pos="LF"],.ps-chibi[data-pos="RF"]');f?.classList.add('ps-running','ps905-tracking','ps-catching')});await p.waitForTimeout(340);await stage.screenshot({path:'mlb-playstage-v914-fly-catch.png'});
          await reset();await p.evaluate(()=>{const f=document.querySelector('.ps-chibi[data-pos="SS"],.ps-chibi[data-pos="2B"],.ps-chibi[data-pos="3B"]');f?.classList.add('ps905-grounder','ps-throwing','ps906-transfer')});await p.waitForTimeout(350);await stage.screenshot({path:'mlb-playstage-v914-grounder-throw.png'});
          await reset();await p.evaluate(()=>{const f=document.querySelector('.ps-chibi[data-pos="2B"],.ps-chibi[data-pos="SS"]');f?.classList.add('ps905-turn','ps-throwing','ps906-transfer')});await p.waitForTimeout(350);await stage.screenshot({path:'mlb-playstage-v914-double-play.png'});
          await reset();await p.evaluate(()=>document.querySelector('.ps-chibi.ps-catcher')?.classList.add('ps905-catcher-throw','ps-throwing'));await p.waitForTimeout(380);await stage.screenshot({path:'mlb-playstage-v914-catcher-throw.png'});
          const q=await p.evaluate(()=>{const root=document.querySelector('.tso-mlb-playstage-v901'),field=document.querySelector('.ps914-field'),pos={};for(const k of ['P','1B','2B','SS','3B','LF','CF','RF']){const el=k==='P'?document.querySelector('.ps-chibi.ps-pitcher'):document.querySelector(`.ps-chibi[data-pos="${k}"]`);if(el)pos[k]={left:parseFloat(el.style.left),top:parseFloat(el.style.top)};}const batter=document.querySelector('.ps-chibi.ps-batter'),catcher=document.querySelector('.ps-chibi.ps-catcher');return {concept:root?.dataset?.approvedConcept,fieldCount:document.querySelectorAll('.ps914-field').length,fieldWidth:field?.naturalWidth||0,fieldHeight:field?.naturalHeight||0,foregroundDisplay:getComputedStyle(document.querySelector('.ps908-foreground')).display,batterOpacity:parseFloat(getComputedStyle(batter).opacity),catcherOpacity:parseFloat(getComputedStyle(catcher).opacity),rigs:document.querySelectorAll('.ps905-rig').length,backRigs:document.querySelectorAll('.ps907-backrig').length,umpires:document.querySelectorAll('.ps907-ump').length,headshots:document.querySelectorAll('.ps-headshot img').length,live:!!document.querySelector('.ps-live'),weather:!!document.querySelector('.ps-weather'),right:!!document.querySelector('.ps-right'),stageHeight:Math.round(document.querySelector('.ps-stage')?.getBoundingClientRect().height||0),centerHeight:Math.round(document.querySelector('.ps-center')?.getBoundingClientRect().height||0),pos};});
          fs.writeFileSync('mlb-playstage-v914-qa.json',JSON.stringify(q,null,2));console.log(q);
          const near=(a,b,t=.35)=>Math.abs(a-b)<=t;const expected={P:[50,69],'1B':[71,63],'2B':[58,54],SS:[42,54],'3B':[29,63],LF:[24,45],CF:[50,40],RF:[76,45]};let positionsOk=true;for(const [k,[x,y]] of Object.entries(expected)){const v=q.pos[k];if(!v||!near(v.left,x)||!near(v.top,y))positionsOk=false;}
          if(q.concept!=='v914'||q.fieldCount!==1||q.fieldWidth<1000||q.foregroundDisplay!=='none'||q.batterOpacity<.99||q.catcherOpacity<.99||q.rigs<8||q.backRigs<2||q.umpires!==1||q.headshots<2||!q.live||!q.weather||!q.right||q.stageHeight<640||q.centerHeight<q.stageHeight||!positionsOk)process.exitCode=3;
          await b.close();
          NODE
          kill $SERVER_PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-playstage-v914-visual-qa
          path: |
            mlb-playstage-v914-qa.png
            mlb-playstage-v914-stage.png
            mlb-playstage-v914-pitch.png
            mlb-playstage-v914-swing.png
            mlb-playstage-v914-fly-catch.png
            mlb-playstage-v914-grounder-throw.png
            mlb-playstage-v914-double-play.png
            mlb-playstage-v914-catcher-throw.png
            mlb-playstage-v914-qa.json
          retention-days: 2
