name: One-time MLB PlayStage v915 visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-playstage-v915-visual-qa.yml'
      - 'sports/mlb/playstage-concept-v915.js'
      - 'sports/router.js'
      - 'field-bg.jpg'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Build v915 harness
        run: |
          GAME_PK=$(node --input-type=module - <<'NODE'
          for(const n of [1,2,3,4,5]){
            const date=new Date(Date.now()-n*86400000).toISOString().slice(0,10);
            const j=await (await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}`)).json();
            const games=(j.dates||[]).flatMap(d=>d.games||[]);
            const g=games.find(x=>/final|completed|game over/i.test(x.status?.detailedState||''))||games[0];
            if(g?.gamePk){console.log(g.gamePk);break;}
          }
          NODE
          )
          test -n "$GAME_PK"
          test -f field-bg.jpg
          cat > visual-qa-v915.html <<EOF
          <!doctype html><html lang="en" data-sport="mlb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#020814;color:#fff;font-family:Arial}body{padding:12px}#tsoMlbInlineGamecast{width:min(1512px,calc(100vw - 24px));margin:auto}.mlb-live-gc-shell{min-height:720px}</style></head><body><div id="tsoMlbInlineGamecast" data-game-pk="$GAME_PK"><div class="mlb-live-gc-shell"></div></div><script type="module">
          import {installMlbPlaystageV901} from './sports/mlb/playstage-v901.js?v=qa915';
          import {installMlbPlaystageConceptV904} from './sports/mlb/playstage-concept-v904.js?v=qa915';
          import {installMlbPlaystageConceptV905} from './sports/mlb/playstage-concept-v905.js?v=qa915';
          import {installMlbPlaystageConceptV906} from './sports/mlb/playstage-concept-v906.js?v=qa915';
          import {installMlbPlaystageConceptV907} from './sports/mlb/playstage-concept-v907.js?v=qa915';
          import {installMlbPlaystageConceptV908} from './sports/mlb/playstage-concept-v908.js?v=qa915';
          import {installMlbPlaystageConceptV909} from './sports/mlb/playstage-concept-v909.js?v=qa915';
          import {installMlbPlaystageConceptV910} from './sports/mlb/playstage-concept-v910.js?v=qa915';
          import {installMlbPlaystageConceptV911} from './sports/mlb/playstage-concept-v911.js?v=qa915';
          import {installMlbPlaystageConceptV912} from './sports/mlb/playstage-concept-v912.js?v=qa915';
          import {installMlbPlaystageConceptV913} from './sports/mlb/playstage-concept-v913.js?v=qa915';
          import {installMlbPlaystageConceptV914} from './sports/mlb/playstage-concept-v914.js?v=qa915';
          import {installMlbPlaystageConceptV915} from './sports/mlb/playstage-concept-v915.js?v=qa915';
          installMlbPlaystageV901();installMlbPlaystageConceptV904();installMlbPlaystageConceptV905();installMlbPlaystageConceptV906();installMlbPlaystageConceptV907();installMlbPlaystageConceptV908();installMlbPlaystageConceptV909();installMlbPlaystageConceptV910();installMlbPlaystageConceptV911();installMlbPlaystageConceptV912();installMlbPlaystageConceptV913();installMlbPlaystageConceptV914();installMlbPlaystageConceptV915();
          </script></body></html>
          EOF
      - name: Render current Gamecast
        run: |
          mkdir -p qa
          node --check sports/mlb/playstage-concept-v915.js
          node scripts/mlb-playstage-selftest.mjs
          python3 -m http.server 4173 >/tmp/tso-v915-http.log 2>&1 & SERVER_PID=$!
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';import fs from 'node:fs';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:1536,height:1100},deviceScaleFactor:1});
          p.on('console',m=>console.log('[browser]',m.type(),m.text()));
          await p.goto('http://127.0.0.1:4173/visual-qa-v915.html',{waitUntil:'domcontentloaded'});
          await p.waitForSelector('.tso-mlb-concept-v915',{timeout:30000});
          await p.waitForFunction(()=>{const i=document.querySelector('.ps914-field');return i?.complete&&i.naturalWidth>0&&i.getAttribute('src')==='./field-bg.jpg'},{timeout:30000});
          await p.waitForTimeout(2500);
          const root=p.locator('.tso-mlb-playstage-v901');
          const stage=p.locator('.ps-stage');
          await root.screenshot({path:'qa/mlb-playstage-v915-current.png'});
          await stage.screenshot({path:'qa/mlb-playstage-v915-stage.png'});
          const q=await p.evaluate(()=>{
            const actors=[...document.querySelectorAll('.ps-chibi')];
            const idleVisible=actors.filter(e=>parseFloat(getComputedStyle(e).opacity)>.01).map(e=>e.className);
            const root=document.querySelector('.tso-mlb-playstage-v901');
            const field=document.querySelector('.ps914-field');
            const stage=document.querySelector('.ps-stage');
            const r=stage?.getBoundingClientRect();
            return {
              concept:root?.dataset?.approvedConcept,
              fieldSrc:field?.getAttribute('src'),
              fieldNatural:[field?.naturalWidth||0,field?.naturalHeight||0],
              objectFit:getComputedStyle(field).objectFit,
              stageBox:r?[Math.round(r.width),Math.round(r.height)]:[0,0],
              stageAspect:r&&r.height?r.width/r.height:0,
              imageAspect:field?.naturalHeight?field.naturalWidth/field.naturalHeight:0,
              idleActorCount:actors.length,
              idleVisible
            };
          });
          fs.writeFileSync('qa/mlb-playstage-v915-current.json',JSON.stringify(q,null,2));
          console.log(q);
          if(q.concept!=='v915'||q.fieldSrc!=='./field-bg.jpg'||q.fieldNatural[0]!==1536||q.fieldNatural[1]!==1024||q.objectFit!=='contain'||Math.abs(q.stageAspect-q.imageAspect)>.005||q.idleVisible.length)process.exitCode=3;

          await p.setViewportSize({width:390,height:844});
          await p.reload({waitUntil:'domcontentloaded'});
          await p.waitForSelector('.tso-mlb-concept-v915',{timeout:30000});
          await p.waitForFunction(()=>{const i=document.querySelector('.ps914-field');return i?.complete&&i.naturalWidth>0&&i.getAttribute('src')==='./field-bg.jpg'},{timeout:30000});
          await p.waitForTimeout(1200);
          await p.locator('.tso-mlb-playstage-v901').screenshot({path:'qa/mlb-playstage-v915-mobile.png'});
          const mobile=await p.evaluate(()=>{
            const root=document.querySelector('.tso-mlb-playstage-v901');
            const stage=document.querySelector('.ps-stage');
            const field=document.querySelector('.ps914-field');
            const rr=root?.getBoundingClientRect(),sr=stage?.getBoundingClientRect();
            const actors=[...document.querySelectorAll('.ps-chibi')];
            return {
              viewport:innerWidth,
              docWidth:document.documentElement.scrollWidth,
              rootLeft:rr?.left??0,
              rootRight:rr?.right??0,
              rootWidth:rr?.width??0,
              stageWidth:sr?.width??0,
              stageAspect:sr?.height?sr.width/sr.height:0,
              imageAspect:field?.naturalHeight?field.naturalWidth/field.naturalHeight:0,
              fieldNatural:[field?.naturalWidth||0,field?.naturalHeight||0],
              idleVisible:actors.filter(e=>parseFloat(getComputedStyle(e).opacity)>.01).length
            };
          });
          fs.writeFileSync('qa/mlb-playstage-v915-mobile.json',JSON.stringify(mobile,null,2));
          console.log({mobile});
          if(mobile.docWidth>mobile.viewport+1||mobile.rootLeft<-1||mobile.rootRight>mobile.viewport+1||mobile.stageWidth>mobile.rootWidth+1||mobile.fieldNatural[0]!==1536||mobile.fieldNatural[1]!==1024||Math.abs(mobile.stageAspect-mobile.imageAspect)>.005||mobile.idleVisible)process.exitCode=4;
          await b.close();
          NODE
          kill $SERVER_PID || true
      - name: Commit screenshots
        run: |
          git config user.name 'TSO MLB QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qa/mlb-playstage-v915-current.png qa/mlb-playstage-v915-stage.png qa/mlb-playstage-v915-current.json qa/mlb-playstage-v915-mobile.png qa/mlb-playstage-v915-mobile.json
          git commit -m 'qa: capture corrected MLB PlayStage v915' || exit 0
          git reset --hard HEAD
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
