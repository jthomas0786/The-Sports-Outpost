name: One-time MLB PlayStage v916 apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-playstage-v916-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v916
        run: python3 scripts/apply-mlb-playstage-v916.py
      - name: Validate MLB and shared routing
        run: |
          node --check sports/mlb/playstage-v901.js
          node --check sports/mlb/playstage-concept-v916.js
          node --check sports/router.js
          node scripts/mlb-playstage-selftest.mjs
          node scripts/mlb-playstage-v916-selftest.mjs
          node scripts/live-game-switcher-selftest.mjs
          grep -F "./mlb/playstage-concept-v916.js?v=91.60" sports/router.js
          grep -F "./sports/router.js?v=90.41" index.html
      - name: Commit production changes
        run: |
          git config user.name 'TSO MLB v916 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/mlb/playstage-v901.js sports/router.js index.html
          git commit -m 'mlb: show full live field alignment in Gamecast'
          git reset --hard HEAD
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
# rerun after stale shared assertion fix
