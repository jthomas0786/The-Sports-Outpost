name: One-time MLB v909 cache bust

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-v907-cachebust.yml'

permissions:
  contents: write

jobs:
  cachebust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache-bust production router
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./sports/router.js?v=90.14'
          new='./sports/router.js?v=90.15'
          if new in s:
              print('already cache-busted')
          elif old in s:
              p.write_text(s.replace(old,new))
              print(f'{old} -> {new}')
          else:
              raise SystemExit('expected router cache-bust anchor not found')
          PY
      - name: Commit production cache bust
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'TSO MLB Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Cache-bust MLB Gamecast v909'
          git pull --rebase origin main
          git push origin HEAD:main
