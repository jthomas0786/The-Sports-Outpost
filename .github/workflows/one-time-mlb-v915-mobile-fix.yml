name: One-time MLB v915 mobile responsive fix
on:
  push:
    paths:
      - '.github/workflows/one-time-mlb-v915-mobile-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v915 mobile patch
        run: python3 scripts/apply-mlb-v915-mobile.py
      - name: Validate regressions
        run: |
          node --check sports/mlb/playstage-concept-v915.js
          node --check sports/router.js
          node scripts/mlb-playstage-selftest.mjs
          grep -F "./sports/router.js?v=90.37" index.html
          grep -F "./mlb/playstage-concept-v915.js?v=91.52" sports/router.js
          grep -F "./nfl-preview-v893.js?v=89.36" sports/router.js
          grep -F "./nhl/view-v906.js?v=90.18" sports/router.js
      - name: Commit corrections
        run: |
          git config user.name 'TSO MLB QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/mlb/playstage-concept-v915.js sports/router.js scripts/mlb-playstage-selftest.mjs index.html .github/workflows/one-time-mlb-playstage-v915-visual-qa.yml
          git diff --staged --quiet && exit 0
          git commit -m 'Finish MLB v915 approved field mobile scaling'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
