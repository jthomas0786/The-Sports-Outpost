name: One-time MLB v920 mobile layout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-v920-mobile.yml'
      - 'scripts/apply-mlb-v920-mobile-layout.py'
      - 'scripts/mlb-v920-mobile-selftest.mjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply MLB v920 mobile layout
        run: python3 scripts/apply-mlb-v920-mobile-layout.py
      - name: Validate MLB Gamecast mobile layout
        run: |
          node --check sports/mlb/playstage-concept-v920-mobile.js
          node --check sports/router.js
          node scripts/mlb-playstage-selftest.mjs
          node scripts/mlb-playstage-v916-selftest.mjs
          node scripts/mlb-v916-runner-isolation-selftest.mjs
          node scripts/mlb-v917-actor-role-selftest.mjs
          node scripts/mlb-v918-hit-trajectory-selftest.mjs
          node scripts/mlb-v919-fielder-trail-selftest.mjs
          node scripts/mlb-v920-mobile-selftest.mjs
          grep -F "./mlb/playstage-concept-v920-mobile.js?v=92.00" sports/router.js
          grep -F "./sports/router.js?v=90.46" index.html
          grep -F "./nfl-preview-v893.js?v=89.36" sports/router.js
          grep -F "./nhl/view-v906.js?v=90.18" sports/router.js
      - name: Commit production update
        run: |
          git config user.name 'TSO MLB v920 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/mlb/playstage-concept-v920-mobile.js sports/router.js index.html scripts/*selftest*.mjs
          git commit -m 'mlb: rebuild mobile Gamecast layout'
          git reset --hard HEAD
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
