name: One-time MLB v922 desktop polish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-v922-desktop-polish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply MLB v922 desktop polish
        run: python scripts/apply-mlb-v922-desktop-polish.py
      - name: Validate MLB v922 desktop polish
        run: |
          node --check sports/mlb/playstage-concept-v922-desktop.js
          node --check sports/router.js
          node scripts/mlb-v922-desktop-selftest.mjs
          grep -F "./mlb/playstage-concept-v922-desktop.js?v=92.20" sports/router.js
          grep -F "installMlbPlaystageConceptV922Desktop" sports/router.js
          grep -F "./nfl-preview-v893.js?v=89.37" sports/router.js
          grep -F "./nhl/view-v906.js?v=90.18" sports/router.js
          test -s field-bg.jpg
      - name: Commit production update
        run: |
          git config user.name 'TSO MLB v922 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/router.js index.html
          if ! git diff --cached --quiet; then git commit -m 'mlb: polish desktop Gamecast HUD and field status'; fi
          git reset --hard HEAD
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
