name: One-time MLB v923 desktop visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-v923-desktop-visual-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Run desktop visual and interaction QA
        run: node scripts/mlb-v923-desktop-qa.mjs
      - name: Commit QA captures
        run: |
          git config user.name 'TSO MLB v923 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qa/mlb-v923-desktop-gamecast.png qa/mlb-v923-desktop-box-score.png qa/mlb-v923-desktop-play-by-play.png qa/mlb-v923-desktop-qa.json
          git commit -m 'qa: verify MLB v923 desktop Gamecast layout'
          git reset --hard HEAD
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
