name: One-time MLB v924 footer gap polish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-v924-footer-gap-polish.yml'
      - 'scripts/apply-mlb-v924-footer-gap-polish.py'
      - 'scripts/mlb-v925-live-selector-selftest.mjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply footer gap polish
        run: python3 scripts/apply-mlb-v924-footer-gap-polish.py
      - name: Validate footer gap polish
        run: |
          node --check sports/mlb/playstage-concept-v924-desktop-fit.js
          node scripts/mlb-v924-desktop-selftest.mjs
          node scripts/mlb-v925-live-selector-selftest.mjs
      - name: Commit production polish
        run: |
          git config user.name 'TSO MLB v924 Polish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/mlb/playstage-concept-v924-desktop-fit.js sports/router.js index.html
          git commit -m 'mlb: settle desktop footer gap after scaling' || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
