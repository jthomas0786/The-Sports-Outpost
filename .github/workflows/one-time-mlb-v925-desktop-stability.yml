name: One-time MLB v925 desktop stability
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-mlb-v925-desktop-stability.yml'
      - 'scripts/apply-mlb-v924-desktop-fit.py'
      - 'scripts/apply-mlb-v925-live-selector-stability.py'
      - 'scripts/mlb-v923-desktop-tabs-selftest.mjs'
      - 'scripts/mlb-v924-desktop-selftest.mjs'
      - 'scripts/mlb-v925-live-selector-selftest.mjs'
      - 'sports/mlb/playstage-concept-v924-desktop-fit.js'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v924 desktop fit and stable polling
        run: python3 scripts/apply-mlb-v924-desktop-fit.py
      - name: Apply v925 live selector stability
        run: python3 scripts/apply-mlb-v925-live-selector-stability.py
      - name: Validate MLB v925 desktop stability
        run: |
          node --check sports/mlb/playstage-v901.js
          node --check sports/mlb/live-game-switcher-v901.js
          node --check sports/mlb/playstage-concept-v924-desktop-fit.js
          node scripts/mlb-playstage-selftest.mjs
          node scripts/mlb-v923-desktop-tabs-selftest.mjs
          node scripts/mlb-v924-desktop-selftest.mjs
          node scripts/mlb-v925-live-selector-selftest.mjs
      - name: Commit production update
        run: |
          git config user.name 'TSO MLB v925 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/mlb/playstage-v901.js sports/mlb/live-game-switcher-v901.js sports/router.js index.html
          git commit -m 'mlb: stabilize desktop layout polling and game selector' || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
