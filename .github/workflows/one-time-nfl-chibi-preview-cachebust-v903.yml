name: One-time NFL Chibi Preview cache bust v90.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-nfl-chibi-preview-cachebust-v903.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-nfl-chibi-preview-cachebust-v903
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and publish outer router cache bust
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tso-fix-bot'
          git config user.email 'actions@github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path
          import re

          router = Path('sports/router.js').read_text()
          preview = Path('sports/nfl/chibi-preview-private-v901.js').read_text()
          index = Path('index.html')
          html = index.read_text()

          required_router = "./nfl/chibi-preview-private-v901.js?v=90.5"
          if required_router not in router:
              raise SystemExit('router is not wired to Chibi Preview v90.5')
          for marker in ("OWNER_USERNAME = 'justcallme_jt'", "DW_getCurrentSocialUsername", '.ms-head-actions', 'nfl-chibi-preview-trigger'):
              if marker not in preview:
                  raise SystemExit(f'Chibi Preview validation marker missing: {marker}')

          pattern = r'(\./sports/router\.js\?v=)([A-Za-z0-9._-]+)'
          match = re.search(pattern, html)
          if not match:
              raise SystemExit('index router cache marker missing')
          current = match.group(2)
          target = current if current.endswith('-chibi5') else current + '-chibi5'
          html2, count = re.subn(pattern, lambda m: m.group(1) + target, html, count=1)
          if count != 1:
              raise SystemExit('expected exactly one outer router cache marker')
          index.write_text(html2)
          print(f'Outer router cache: {current} -> {target}')
          PY

            git add index.html
            if git diff --staged --quiet; then
              echo 'outer cache marker already current'
              exit 0
            fi
            git commit -m 'NFL Chibi Preview: publish header visibility v905'
            if git push origin HEAD:main; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "main advanced during publish; retrying from latest main"
            sleep $((attempt * 2))
          done

          echo '::error::could not publish cache bust after 5 attempts'
          exit 1
