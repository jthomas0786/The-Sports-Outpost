name: One-time NFL chibi visual preview fallback v91.2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-nfl-chibi-preview-fallback-v912.yml'
      - 'scripts/apply-nfl-chibi-preview-fallback-v912.py'
permissions:
  contents: write
concurrency:
  group: one-time-nfl-chibi-preview-fallback-v912
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply chibi preview fallback
        run: python3 scripts/apply-nfl-chibi-preview-fallback-v912.py
      - name: Validate chibi preview
        run: |
          node --check sports/nfl/chibi-preview-private-v901.js
          node --check sports/router.js
          git diff --check
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const s=fs.readFileSync('sports/nfl/chibi-preview-private-v901.js','utf8');
          const router=fs.readFileSync('sports/router.js','utf8');
          assert.ok(s.includes('function chibiCompositeHTML('));
          assert.ok(s.includes('LIVE QA PREVIEW'));
          assert.ok(s.includes("chibiCompositeHTML(p,head,'base')"));
          assert.ok(s.includes('data-celebration-action'));
          assert.ok(s.includes('chibi-action-stage'));
          assert.ok(!s.includes('Base chibi render not published yet'));
          assert.ok(!s.includes('is planned, but its rendered pose/animation asset has not been published yet'));
          assert.ok(router.includes("chibi-preview-private-v901.js?v=91.2"));
          console.log('NFL chibi preview v91.2 regression passed');
          NODE
      - name: Commit production preview fix
        run: |
          git config user.name 'TSO NFL Chibi Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/nfl/chibi-preview-private-v901.js sports/router.js index.html
          git commit -m 'nfl: show live chibi QA previews' || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
