name: One-time NFL halftime generator recovery v89.36

on:
  push:
    paths:
      - '.github/workflows/one-time-nfl-halftime-emergency-v8936.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Harden halftime detection, validity, selected-game status and live workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Active Halftime Lab UI: accept explicit halftime states and clock strings.
          p=Path('sports/nfl/halftime-ui-v884.js')
          s=p.read_text()
          old="""const periodOf=g=>Number(g?.liveScore?.period??g?.period);\nconst clockOf=g=>Number(g?.liveScore?.clockMin??g?.clockMin);\nconst statusOf=g=>String(g?.liveScore?.status||g?.status||'').toLowerCase();\nconst detailOf=g=>`${g?.statusDetail||''} ${g?.detail||''} ${g?.liveScore?.statusDetail||''}`.toLowerCase();\n"""
          new="""const periodOf=g=>Number(g?.liveScore?.period??g?.period);\nconst clockOf=g=>{\n  const minute=Number(g?.liveScore?.clockMin??g?.clockMin);\n  if(Number.isFinite(minute))return minute;\n  const raw=String(g?.liveScore?.clock??g?.clock??'').trim().toLowerCase();\n  if(/half\\s*time|halftime/.test(raw))return 0;\n  const m=raw.match(/^(\\d{1,2}):(\\d{2})$/);\n  return m?(Number(m[1])+Number(m[2])/60):NaN;\n};\nconst statusOf=g=>String(g?.liveScore?.status||g?.status||'').toLowerCase();\nconst detailOf=g=>`${g?.status||''} ${g?.liveScore?.status||''} ${g?.statusDetail||''} ${g?.detail||''} ${g?.liveScore?.statusDetail||''} ${g?.clock||''} ${g?.liveScore?.clock||''}`.toLowerCase();\nconst liveish=s=>['in','live','halftime','half'].includes(String(s||'').toLowerCase());\n"""
          if old not in s: raise SystemExit('halftime helper anchor missing')
          s=s.replace(old,new,1)
          old_state="""export function isHalftimeGameState(g){\n  if(!g)return false;\n  const status=statusOf(g);\n  if(status!=='in'&&status!=='live')return false;\n  if(/half\\s*time|halftime|end of (?:the )?2nd|end of second/.test(detailOf(g)))return true;\n  const p=periodOf(g),clock=clockOf(g);\n  return p===2&&Number.isFinite(clock)&&clock<=0.05;\n}\n\nexport function isHalftimeWarmupGameState(g,{thresholdMinutes=HALFTIME_WINDOW_MINUTES}={}){\n  if(!g)return false;\n  if(isHalftimeGameState(g))return true;\n  const status=statusOf(g);\n  if(status!=='in'&&status!=='live')return false;\n  const p=periodOf(g),clock=clockOf(g);\n  return p===2&&Number.isFinite(clock)&&clock>=0&&clock<=Number(thresholdMinutes??HALFTIME_WINDOW_MINUTES);\n}\n"""
          new_state="""export function isHalftimeGameState(g){\n  if(!g)return false;\n  const halfText=/half\\s*time|halftime|end of (?:the )?2nd|end of second/.test(detailOf(g));\n  if(halfText)return true;\n  const status=statusOf(g),p=periodOf(g),clock=clockOf(g);\n  if(!liveish(status))return false;\n  return p===2&&Number.isFinite(clock)&&clock<=0.05;\n}\n\nexport function isHalftimeWarmupGameState(g,{thresholdMinutes=HALFTIME_WINDOW_MINUTES}={}){\n  if(!g)return false;\n  if(isHalftimeGameState(g))return true;\n  const status=statusOf(g);\n  if(!liveish(status))return false;\n  const p=periodOf(g),clock=clockOf(g);\n  return p===2&&Number.isFinite(clock)&&clock>=0&&clock<=Number(thresholdMinutes??HALFTIME_WINDOW_MINUTES);\n}\n"""
          if old_state not in s: raise SystemExit('halftime state anchor missing')
          s=s.replace(old_state,new_state,1)
          s=s.replace("./halftime-validity.js?v=89.26","./halftime-validity.js?v=89.36",1)
          p.write_text(s)

          # 2) Validity: keep a same-score 50K board alive through the entire halftime interval.
          Path('sports/nfl/halftime-validity.js').write_text("""// Shared by the drawer and replay tests. Score/period mismatches invalidate immediately;\n// time-based freshness is long enough for a board built in late Q2 to remain usable at halftime.\nconst num=v=>v==null||v===''?null:Number.isFinite(Number(v))?Number(v):null;\nconst WINDOW_MINUTES=8;\nconst MAX_BOARD_AGE_MS=35*60*1000;\nconst MAX_LIVE_AGE_MS=15*60*1000;\nconst MAX_ODDS_TOTAL_AGE_SECONDS=35*60;\nfunction clockMinutes(live,game){\n  const direct=num(live?.clockMin??game?.clockMin);\n  if(direct!=null)return direct;\n  const raw=String(live?.clock??game?.clock??'').trim().toLowerCase();\n  if(/half\\s*time|halftime/.test(raw))return 0;\n  const m=raw.match(/^(\\d{1,2}):(\\d{2})$/);\n  return m?Number(m[1])+Number(m[2])/60:null;\n}\nfunction halfText(game,live){return /half\\s*time|halftime|end of (?:the )?(?:2nd|second)/i.test(`${game?.status||''} ${live?.status||''} ${game?.statusDetail||game?.detail||''} ${live?.statusDetail||''} ${game?.clock||''} ${live?.clock||''}`)}\nexport function halftimeBoardCurrent(board,game,now=Date.now()){\n  if(!board?.ready||!game)return false;\n  const live=game.liveScore||game;\n  const status=String(live.status||game.status||'').toLowerCase();\n  const period=num(live.period??game.period),clock=clockMinutes(live,game),isHalf=halfText(game,live);\n  const liveish=['in','live','halftime','half'].includes(status);\n  if(!isHalf&&!liveish)return false;\n  if(!isHalf&&period!==2)return false;\n  if(!isHalf&&!(clock!=null&&clock>=0&&clock<=WINDOW_MINUTES+.05))return false;\n  const generated=Date.parse(board.generatedAt||'');\n  if(!Number.isFinite(generated)||now-generated>MAX_BOARD_AGE_MS||generated>now+60000)return false;\n  const liveStamp=num(live.lastFetchedAt??game.lastFetchedAt);\n  if(liveStamp!=null&&(now-liveStamp>MAX_LIVE_AGE_MS||liveStamp>now+60000))return false;\n  if(Number(board.state?.period)!==2)return false;\n  const boardClock=num(board.state?.clockMin);\n  const boardDetail=String(board.state?.statusDetail||'');\n  if(!(/half\\s*time|halftime|end of (?:the )?(?:2nd|second)/i.test(boardDetail)||(boardClock!=null&&boardClock>=0&&boardClock<=WINDOW_MINUTES+.05)))return false;\n  for(const side of ['away','home']){\n    const current=num(live[`${side}Score`]??game[side]?.score);\n    if(current==null||current!==num(board.state?.[`${side}Score`]))return false;\n  }\n  const elapsed=Math.max(0,(now-generated)/1000);\n  return (board.candidates||[]).length>=2 && board.candidates.every(c=>{\n    const age=num(c.oddsAgeSeconds);\n    return age!=null&&age>=0&&age+elapsed<=MAX_ODDS_TOTAL_AGE_SECONDS;\n  });\n}\n""")

          # 3) PlayStage footer is selected-game aware instead of showing Monitoring at halftime.
          p=Path('sports/nfl/playstage-v886e.js')
          s=p.read_text()
          old="function halftime(h){if(h?.ready)return{t:'Halftime Lab Ready',s:`${h.games||h.gameCount||1} games loaded`};if(h?.warming||h?.eligibleGames?.length)return{t:'Halftime Lab Warming Up',s:'2:00 warning automation active'};return{t:'Halftime Lab Monitoring',s:'Auto-arms near the 2:00 mark in Q2'}}"
          new="""function gameId(g){return String(g?.id||g?.gameId||'')}\nfunction gameAtHalftime(g){\n  const live=g?.liveScore||g||{},detail=`${g?.status||''} ${live?.status||''} ${g?.statusDetail||''} ${live?.statusDetail||''} ${g?.clock||''} ${live?.clock||''}`.toLowerCase();\n  if(/half\\s*time|halftime|end of (?:the )?(?:2nd|second)/.test(detail))return true;\n  return Number(live?.period??g?.period)===2&&Number(live?.clockMin??g?.clockMin)<=.05;\n}\nfunction halftime(h,g){\n  const id=gameId(g),board=(h?.games||[]).find(x=>String(x?.gameId||x?.id||'')===id);\n  if(board?.ready)return{t:'Halftime Lab Ready',s:`${board?.candidates?.length||0} qualified props · 50K complete`};\n  if(gameAtHalftime(g))return{t:'Halftime Lab Calculating',s:'Live props + 50K board refreshing now'};\n  if(h?.ready)return{t:'Halftime Lab Ready',s:`${h.games||h.gameCount||1} games loaded`};\n  if(h?.warming||h?.eligibleGames?.length)return{t:'Halftime Lab Warming Up',s:'Late-Q2 automation active'};\n  return{t:'Halftime Lab Monitoring',s:'Auto-arms in late Q2'};\n}"""
          if old not in s: raise SystemExit('playstage halftime anchor missing')
          s=s.replace(old,new,1).replace('H=halftime(opts.halftime),poss=F.poss','H=halftime(opts.halftime,game),poss=F.poss',1)
          p.write_text(s)

          # 4) Production cache chain.
          p=Path('sports/nfl-preview.js'); s=p.read_text()
          s=s.replace("./nfl/playstage-v886e.js?v=89.34","./nfl/playstage-v886e.js?v=89.36",1)
          s=s.replace("./nfl/halftime-ui-v884.js?v=89.33","./nfl/halftime-ui-v884.js?v=89.36",1)
          p.write_text(s)
          p=Path('sports/nfl-preview-v890.js'); s=p.read_text().replace("./nfl-preview.js?v=89.34","./nfl-preview.js?v=89.36",1); p.write_text(s)
          p=Path('sports/nfl-preview-v893.js'); s=p.read_text().replace("./nfl-preview-v890.js?v=89.34","./nfl-preview-v890.js?v=89.36",1); p.write_text(s)
          p=Path('sports/router.js'); s=p.read_text().replace("./nfl-preview-v893.js?v=89.34","./nfl-preview-v893.js?v=89.36",1); p.write_text(s)
          p=Path('index.html'); s=p.read_text(); s2=re.sub(r'\.\/sports\/router\.js\?v=[A-Za-z0-9._-]+','./sports/router.js?v=90.36',s,count=1)
          if s2==s and './sports/router.js?v=90.36' not in s: raise SystemExit('index router cache anchor missing')
          p.write_text(s2)

          # 5) Permanent fast-path workflow must recognize explicit halftime statuses/details.
          p=Path('.github/workflows/nfl-live.yml'); s=p.read_text()
          old="""            const clock=Number(g?.clockMin);\n            const active=status==='in'||status==='live';\n            const inWindow=active && ((period===2 && Number.isFinite(clock) && clock<=8.05) || /half\\s*time|halftime|end of (?:the )?2nd|end of second/.test(detail));\n"""
          new="""            const clock=Number(g?.clockMin);\n            const half=/half\\s*time|halftime|end of (?:the )?2nd|end of second/.test(detail);\n            const active=status==='in'||status==='live'||status==='halftime'||status==='half'||half;\n            const inWindow=half || (active && period===2 && Number.isFinite(clock) && clock<=8.05);\n"""
          if old not in s: raise SystemExit('nfl-live halftime gate anchor missing')
          p.write_text(s.replace(old,new,1))

          # Keep the regression graph aligned with the emergency production chain.
          p=Path('.github/workflows/nfl-gamecast-tests.yml')
          if p.exists():
            s=p.read_text()
            s=s.replace('./nfl-preview.js?v=89.34','./nfl-preview.js?v=89.36')
            s=s.replace('./nfl-preview-v893.js?v=89.34','./nfl-preview-v893.js?v=89.36')
            s=s.replace('./nfl/playstage-v886e.js?v=89.34','./nfl/playstage-v886e.js?v=89.36')
            s=s.replace('./nfl/halftime-ui-v884.js?v=89.33','./nfl/halftime-ui-v884.js?v=89.36')
            s=re.sub(r"grep -F '\./sports/router\.js\?v=[^']+' index\.html","grep -F './sports/router.js?v=90.36' index.html",s,count=1)
            p.write_text(s)
          PY

      - name: Validate emergency client fix
        run: |
          node --check sports/nfl/halftime-ui-v884.js
          node --check sports/nfl/halftime-validity.js
          node --check sports/nfl/playstage-v886e.js
          node --check sports/nfl-preview.js
          node --check sports/nfl-preview-v890.js
          node --check sports/nfl-preview-v893.js
          node --check sports/router.js
          grep -F "./nfl/halftime-ui-v884.js?v=89.36" sports/nfl-preview.js
          grep -F "./nfl/playstage-v886e.js?v=89.36" sports/nfl-preview.js
          grep -F "./nfl-preview.js?v=89.36" sports/nfl-preview-v890.js
          grep -F "./nfl-preview-v890.js?v=89.36" sports/nfl-preview-v893.js
          grep -F "./nfl-preview-v893.js?v=89.36" sports/router.js
          grep -F "./sports/router.js?v=90.36" index.html

      - name: Refresh live NFL snapshot immediately
        run: node scripts/nfl-live-poller.mjs

      - name: Refresh late-Q2 and halftime sportsbook props immediately
        continue-on-error: true
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          NFL_LIVE_ENDPOINT: https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live
          NFL_HALFTIME_PREFETCH_MINUTES: 8
        run: node scripts/nfl-halftime-window-refresh.mjs

      - name: Build current halftime boards now
        env:
          NFL_LIVE_ENDPOINT: https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live
          NFL_SIM_FORCE: 1
        run: |
          GAME_IDS=$(node - <<'NODE'
          const fs=require('fs');
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const ids=[];
          for(const [id,g] of Object.entries(live.games||{})){
            const status=String(g?.status||'').toLowerCase();
            const detail=String(g?.statusDetail||'').toLowerCase();
            const p=Number(g?.period),c=Number(g?.clockMin);
            const half=/half\s*time|halftime|end of (?:the )?2nd|end of second/.test(detail);
            const active=['in','live','halftime','half'].includes(status)||half;
            if(half||(active&&p===2&&Number.isFinite(c)&&c<=8.05)) ids.push(id);
          }
          console.log(ids.join(','));
          NODE
          )
          echo "Emergency halftime game ids: $GAME_IDS"
          if [ -n "$GAME_IDS" ]; then
            node scripts/nfl-sim-auto.mjs --game "$GAME_IDS"
          fi

      - name: Verify current halftime readiness
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const ht=JSON.parse(fs.readFileSync('slates/nfl-halftime.json','utf8'));
          const now=Date.now();
          if(now-Number(live.lastFetchedAt)>5*60*1000) throw new Error('live snapshot is still stale');
          const ids=[];
          for(const [id,g] of Object.entries(live.games||{})){
            const status=String(g?.status||'').toLowerCase();
            const detail=String(g?.statusDetail||'').toLowerCase();
            const p=Number(g?.period),c=Number(g?.clockMin);
            const half=/half\s*time|halftime|end of (?:the )?2nd|end of second/.test(detail);
            if(half||(['in','live','halftime','half'].includes(status)&&p===2&&Number.isFinite(c)&&c<=8.05)) ids.push(id);
          }
          console.log('Current late-Q2/halftime games:',ids.join(',')||'none');
          for(const id of ids){
            const b=(ht.games||[]).find(x=>String(x.gameId)===String(id));
            if(!b?.ready) throw new Error(`halftime board ${id} not ready`);
            if(Number(b.iterations)!==50000) throw new Error(`halftime board ${id} is not 50K`);
            if((b.candidates||[]).length<2) throw new Error(`halftime board ${id} has fewer than 2 candidates`);
            console.log(`✓ ${id}: ${b.candidates.length} props / 50K READY`);
          }
          NODE

      - name: Commit emergency production recovery and fresh boards
        run: |
          git config user.name "TSO NFL Emergency Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports/nfl/halftime-ui-v884.js sports/nfl/halftime-validity.js sports/nfl/playstage-v886e.js sports/nfl-preview.js sports/nfl-preview-v890.js sports/nfl-preview-v893.js sports/router.js index.html .github/workflows/nfl-live.yml .github/workflows/nfl-gamecast-tests.yml slates/nfl-live.json
          [ -e slates/nfl-live-odds.json ] && git add slates/nfl-live-odds.json || true
          [ -e slates/nfl-halftime.json ] && git add slates/nfl-halftime.json || true
          git diff --staged --quiet && echo "No emergency changes to commit." && exit 0
          git commit -m "Make NFL halftime generator available throughout halftime"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt*2))
          done
          exit 1
