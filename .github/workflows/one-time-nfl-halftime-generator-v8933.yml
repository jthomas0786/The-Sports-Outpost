name: One-time NFL halftime generator repair v89.33

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-nfl-halftime-generator-v8933.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply halftime generator repair
        run: python3 scripts/apply-nfl-halftime-v8933.py

      - name: Validate halftime generator repair
        run: |
          node --check sports/nfl/halftime-ui-v884.js
          node --check sports/nfl/sim/auto.js
          node --check scripts/nfl-sim-auto.mjs
          node --check sports/nfl-preview.js
          node --check sports/nfl-preview-v890.js
          node --check sports/nfl-preview-v893.js
          node --check sports/router.js
          grep -F "window.addEventListener('tso:nfl-live-snapshot'" sports/nfl/halftime-ui-v884.js
          grep -F "liveOdds=null" sports/nfl/sim/auto.js
          grep -F "game,research,odds,liveGame,liveOdds" scripts/nfl-sim-auto.mjs
          grep -F "./nfl/halftime-ui-v884.js?v=89.33" sports/nfl-preview.js
          grep -F "./nfl-preview-v893.js?v=89.33" sports/router.js
          grep -F './sports/router.js?v=90.30' index.html
          node scripts/nfl-v8918-live-sim-selftest.mjs
          node scripts/nfl-v8920-flow-selftest.mjs
          node scripts/live-game-switcher-selftest.mjs

      - name: Trigger an immediate live halftime refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/nfl-live.yml')
          s=p.read_text()
          marker='# v89.33 halftime generator readiness refresh'
          if marker not in s:
              s=s.replace('name: NFL Live Snapshot\n','name: NFL Live Snapshot\n\n'+marker+'\n',1)
              p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name "TSO NFL Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports/nfl/halftime-ui-v884.js sports/nfl/sim/auto.js scripts/nfl-sim-auto.mjs scripts/nfl-v8918-live-sim-selftest.mjs sports/nfl-preview.js sports/nfl-preview-v890.js sports/nfl-preview-v893.js sports/router.js index.html scripts/live-game-switcher-selftest.mjs .github/workflows/nfl-gamecast-tests.yml .github/workflows/nfl-live.yml
          git diff --staged --quiet && echo "Already applied." && exit 0
          git commit -m "Fix NFL halftime parlay generator readiness"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected — rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 2))
          done
          exit 1
