name: One-time NFL Halftime Open Lab v89.23
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-nfl-halftime-open-v8923.yml'
      - 'sports/nfl/halftime-ui-v884.js'
      - 'sports/nfl-preview.js'
      - 'sports/nfl-preview-v890.js'
      - 'sports/nfl-preview-v893.js'
      - 'sports/router.js'
      - 'index.html'
      - 'scripts/nfl-halftime-open-v8923-selftest.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-halftime-open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check sports/nfl/halftime-ui-v884.js
          node --check sports/nfl-preview.js
          node --check sports/nfl-preview-v890.js
          node --check sports/nfl-preview-v893.js
      - name: Open Lab regression
        run: node scripts/nfl-halftime-open-v8923-selftest.mjs
