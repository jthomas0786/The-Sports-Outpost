name: One-time NFL halftime generator data refresh v89.33

on:
  push:
    paths:
      - '.github/workflows/one-time-nfl-halftime-refresh-v8933.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh live state and halftime sportsbook props
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          NFL_LIVE_ENDPOINT: https://hjhfbhpuuxnrexddplxd.supabase.co/functions/v1/nfl-live
          NFL_HALFTIME_PREFETCH_MINUTES: 8
        run: |
          node scripts/nfl-live-poller.mjs
          node scripts/nfl-halftime-window-refresh.mjs
          GAME_IDS=$(node - <<'NODE'
          const fs=require('fs');
          let live={games:{}};try{live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));}catch{}
          const ids=[];
          for(const [id,g] of Object.entries(live.games||{})){
            const status=String(g?.status||'').toLowerCase();
            const detail=String(g?.statusDetail||'').toLowerCase();
            const period=Number(g?.period),clock=Number(g?.clockMin);
            const active=status==='in'||status==='live';
            if(active&&((period===2&&Number.isFinite(clock)&&clock<=8.05)||/half\s*time|halftime|end of (?:the )?2nd|end of second/.test(detail)))ids.push(id);
          }
          process.stdout.write(ids.join(','));
          NODE
          )
          if [ -n "$GAME_IDS" ]; then
            echo "Building fresh 50K halftime board(s): $GAME_IDS"
            NFL_SIM_FORCE=1 node scripts/nfl-sim-auto.mjs --game "$GAME_IDS" --live-file slates/nfl-live.json
          else
            echo "No game is currently inside the late-Q2/halftime window."
          fi
      - name: Publish refreshed halftime data
        run: |
          git config user.name "TSO NFL Live Bot"
          git config user.email "actions@users.noreply.github.com"
          [ -e slates/nfl-live.json ] && git add slates/nfl-live.json || true
          [ -e slates/nfl-live-odds.json ] && git add slates/nfl-live-odds.json || true
          [ -e slates/nfl-halftime.json ] && git add slates/nfl-halftime.json || true
          [ -e slates/nfl-sim.json ] && git add slates/nfl-sim.json || true
          [ -e slates/nfl-sim-state.json ] && git add slates/nfl-sim-state.json || true
          git diff --staged --quiet && echo "No halftime data changes to publish." && exit 0
          git commit -m "Refresh NFL halftime generator data"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 2))
          done
          exit 1
