name: One-time NFL possession football exclusivity v89.24

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-nfl-live-stability-v899.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache-bust exclusive possession football
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if new in s:
                  print(label, 'already applied'); return
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              p.write_text(s.replace(old,new,1))
              print('applied', label)

          replace_once('sports/router.js',"./nfl-preview-v893.js?v=89.28","./nfl-preview-v893.js?v=89.29",'NFL wrapper cache bust')
          replace_once('scripts/live-game-switcher-selftest.mjs',"./nfl-preview-v893.js?v=89.28","./nfl-preview-v893.js?v=89.29",'selector cache expectation')
          replace_once('scripts/live-game-switcher-selftest.mjs',"./nfl/gamecast-possession-ball-v8922.js?v=89.23","./nfl/gamecast-possession-ball-v8922.js?v=89.24",'possession module cache expectation')

          p=Path('index.html'); s=p.read_text()
          s2=re.sub(r'\.\/sports\/router\.js\?v=[A-Za-z0-9._-]+','./sports/router.js?v=90.26',s,count=1)
          if s2==s and './sports/router.js?v=90.26' not in s:
              raise SystemExit('missing index router cache anchor')
          p.write_text(s2)
          PY
      - name: Validate exclusive aligned possession football
        run: |
          node --check sports/nfl/gamecast-possession-ball-v8922.js
          node --check sports/nfl-preview-v893.js
          node --check sports/router.js
          grep -F "gamecast-possession-ball-v8922.js?v=89.24" sports/nfl-preview-v893.js
          grep -F "./nfl-preview-v893.js?v=89.29" sports/router.js
          grep -F './sports/router.js?v=90.26' index.html
          grep -F 'root.querySelectorAll' sports/nfl/gamecast-possession-ball-v8922.js
          grep -F "side==='away'" sports/nfl/gamecast-possession-ball-v8922.js
          grep -F "name.insertAdjacentElement('beforebegin',badge)" sports/nfl/gamecast-possession-ball-v8922.js
          grep -F 'nxg-team-name-line' sports/nfl/gamecast-possession-ball-v8922.js
          node scripts/live-game-switcher-selftest.mjs
          node scripts/nfl-v893-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
          node scripts/nfl-v8915-gamecast-motion-selftest.mjs
          node scripts/nfl-v8916-live-personnel-selftest.mjs
      - name: Commit cache bust
        run: |
          git config user.name 'TSO NFL Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/router.js index.html scripts/live-game-switcher-selftest.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Cache-bust exclusive NFL possession football'
          git pull --rebase origin main
          git push origin HEAD:main
