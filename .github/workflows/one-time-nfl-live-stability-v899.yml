name: One-time NFL possession football v89.22

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-nfl-live-stability-v899.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache-bust NFL possession football
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s2=re.sub(r'\.\/sports\/router\.js\?v=[A-Za-z0-9._-]+','./sports/router.js?v=90.24',s,count=1)
          if s2==s and './sports/router.js?v=90.24' not in s:
              raise SystemExit('missing index router cache anchor')
          p.write_text(s2)
          PY
      - name: Validate possession football layer
        run: |
          node --check sports/nfl/gamecast-possession-ball-v8922.js
          node --check sports/nfl-preview-v893.js
          node --check sports/router.js
          grep -F "gamecast-possession-ball-v8922.js?v=89.22" sports/nfl-preview-v893.js
          grep -F "installNflGamecastPossessionBallV8922" sports/nfl-preview-v893.js
          grep -F "./nfl-preview-v893.js?v=89.27" sports/router.js
          grep -F './sports/router.js?v=90.24' index.html
          grep -F 'nxg-possession-ball' sports/nfl/gamecast-possession-ball-v8922.js
          grep -F 'nxg-posstext{display:none' sports/nfl/gamecast-possession-ball-v8922.js
          node scripts/nfl-v893-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
          node scripts/nfl-v8915-gamecast-motion-selftest.mjs
          node scripts/nfl-v8916-live-personnel-selftest.mjs
      - name: Commit cache bust
        run: |
          git config user.name 'TSO NFL Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Cache-bust NFL possession football'
          git pull --rebase origin main
          git push origin HEAD:main
