name: One-time NFL field position cache bust v89.25

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-nfl-live-stability-v899.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache-bust NFL field position authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s2=re.sub(r'\.\/sports\/router\.js\?v=[A-Za-z0-9._-]+','./sports/router.js?v=90.27',s,count=1)
          if s2==s and './sports/router.js?v=90.27' not in s:
              raise SystemExit('missing index router cache anchor')
          p.write_text(s2)
          PY
      - name: Validate NFL field position authority
        run: |
          node --check sports/nfl/gamecast-field-position-v8925.js
          node --check sports/nfl-preview-v893.js
          node --check sports/router.js
          grep -F "gamecast-field-position-v8925.js?v=89.25" sports/nfl-preview-v893.js
          grep -F "installNflGamecastFieldPositionV8925" sports/nfl-preview-v893.js
          grep -F "./nfl-preview-v893.js?v=89.30" sports/router.js
          grep -F './sports/router.js?v=90.27' index.html
          node --input-type=module - <<'NODE'
          import {__V8925_TEST__ as T} from './sports/nfl/gamecast-field-position-v8925.js';
          const snap={gameId:'bal-ind',away:{abbr:'BAL'},home:{abbr:'IND'},possession:'away',liveScore:{downDistanceText:'2nd & Goal at IND 4',distance:4},gamecastState:{possession:'away',playOffenseSide:'away',resultYards:2,startDistance:6}};
          T.repairSnapshot(snap);
          if(snap.gamecastState.currentYardFromOwn!==96)throw new Error('BAL @ IND 4 must resolve to BAL own-96');
          if(snap.gamecastState.startYardFromOwn!==94)throw new Error('play must begin from previous LOS');
          console.log('field-position authority OK',snap.gamecastState);
          NODE
          node scripts/live-game-switcher-selftest.mjs
          node scripts/nfl-v8915-gamecast-motion-selftest.mjs
          node scripts/nfl-v8916-live-personnel-selftest.mjs
      - name: Commit cache bust
        run: |
          git config user.name 'TSO NFL Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Cache-bust NFL field position authority'
          git pull --rebase origin main
          git push origin HEAD:main
