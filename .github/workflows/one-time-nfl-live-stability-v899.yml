name: One-time NFL PlayStage visibility guard v89.9

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-nfl-live-stability-v899.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump production router cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s2=re.sub(r'\.\/sports\/router\.js\?v=[A-Za-z0-9._-]+','./sports/router.js?v=90.22',s,count=1)
          if s2==s and './sports/router.js?v=90.22' not in s:
              raise SystemExit('missing index router cache anchor')
          p.write_text(s2)
          PY
      - name: Validate PlayStage visibility guard
        run: |
          node --check sports/router.js
          node --check sports/nfl-preview-v893.js
          node --check sports/nfl/gamecast-stage-guard-v899.js
          grep -F './sports/router.js?v=90.22' index.html
          grep -F "./nfl-preview-v893.js?v=89.25" sports/router.js
          grep -F "./nfl-preview-v890.js?v=89.20.4" sports/nfl-preview-v893.js
          grep -F "gamecast-stage-guard-v899.js?v=89.9" sports/nfl-preview-v893.js
          grep -F "installNflGamecastStageGuardV899" sports/nfl-preview-v893.js
          grep -F 'data-tso-stage-art-ready' sports/nfl/gamecast-stage-guard-v899.js
          grep -F 'tso-ps886e__actorGraphic>svg' sports/nfl/gamecast-stage-guard-v899.js
          node scripts/live-game-switcher-selftest.mjs
          node scripts/nfl-v893-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
          node scripts/nfl-v8915-gamecast-motion-selftest.mjs
          node scripts/nfl-v8916-live-personnel-selftest.mjs
      - name: Commit cache bump
        run: |
          git config user.name 'TSO NFL Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deploy NFL PlayStage visibility guard'
          git pull --rebase origin main
          git push origin HEAD:main
