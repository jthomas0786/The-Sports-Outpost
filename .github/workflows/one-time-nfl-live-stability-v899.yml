name: One-time NFL possession football alignment v89.23

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-nfl-live-stability-v899.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache-bust aligned possession football
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if new in s:
                  print(label, 'already applied'); return
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              p.write_text(s.replace(old,new,1))
              print('applied', label)

          replace_once('sports/router.js',"./nfl-preview-v893.js?v=89.27","./nfl-preview-v893.js?v=89.28",'NFL wrapper cache bust')
          replace_once('scripts/live-game-switcher-selftest.mjs',"./nfl-preview-v893.js?v=89.27","./nfl-preview-v893.js?v=89.28",'selector cache expectation')
          replace_once('scripts/live-game-switcher-selftest.mjs',"./nfl/gamecast-possession-ball-v8922.js?v=89.22","./nfl/gamecast-possession-ball-v8922.js?v=89.23",'possession module cache expectation')

          p=Path('index.html'); s=p.read_text()
          s2=re.sub(r'\.\/sports\/router\.js\?v=[A-Za-z0-9._-]+','./sports/router.js?v=90.25',s,count=1)
          if s2==s and './sports/router.js?v=90.25' not in s:
              raise SystemExit('missing index router cache anchor')
          p.write_text(s2)

          p=Path('.github/workflows/nfl-gamecast-tests.yml'); s=p.read_text()
          s=s.replace('./sports/router.js?v=90.24','./sports/router.js?v=90.25')
          s=s.replace('./nfl-preview-v893.js?v=89.27','./nfl-preview-v893.js?v=89.28')
          s=s.replace('gamecast-possession-ball-v8922.js?v=89.22','gamecast-possession-ball-v8922.js?v=89.23')
          p.write_text(s)
          PY
      - name: Validate aligned possession football
        run: |
          node --check sports/nfl/gamecast-possession-ball-v8922.js
          node --check sports/nfl-preview-v893.js
          node --check sports/router.js
          grep -F "gamecast-possession-ball-v8922.js?v=89.23" sports/nfl-preview-v893.js
          grep -F "installNflGamecastPossessionBallV8922" sports/nfl-preview-v893.js
          grep -F "./nfl-preview-v893.js?v=89.28" sports/router.js
          grep -F './sports/router.js?v=90.25' index.html
          grep -F 'background:none!important;border:0!important;border-radius:0!important' sports/nfl/gamecast-possession-ball-v8922.js
          grep -F "name.insertAdjacentElement('afterend',badge)" sports/nfl/gamecast-possession-ball-v8922.js
          grep -F 'nxg-posstext{display:none!important}' sports/nfl/gamecast-possession-ball-v8922.js
          node scripts/live-game-switcher-selftest.mjs
          node scripts/nfl-v893-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
          node scripts/nfl-v8915-gamecast-motion-selftest.mjs
          node scripts/nfl-v8916-live-personnel-selftest.mjs
      - name: Commit aligned possession football
        run: |
          git config user.name 'TSO NFL Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/router.js index.html scripts/live-game-switcher-selftest.mjs .github/workflows/nfl-gamecast-tests.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Align NFL possession football with team name'
          git pull --rebase origin main
          git push origin HEAD:main
