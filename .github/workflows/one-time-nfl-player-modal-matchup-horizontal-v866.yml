name: One-time NFL player modal matchup horizontal v86.6

on:
  push:
    paths:
      - '.github/workflows/one-time-nfl-player-modal-matchup-horizontal-v866.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make player matchup header horizontal and use team logos
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('sports/nfl-research-ui.js')
          s=path.read_text()

          # Cache/style identity.
          if 'tso-nfl-research-ui-v865' not in s:
            raise SystemExit('Expected v865 research style identity not found')
          s=s.replace('tso-nfl-research-ui-v865','tso-nfl-research-ui-v866')

          # Strengthen opponent logo lookup with an ESPN team-logo fallback.
          old="""function opponentLogo(root,opp){
            const code=normTeam(opp);
            for(const head of root.querySelectorAll('.nfl-team-board-head,.nfl-match-team')){
              const txt=(head.textContent||'').toUpperCase();
              if(!txt.includes(code)) continue;
              const img=head.querySelector('img'); if(img?.src) return img.src;
            }
            return null;
          }"""
          new="""function opponentLogo(root,opp){
            const code=normTeam(opp);
            for(const head of root.querySelectorAll('.nfl-team-board-head,.nfl-match-team,.nfl-team,.nxg-team')){
              const txt=(head.textContent||'').toUpperCase();
              if(!txt.includes(code)) continue;
              const img=head.querySelector('img'); if(img?.src) return img.src;
            }
            const espnCode=String(code||'').toLowerCase();
            return espnCode ? `https://a.espncdn.com/i/teamlogos/nfl/500/${espnCode}.png` : null;
          }"""
          if old not in s:
            raise SystemExit('opponentLogo block not found')
          s=s.replace(old,new,1)

          # Replace both TD and non-TD matchup headers with the same horizontal strip.
          old_header='''<div class="hm-compare tso-nfl-clear-matchup-head"><div class="hm-side"><div class="hm-headshot">${playerImg}</div><div class="hm-name">${esc(name)}</div><div class="hm-hand-badge hm-bat">${esc(depthLabel(r,pos))} · ${snapText} snaps</div></div><div class="hm-vs">VS</div><div class="hm-side"><div class="hm-headshot">${oppImg}</div><div class="hm-name">${esc(opp||'Opponent')}</div><div class="hm-hand-badge hm-pitch">vs ${esc(posGroup)}</div></div></div>'''
          new_header='''<div class="tso-nfl-matchup-strip"><div class="tso-nfl-matchup-person"><div class="tso-nfl-matchup-avatar player">${playerImg}</div><div class="tso-nfl-matchup-copy"><b>${esc(name)}</b><span>${esc(depthLabel(r,pos))} · ${snapText} snaps</span></div></div><div class="tso-nfl-matchup-vs">VS</div><div class="tso-nfl-matchup-person opponent"><div class="tso-nfl-matchup-avatar team">${oppImg}</div><div class="tso-nfl-matchup-copy"><b>${esc(opp||'Opponent')}</b><span>vs ${esc(posGroup)}</span></div></div></div>'''
          count=s.count(old_header)
          if count != 2:
            raise SystemExit(f'Expected 2 old matchup headers, found {count}')
          s=s.replace(old_header,new_header)

          # Add dedicated horizontal layout CSS before the stylesheet closes.
          css=r'''
            .tso-nfl-player-card-v70 .tso-nfl-matchup-strip,.tso-nfl-player-card-v72 .tso-nfl-matchup-strip{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;margin:10px 0 14px;padding:14px 16px;border:1px solid rgba(120,176,239,.14);border-radius:12px;background:rgba(4,17,38,.38)}
            .tso-nfl-matchup-person{display:flex;align-items:center;gap:12px;min-width:0}.tso-nfl-matchup-person.opponent{justify-content:flex-start}
            .tso-nfl-matchup-avatar{width:76px;height:76px;flex:0 0 76px;display:grid;place-items:center}.tso-nfl-matchup-avatar.player{border-radius:50%;overflow:hidden;background:rgba(16,34,64,.75);border:1px solid rgba(120,176,239,.22)}.tso-nfl-matchup-avatar.team{border-radius:12px;background:transparent;border:0;overflow:visible}
            .tso-nfl-matchup-avatar img,.tso-nfl-matchup-avatar .hm-img,.tso-nfl-matchup-avatar .tso-nfl-matchup-photo{display:block;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;object-fit:contain!important}.tso-nfl-matchup-avatar.player img,.tso-nfl-matchup-avatar.player .hm-img{object-fit:cover!important;border-radius:50%!important}
            .tso-nfl-matchup-copy{display:flex;flex-direction:column;gap:5px;min-width:0}.tso-nfl-matchup-copy b{font:800 17px/1.05 'Satoshi','Inter',sans-serif;color:#f4f7ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tso-nfl-matchup-copy span{width:max-content;max-width:100%;padding:3px 7px;border:1px solid rgba(45,127,255,.36);border-radius:999px;background:rgba(45,127,255,.09);font:700 9px/1 'JetBrains Mono',monospace;color:#8fc3ff;white-space:nowrap}
            .tso-nfl-matchup-vs{font:900 11px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:#7f8ba1;text-align:center}
            @media(max-width:640px){.tso-nfl-player-card-v70 .tso-nfl-matchup-strip,.tso-nfl-player-card-v72 .tso-nfl-matchup-strip{gap:10px;padding:11px 10px}.tso-nfl-matchup-person{gap:8px}.tso-nfl-matchup-avatar{width:54px;height:54px;flex-basis:54px}.tso-nfl-matchup-copy b{font-size:13px}.tso-nfl-matchup-copy span{font-size:7px;padding:3px 5px}.tso-nfl-matchup-vs{font-size:9px}}
          '''
          anchor='\n  `;\n  document.head.appendChild(style);'
          if anchor not in s:
            raise SystemExit('research stylesheet close not found')
          s=s.replace(anchor,css+anchor,1)
          path.write_text(s)

          # Cache-bust research module and router.
          router=Path('sports/router.js')
          rs=router.read_text()
          if "./nfl-research-ui.js?v=86.5" not in rs:
            raise SystemExit('Expected research cache v86.5 not found')
          router.write_text(rs.replace("./nfl-research-ui.js?v=86.5","./nfl-research-ui.js?v=86.6",1))

          index=Path('index.html')
          ix=index.read_text()
          if './sports/router.js?v=90.33' not in ix:
            raise SystemExit('Expected router cache v90.33 not found')
          index.write_text(ix.replace('./sports/router.js?v=90.33','./sports/router.js?v=90.34',1))
          PY

      - name: Validate production files
        run: |
          node --check sports/nfl-research-ui.js
          node --check sports/router.js
          grep -F 'tso-nfl-matchup-strip' sports/nfl-research-ui.js
          grep -F 'https://a.espncdn.com/i/teamlogos/nfl/500/${espnCode}.png' sports/nfl-research-ui.js
          grep -F './nfl-research-ui.js?v=86.6' sports/router.js
          grep -F './sports/router.js?v=90.34' index.html

      - name: Commit production repair
        run: |
          git config user.name "TSO NFL UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports/nfl-research-ui.js sports/router.js index.html
          git diff --staged --quiet && echo "Already applied." && exit 0
          git commit -m "Make NFL player matchup header horizontal"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 2))
          done
          exit 1
