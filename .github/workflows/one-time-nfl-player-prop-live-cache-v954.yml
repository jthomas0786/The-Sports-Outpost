name: One-time NFL Player Prop Tool v95.4 Live Cache

on:
  push:
    paths:
      - 'scripts/apply-nfl-player-prop-live-cache-v954.py'
      - '.github/workflows/one-time-nfl-player-prop-live-cache-v954.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-player-prop-live-cache-v954
  cancel-in-progress: true

jobs:
  repair-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Apply permanent live prop-cache preservation and repair current live games
        run: python3 scripts/apply-nfl-player-prop-live-cache-v954.py
      - name: Run simulation and Player Prop static regressions
        run: |
          node scripts/nfl-sim-auto-selftest.mjs
          node scripts/nfl-player-prop-tool-v947-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
          node scripts/nfl-v901-halftime-ready-sync-selftest.mjs
      - name: Verify every current live game retains a frozen Prop Tool board
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nfl.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const sim=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const slateIds=new Set((slate.games||[]).map(g=>String(g.gameId||g.id||'')));
          const isLive=g=>{
            const status=String(g?.status||'').toLowerCase();
            const detail=String(g?.statusDetail||g?.detail||'').toLowerCase();
            if(['post','final','completed','closed'].includes(status)||detail.includes('final'))return false;
            return ['in','live','halftime','half'].includes(status)||detail.includes('halftime');
          };
          const liveIds=Object.entries(live.games||{}).filter(([id,g])=>slateIds.has(String(id))&&isLive(g)).map(([id])=>String(id));
          const byId=new Map((sim.games||[]).map(g=>[String(g?.game?.gameId||g.gameId||''),g]));
          if(!liveIds.length){console.log('No live NFL games at verification time; preservation regression still ran.');process.exit(0);}
          for(const id of liveIds){
            const g=byId.get(id),board=g?.propStyles;
            if(!g)throw new Error(`Live game ${id} is missing from nfl-sim.json`);
            if(!board?.ready||!board?.candidates?.length)throw new Error(`Live game ${id} lost its frozen propStyles board`);
            if(!(board?.rankings?.tsoPick||[]).length)throw new Error(`Live game ${id} has no TSO Pick rows for the Player Prop Tool`);
            console.log(`✓ live ${id}: ${board.candidates.length} frozen candidates · ${(board.rankings.tsoPick||[]).length} TSO Pick rows retained`);
          }
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/nfl-ppt-live-v954.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nfl-ppt-live-v954.log
          exit 1
      - name: Run full NFL Player Prop Tool Chromium regression
        run: npx playwright test tests/nfl-player-prop-tool-v947.spec.js --reporter=line --workers=1
      - name: Re-sync latest main, reapply verified repair, and push production cutover
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/apply-nfl-player-prop-live-cache-v954.py
            node scripts/nfl-sim-auto-selftest.mjs
            node scripts/nfl-player-prop-tool-v947-selftest.mjs
            node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nfl.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const sim=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const slateIds=new Set((slate.games||[]).map(g=>String(g.gameId||g.id||'')));
          const isLive=g=>{const s=String(g?.status||'').toLowerCase(),d=String(g?.statusDetail||g?.detail||'').toLowerCase();return !['post','final','completed','closed'].includes(s)&&!d.includes('final')&&(['in','live','halftime','half'].includes(s)||d.includes('halftime'));};
          const ids=Object.entries(live.games||{}).filter(([id,g])=>slateIds.has(String(id))&&isLive(g)).map(([id])=>String(id));
          const byId=new Map((sim.games||[]).map(g=>[String(g?.game?.gameId||g.gameId||''),g]));
          for(const id of ids){const b=byId.get(id)?.propStyles;if(!b?.ready||!b?.candidates?.length||!(b?.rankings?.tsoPick||[]).length)throw new Error(`Live Prop Tool cache not ready for ${id}`);}
          console.log(`✓ final live-cache gate: ${ids.length} live game(s) retain Player Prop rows`);
          NODE
            rm scripts/apply-nfl-player-prop-live-cache-v954.py
            rm .github/workflows/one-time-nfl-player-prop-live-cache-v954.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add sports/nfl/sim/auto.js scripts/nfl-sim-auto.mjs scripts/nfl-sim-auto-selftest.mjs slates/nfl-sim.json scripts/apply-nfl-player-prop-live-cache-v954.py .github/workflows/one-time-nfl-player-prop-live-cache-v954.yml
            git commit -m 'Keep NFL Player Prop data available during live games'
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/nfl-ppt-live-v954.log || true
