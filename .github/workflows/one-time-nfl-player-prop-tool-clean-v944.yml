name: One-time NFL Player Prop Tool Single Authority v94.6

# Retriggered after production QA exposed stale competing writers on the live Player Prop Tool.
on:
  push:
    paths:
      - 'scripts/apply-nfl-player-prop-tool-v944-cleanup.py'
      - 'scripts/fix-nfl-player-prop-tool-v946.py'
      - '.github/workflows/one-time-nfl-player-prop-tool-clean-v944.yml'

permissions:
  contents: write

concurrency:
  group: one-time-nfl-player-prop-tool-clean-v946
  cancel-in-progress: true

jobs:
  clean-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Apply v94.6 selector and QA corrections
        run: python3 scripts/fix-nfl-player-prop-tool-v946.py

      - name: Delete retired writers and apply v94.6 single authority
        run: python3 scripts/apply-nfl-player-prop-tool-v944-cleanup.py

      - name: Run static regressions
        run: |
          node scripts/nfl-player-prop-tool-v945-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs

      - name: Check complete frozen sportsbook prop-board cache
        id: prop_cache
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nfl.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const doc=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const isFinal=id=>['post','final','completed'].includes(String(live?.games?.[id]?.status||'').toLowerCase());
          const required=(slate.games||[]).map(g=>String(g.gameId||g.id)).filter(id=>id&&!isFinal(id));
          const valid=new Set((doc.games||[]).filter(g=>Number(g.iterations)>=50000&&g.propStyles?.ready&&g.propStyles?.candidates?.length).map(g=>String(g?.game?.gameId||g.gameId||'')));
          const missing=required.filter(id=>!valid.has(id));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`ready=${required.length>0&&missing.length===0?'true':'false'}\nmissing=${missing.join(',')}\n`);
          console.log(missing.length?`Missing ${missing.length}/${required.length} frozen 50K sportsbook board(s): ${missing.join(', ')}`:`✓ Reusing complete ${required.length}-game frozen 50K sportsbook cache`);
          NODE

      - name: Build missing 50K sportsbook prop boards once
        if: steps.prop_cache.outputs.ready != 'true'
        env:
          NFL_SIM_FORCE: '1'
          MISSING_GAMES: ${{ steps.prop_cache.outputs.missing }}
        run: node scripts/nfl-sim-auto.mjs --force --game "$MISSING_GAMES"

      - name: Verify complete frozen 50K sportsbook prop boards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nfl.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const doc=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const isFinal=id=>['post','final','completed'].includes(String(live?.games?.[id]?.status||'').toLowerCase());
          const required=(slate.games||[]).map(g=>String(g.gameId||g.id)).filter(id=>id&&!isFinal(id));
          const games=(doc.games||[]).filter(g=>Number(g.iterations)>=50000&&g.propStyles?.ready&&g.propStyles?.candidates?.length);
          const byGame=new Map(games.map(g=>[String(g?.game?.gameId||g.gameId||''),g]));
          const missing=required.filter(id=>!byGame.has(id));
          if(missing.length)throw new Error(`Missing frozen 50K sportsbook boards for ${missing.join(', ')}`);
          for(const id of required){
            const g=byGame.get(id),byId=new Map((g.propStyles.candidates||[]).map(c=>[String(c.id),c]));
            for(const [style,ids] of Object.entries(g.propStyles.rankings||{}))for(const candidateId of ids||[]){
              const c=byId.get(String(candidateId));
              if(!c)throw new Error(`Missing ${style} candidate ${candidateId}`);
              if(Number(c.iterations)<50000)throw new Error(`${candidateId} is not 50K-backed`);
              if(!Number.isFinite(Number(c.line))||!['over','under'].includes(c.side))throw new Error(`${candidateId} missing prop line/side`);
              if(!Number.isFinite(Number(c.price))||!c.book)throw new Error(`${candidateId} missing sportsbook price`);
              if(!c.projection||!Number.isFinite(Number(c.projection.mean)))throw new Error(`${candidateId} missing 50K projection distribution`);
            }
          }
          console.log(`✓ ${required.length} active/upcoming game(s) contain frozen sportsbook-backed 50K Bet Style boards`);
          NODE

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/nfl-prop-v946-server.log 2>&1 &
          echo $! >/tmp/nfl-prop-v946-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nfl-prop-v946-server.log
          exit 1

      - name: Reproduce uploaded-video interactions
        run: |
          npx playwright test tests/nfl-player-prop-tool-authority-v945.spec.js --reporter=line --workers=1

      - name: Run complete Player Prop Tool browser regression
        run: |
          npx playwright test tests/nfl-player-prop-tool-v923.spec.js tests/nfl-player-prop-tool-theme-v936.spec.js tests/nfl-player-prop-tool-polish-v938.spec.js tests/nfl-player-prop-tool-authority-v945.spec.js --reporter=line --workers=1

      - name: Retire one-time bootstrap helpers
        run: rm -f .github/workflows/one-time-nfl-player-prop-tool-clean-v944.yml scripts/fix-nfl-player-prop-tool-v946.py

      - name: Commit and push verified v94.6 cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No v94.6 changes to commit'; exit 1; }
          git commit -m 'Finish NFL Prop Tool single authority v94.6'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/nfl-prop-v946-server.log || true
