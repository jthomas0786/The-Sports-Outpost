name: One-time NFL Player Prop Tool Single Authority v94.4

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply-nfl-player-prop-tool-v944-cleanup.py'
      - 'tests/nfl-player-prop-tool-clean-v944.spec.js'
      - '.github/workflows/one-time-nfl-player-prop-tool-clean-v944.yml'

permissions:
  contents: write

concurrency:
  group: one-time-nfl-player-prop-tool-clean-v944
  cancel-in-progress: true

jobs:
  clean-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Delete stale column writer and apply v94.4 authority fix
        run: python3 scripts/apply-nfl-player-prop-tool-v944-cleanup.py

      - name: Run static regressions
        run: |
          node scripts/nfl-player-prop-tool-v944-selftest.mjs
          node scripts/nfl-player-prop-tool-v940-selftest.mjs
          node scripts/nfl-player-prop-tool-v923-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs

      - name: Verify frozen 50K sportsbook prop boards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const doc=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const games=(doc.games||[]).filter(g=>Number(g.iterations)>=50000&&g.propStyles?.ready&&g.propStyles?.candidates?.length);
          if(!games.length)throw new Error('No published 50K sportsbook-aware propStyles cache');
          for(const g of games){
            const byId=new Map((g.propStyles.candidates||[]).map(c=>[String(c.id),c]));
            for(const [style,ids] of Object.entries(g.propStyles.rankings||{}))for(const id of ids||[]){
              const c=byId.get(String(id));
              if(!c)throw new Error(`Missing ${style} candidate ${id}`);
              if(Number(c.iterations)<50000)throw new Error(`${id} is not 50K-backed`);
              if(!Number.isFinite(Number(c.line))||!['over','under'].includes(c.side))throw new Error(`${id} missing prop line/side`);
              if(!Number.isFinite(Number(c.price))||!c.book)throw new Error(`${id} missing sportsbook price`);
            }
          }
          console.log(`✓ ${games.length} game(s) contain frozen sportsbook-backed 50K Bet Style boards`);
          NODE

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/nfl-prop-v944-server.log 2>&1 &
          echo $! >/tmp/nfl-prop-v944-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nfl-prop-v944-server.log
          exit 1

      - name: Reproduce stale-column video interaction
        run: |
          npx playwright test tests/nfl-player-prop-tool-clean-v944.spec.js tests/nfl-player-prop-tool-build-period-v940.spec.js --reporter=line --workers=1

      - name: Run complete Player Prop Tool browser regression
        run: |
          npx playwright test tests/nfl-player-prop-tool-v923.spec.js tests/nfl-player-prop-tool-theme-v936.spec.js tests/nfl-player-prop-tool-polish-v938.spec.js tests/nfl-player-prop-tool-sim-v939.spec.js tests/nfl-player-prop-tool-build-period-v940.spec.js tests/nfl-player-prop-tool-clean-v944.spec.js --reporter=line --workers=1

      - name: Commit and push verified v94.4 cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No v94.4 changes to commit'; exit 1; }
          git commit -m 'Delete stale NFL Prop Tool column layer v94.4'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/nfl-prop-v944-server.log || true
