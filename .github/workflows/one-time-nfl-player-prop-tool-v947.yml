name: One-time NFL Player Prop Tool v94.8 Readability Cutover
# strict data ownership: 50K model columns vs actual game-log columns

on:
  push:
    paths:
      - 'scripts/apply-nfl-player-prop-tool-v947.py'
      - 'scripts/apply-nfl-player-prop-tool-v948-proj-l10.py'
      - 'scripts/apply-nfl-player-prop-tool-v948-side-filter.py'
      - 'scripts/fix-nfl-player-prop-tool-v948-browser-qa.py'
      - '.github/workflows/one-time-nfl-player-prop-tool-v947.yml'

permissions:
  contents: write

concurrency:
  group: one-time-nfl-player-prop-tool-v947
  cancel-in-progress: true

jobs:
  cutover-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply v94.8 production cutover
        run: |
          python3 scripts/apply-nfl-player-prop-tool-v947.py
          python3 scripts/apply-nfl-player-prop-tool-v948-proj-l10.py
          python3 scripts/fix-nfl-player-prop-tool-v948-browser-qa.py
          python3 scripts/apply-nfl-player-prop-tool-v948-side-filter.py
      - name: Run v94.8 static regressions
        run: |
          node scripts/nfl-player-prop-tool-v947-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
      - name: Find missing frozen 50K Bet Style boards
        id: boards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nfl.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const sim=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const isFinal=id=>['post','final','completed'].includes(String(live?.games?.[id]?.status||'').toLowerCase());
          const required=(slate.games||[]).map(g=>String(g.gameId||g.id||'')).filter(id=>id&&!isFinal(id));
          const good=new Set((sim.games||[]).filter(g=>Number(g.iterations)>=50000&&g.propStyles?.ready&&g.propStyles?.candidates?.length).map(g=>String(g?.game?.gameId||g.gameId||'')));
          const missing=required.filter(id=>!good.has(id));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`missing=${missing.join(',')}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`ready=${missing.length?'false':'true'}\n`);
          console.log(missing.length?`Missing ${missing.length} board(s): ${missing.join(', ')}`:`All ${required.length} active/upcoming boards already ready`);
          NODE
      - name: Build only missing 50K Bet Style boards
        if: steps.boards.outputs.ready != 'true'
        env:
          NFL_SIM_FORCE: 1
        run: node scripts/nfl-sim-auto.mjs --force --game "${{ steps.boards.outputs.missing }}"
      - name: Verify frozen 50K Bet Style boards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nfl.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const sim=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const isFinal=id=>['post','final','completed'].includes(String(live?.games?.[id]?.status||'').toLowerCase());
          const required=(slate.games||[]).map(g=>String(g.gameId||g.id||'')).filter(id=>id&&!isFinal(id));
          const byGame=new Map((sim.games||[]).map(g=>[String(g?.game?.gameId||g.gameId||''),g]));
          let choices=0;
          for(const id of required){
            const g=byGame.get(id);
            if(Number(g?.iterations)<50000||!g?.propStyles?.ready||!g?.propStyles?.candidates?.length)throw new Error(`Missing frozen 50K propStyles for ${id}`);
            const byId=new Map(g.propStyles.candidates.map(c=>[String(c.id),c]));
            for(const style of ['tsoPick','safest','bestEdge','balanced','aggressive','correlated','longshot']){
              for(const cid of g.propStyles.rankings?.[style]||[]){
                const c=byId.get(String(cid));
                if(!c||Number(c.iterations)<50000||!Number.isFinite(Number(c.line))||!Number.isFinite(Number(c.simProbability)))throw new Error(`${id}/${style} invalid candidate ${cid}`);
                choices++;
              }
            }
          }
          if(!choices)throw new Error('No 50K Bet Style selections available');
          console.log(`✓ ${required.length} active/upcoming games · ${choices} Bet Style selections`);
          NODE
      - name: Persist verified frozen 50K boards
        if: steps.boards.outputs.ready != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add slates/nfl-sim.json slates/nfl-quarter.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified NFL 50K prop boards'
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then break; fi
              [ "$attempt" = 3 ] && exit 1
              sleep 2
            done
            git fetch origin main
            git restore --source=origin/main -- slates/nfl-sim-state.json || true
          fi
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/nfl-ppt-v948-cutover.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nfl-ppt-v948-cutover.log
          exit 1
      - name: Reproduce video, readability, filters and smooth-scroll suite
        run: npx playwright test tests/nfl-player-prop-tool-v947.spec.js --reporter=line --workers=1
      - name: Retire one-time helpers
        run: rm -f .github/workflows/one-time-nfl-player-prop-tool-v947.yml .github/workflows/one-time-nfl-prop-sim-v947.yml scripts/apply-nfl-player-prop-tool-v947.py scripts/apply-nfl-player-prop-tool-v948-proj-l10.py scripts/apply-nfl-player-prop-tool-v948-side-filter.py scripts/fix-nfl-player-prop-tool-v948-browser-qa.py
      - name: Commit and push verified v94.8 cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=origin/main -- slates/nfl-sim-state.json || true
          git add -A
          git diff --cached --quiet && { echo 'No v94.8 changes to commit'; exit 1; }
          git commit -m 'Polish NFL Player Prop Tool v94.8 readability'
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 2
          done
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/nfl-ppt-v948-cutover.log || true