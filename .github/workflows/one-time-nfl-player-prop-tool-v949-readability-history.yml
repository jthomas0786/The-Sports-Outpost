name: One-time NFL Player Prop Tool v94.9 Readability History Cutover

on:
  push:
    paths:
      - 'scripts/apply-nfl-player-prop-tool-v949-readability-history.py'
      - 'scripts/fix-nfl-player-prop-tool-v949-selftest.py'
      - '.github/workflows/one-time-nfl-player-prop-tool-v949-readability-history.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-nfl-player-prop-tool-v949-readability-history
  cancel-in-progress: true

jobs:
  cutover-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply v94.9 readability and Historical cutover
        run: |
          python3 scripts/apply-nfl-player-prop-tool-v949-readability-history.py
          python3 scripts/fix-nfl-player-prop-tool-v949-selftest.py
      - name: Run static regressions
        run: |
          node scripts/nfl-player-prop-tool-v947-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
      - name: Verify frozen 50K Bet Style boards without rebuilding
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nfl.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const sim=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const isFinal=id=>['post','final','completed'].includes(String(live?.games?.[id]?.status||'').toLowerCase());
          const required=(slate.games||[]).map(g=>String(g.gameId||g.id||'')).filter(id=>id&&!isFinal(id));
          const byGame=new Map((sim.games||[]).map(g=>[String(g?.game?.gameId||g.gameId||''),g]));
          let choices=0;
          for(const id of required){
            const g=byGame.get(id);
            if(Number(g?.iterations)<50000||!g?.propStyles?.ready||!g?.propStyles?.candidates?.length)throw new Error(`Missing frozen 50K propStyles for ${id}`);
            const byId=new Map(g.propStyles.candidates.map(c=>[String(c.id),c]));
            for(const style of ['tsoPick','safest','bestEdge','balanced','aggressive','correlated','longshot']){
              for(const cid of g.propStyles.rankings?.[style]||[]){
                const c=byId.get(String(cid));
                if(!c||Number(c.iterations)<50000||!Number.isFinite(Number(c.line))||!Number.isFinite(Number(c.simProbability)))throw new Error(`${id}/${style} invalid candidate ${cid}`);
                choices++;
              }
            }
          }
          if(!choices)throw new Error('No frozen 50K Bet Style selections available');
          console.log(`✓ ${required.length} active/upcoming games · ${choices} frozen 50K Bet Style selections verified`);
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/nfl-ppt-v949.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nfl-ppt-v949.log
          exit 1
      - name: Focused v94.9 readability Historical and Quick Guide smoke
        run: |
          set -o pipefail
          npx playwright test tests/nfl-player-prop-tool-v947.spec.js --grep "v94.9 larger text Historical actuals and column-by-column Quick Guide" --reporter=line --workers=1 --max-failures=1 2>&1 | tee /tmp/nfl-ppt-v949-focused.log
      - name: Full NFL Player Prop Tool Chromium regression
        run: |
          set -o pipefail
          npx playwright test tests/nfl-player-prop-tool-v947.spec.js --reporter=line --workers=1 --max-failures=1 2>&1 | tee /tmp/nfl-ppt-v949-full.log
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-player-prop-tool-v949-readability-history
          path: |
            /tmp/nfl-ppt-v949.log
            /tmp/nfl-ppt-v949-focused.log
            /tmp/nfl-ppt-v949-full.log
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 3
      - name: Retire one-time helper and workflow
        run: rm -f scripts/apply-nfl-player-prop-tool-v949-readability-history.py scripts/fix-nfl-player-prop-tool-v949-selftest.py .github/workflows/one-time-nfl-player-prop-tool-v949-readability-history.yml
      - name: Commit and push verified v94.9 production cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No v94.9 changes to commit'; exit 1; }
          git commit -m 'Improve NFL Prop Tool readability and Historical data'
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 2
          done
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/nfl-ppt-v949.log || true
