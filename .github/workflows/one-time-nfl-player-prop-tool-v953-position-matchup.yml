name: One-time NFL Player Prop Tool v95.3 Position Matchup

on:
  push:
    paths:
      - 'scripts/apply-nfl-player-prop-tool-v953-position-matchup.py'
      - 'scripts/fix-nfl-player-prop-tool-v953-browser-copy.py'
      - '.github/workflows/one-time-nfl-player-prop-tool-v953-position-matchup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-player-prop-tool-v953-position-matchup
  cancel-in-progress: true

jobs:
  cutover-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Apply v95.3 position-only MATCHUP cutover
        run: |
          python3 scripts/apply-nfl-player-prop-tool-v953-position-matchup.py
          python3 scripts/fix-nfl-player-prop-tool-v953-browser-copy.py
      - name: Run static regressions
        run: |
          node scripts/nfl-player-prop-tool-v947-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs
      - name: Verify frozen 50K Bet Style boards without rebuilding
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const slate=JSON.parse(fs.readFileSync('slates/nfl.json','utf8'));
          const live=JSON.parse(fs.readFileSync('slates/nfl-live.json','utf8'));
          const sim=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const isFinal=id=>['post','final','completed'].includes(String(live?.games?.[id]?.status||'').toLowerCase());
          const required=(slate.games||[]).map(g=>String(g.gameId||g.id||'')).filter(id=>id&&!isFinal(id));
          const byGame=new Map((sim.games||[]).map(g=>[String(g?.game?.gameId||g.gameId||''),g]));
          let styleRows=0;
          for(const id of required){
            const g=byGame.get(id);
            if(Number(g?.iterations)<50000||!g?.propStyles?.ready||!g?.propStyles?.candidates?.length)throw new Error(`Missing 50K propStyles for ${id}`);
            const byId=new Map(g.propStyles.candidates.map(c=>[String(c.id),c]));
            for(const style of ['tsoPick','safest','bestEdge','balanced','aggressive','correlated','longshot']){
              for(const cid of g.propStyles.rankings?.[style]||[]){
                const c=byId.get(String(cid));
                if(!c||Number(c.iterations)<50000||!Number.isFinite(Number(c.line))||!Number.isFinite(Number(c.simProbability)))throw new Error(`${id} ${style} invalid ${cid}`);
                styleRows++;
              }
            }
          }
          if(!styleRows)throw new Error('No sportsbook-backed Bet Style rows found');
          console.log(`✓ ${required.length} active/upcoming games · ${styleRows} frozen 50K Bet Style selections verified`);
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/nfl-ppt-v953.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nfl-ppt-v953.log
          exit 1
      - name: Focused position-only MATCHUP browser QA
        run: npx playwright test tests/nfl-player-prop-tool-v947.spec.js --grep "position-only vs opponent defense" --reporter=line --workers=1
      - name: Full NFL Player Prop Tool Chromium regression
        run: npx playwright test tests/nfl-player-prop-tool-v947.spec.js --reporter=line --workers=1
      - name: Retire one-time helper and workflow
        run: |
          rm scripts/apply-nfl-player-prop-tool-v953-position-matchup.py
          rm scripts/fix-nfl-player-prop-tool-v953-browser-copy.py
          rm .github/workflows/one-time-nfl-player-prop-tool-v953-position-matchup.yml
      - name: Commit and push verified v95.3 production cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports/nfl/player-prop-tool-v947.js sports/nfl-preview-v893.js sports/router.js scripts/nfl-player-prop-tool-v947-selftest.mjs tests/nfl-player-prop-tool-v947.spec.js scripts/apply-nfl-player-prop-tool-v953-position-matchup.py scripts/fix-nfl-player-prop-tool-v953-browser-copy.py .github/workflows/one-time-nfl-player-prop-tool-v953-position-matchup.yml
          git commit -m 'Make NFL Prop Tool Matchup position-only'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/nfl-ppt-v953.log || true
