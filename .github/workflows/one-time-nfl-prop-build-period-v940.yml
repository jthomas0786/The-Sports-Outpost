name: One-time NFL Player Prop Tool Bet Style + Period v94.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'sports/nfl/sim/quarter-board.js'
      - 'sports/nfl/sim/full-prop-board-v942.js'
      - 'scripts/nfl-sim-auto.mjs'
      - 'sports/nfl/player-prop-tool-build-period-v940.js'
      - 'sports/nfl/player-prop-tool-build-period-v940.css'
      - 'sports/nfl/player-prop-tool-reference-v941.js'
      - 'sports/nfl-preview-v893.js'
      - 'scripts/nfl-player-prop-tool-v940-selftest.mjs'
      - 'scripts/nfl-player-prop-tool-v941-selftest.mjs'
      - 'tests/nfl-player-prop-tool-build-period-v940.spec.js'
      - 'tests/nfl-player-prop-tool-reference-v941.spec.js'
      - '.github/workflows/one-time-nfl-prop-build-period-v940.yml'

permissions:
  contents: write

concurrency:
  group: one-time-nfl-prop-build-period-v940
  cancel-in-progress: true

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Cache-bust v94.2 Player Prop Tool wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          router=Path('sports/router.js')
          r=router.read_text()
          r2,n=re.subn(r"import\('\./nfl-preview-v893\.js\?v=[^']+'\)","import('./nfl-preview-v893.js?v=94.2')",r,count=1)
          if n!=1:
              raise SystemExit('NFL preview router import cache marker missing')
          router.write_text(r2)

          index=Path('index.html')
          i=index.read_text()
          pat=r'\./sports/router\.js\?v=(\d+)\.(\d+)'
          m=re.search(pat,i)
          if not m:
              raise SystemExit('outer router cache marker missing')
          major,minor=int(m.group(1)),int(m.group(2))
          i2,n=re.subn(pat,f'./sports/router.js?v={major}.{minor+1}',i,count=1)
          if n!=1:
              raise SystemExit('outer router cache bump failed')
          index.write_text(i2)
          print(f'router cache: {major}.{minor} -> {major}.{minor+1}')
          PY

      - name: Run static v94.2 regressions
        run: |
          node scripts/nfl-player-prop-tool-v941-selftest.mjs
          node scripts/nfl-player-prop-tool-v940-selftest.mjs
          node scripts/nfl-player-prop-tool-v923-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
          node scripts/nfl-quarter-selftest.mjs

      - name: Refresh authoritative 50K prop + period simulation cache
        env:
          NFL_SIM_FORCE: '1'
        run: node scripts/nfl-sim-auto.mjs --force

      - name: Verify published 50K sportsbook styles + period data
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const doc=JSON.parse(fs.readFileSync('slates/nfl-sim.json','utf8'));
          const styles=['tsoPick','safest','bestEdge','balanced','aggressive','correlated','longshot'];
          const periods=['1h','2h','q1','q2','q3','q4'];
          const games=(doc.games||[]).filter(g=>Number(g.iterations)>=50000);
          if(!games.length)throw new Error('No 50K pregame simulation results');
          const styleGames=games.filter(g=>g.propStyles?.ready&&g.propStyles?.candidates?.length);
          if(!styleGames.length)throw new Error('No 50K sportsbook-aware propStyles board published');
          for(const style of styles){
            if(!styleGames.some(g=>(g.propStyles?.rankings?.[style]||[]).length))throw new Error(`No sportsbook-backed 50K candidates for Bet Style ${style}`);
          }
          for(const g of styleGames){
            const byId=new Map((g.propStyles.candidates||[]).map(c=>[String(c.id),c]));
            for(const [style,ids] of Object.entries(g.propStyles.rankings||{})){
              for(const id of ids){
                const c=byId.get(String(id));if(!c)throw new Error(`Missing ${style} candidate ${id}`);
                if(Number(c.iterations)<50000)throw new Error(`Candidate ${id} is not 50K-backed`);
                if(!Number.isFinite(Number(c.price))||!c.book)throw new Error(`Candidate ${id} missing sportsbook odds`);
                if(!Number.isFinite(Number(c.line))||!['over','under'].includes(c.side))throw new Error(`Candidate ${id} missing selected prop`);
                if(!Number.isFinite(Number(c.simProbability))||!Number.isFinite(Number(c.edge)))throw new Error(`Candidate ${id} missing exact simulation probability/edge`);
              }
            }
          }
          const periodGames=games.filter(g=>g.propPeriods);
          if(!periodGames.length)throw new Error('No 50K pregame result published propPeriods');
          for(const key of periods){if(!periodGames.some(g=>g.propPeriods?.[key]?.candidates?.length))throw new Error(`No 50K candidates for ${key}`);}
          for(const g of periodGames){
            for(const key of periods){
              const p=g.propPeriods?.[key];if(!p)continue;
              for(const c of p.candidates||[]){
                if('worldMaskB64' in c)throw new Error('Private same-world mask leaked into nfl-sim.json');
                if(Number(c.worldMaskIterations)!==Number(g.iterations))throw new Error(`Run count mismatch ${key}`);
              }
            }
          }
          console.log(`✓ ${styleGames.length} game(s) expose real-odds Bet Styles and ${periodGames.length} game(s) expose exact period candidates from 50K worlds`);
          NODE

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/nfl-prop-v942-server.log 2>&1 &
          echo $! >/tmp/nfl-prop-v942-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nfl-prop-v942-server.log
          exit 1

      - name: Exercise v94.2 Bet Style + reference columns + period UI in Chromium
        run: |
          npx playwright test tests/nfl-player-prop-tool-reference-v941.spec.js tests/nfl-player-prop-tool-build-period-v940.spec.js tests/nfl-player-prop-tool-sim-v939.spec.js tests/nfl-player-prop-tool-polish-v938.spec.js --reporter=line --workers=1

      - name: Commit final v94.2 wiring + regenerated 50K data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports/router.js index.html slates/nfl-sim.json slates/nfl-sim-state.json slates/nfl-quarter.json
          if git diff --cached --quiet; then
            echo 'No finalizer changes to commit.'
          else
            git commit -m 'Finalize NFL Player Prop Tool Bet Style v94.2'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/nfl-prop-v942-server.log || true
