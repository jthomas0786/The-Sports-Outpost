name: One-time NFL Prop Tool v93.9 cache + regression wiring

on:
  push:
    paths:
      - '.github/workflows/one-time-nfl-prop-sim-v939.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache-bust v93.9 production wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          router=Path('sports/router.js')
          r=router.read_text()
          r2,n=re.subn(r"import\('\./nfl-preview-v893\.js\?v=[^']+'\)","import('./nfl-preview-v893.js?v=93.9')",r,count=1)
          if n!=1:
              raise SystemExit('NFL preview router import cache marker missing')
          router.write_text(r2)

          index=Path('index.html')
          i=index.read_text()
          m=re.search(r'(\./sports/router\.js\?v=)(\d+)\.(\d+)',i)
          if not m:
              raise SystemExit('index router cache marker missing')
          replacement=f"{m.group(1)}{m.group(2)}.{int(m.group(3))+1}"
          index.write_text(i[:m.start()]+replacement+i[m.end():])
          PY
      - name: Run Player Prop Tool permanent regressions
        run: |
          node scripts/nfl-player-prop-tool-v923-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
      - name: Commit final v93.9 cache wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports/router.js index.html
          if git diff --cached --quiet; then
            echo "No v93.9 cache changes needed"
            exit 0
          fi
          git commit -m "Apply NFL Prop Tool 50K sim authority v93.9"
          git push origin HEAD:main