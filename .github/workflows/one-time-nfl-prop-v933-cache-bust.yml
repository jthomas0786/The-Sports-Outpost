name: One-time NFL Prop Tool v93.6 theme cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-nfl-prop-v933-cache-bust.yml'

permissions:
  contents: write

jobs:
  cache-bust-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache-bust Prop Tool Outpost theme
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          router_path = Path('sports/router.js')
          router = router_path.read_text()
          router, count = re.subn(
              r"(import\('\./nfl-preview-v893\.js\?v=)[^']+('\))",
              r"\g<1>93.6\g<2>",
              router,
              count=1,
          )
          if count != 1:
              raise SystemExit('NFL preview router import marker not found')
          router_path.write_text(router)

          index_path = Path('index.html')
          text = index_path.read_text()
          pattern = r'(<script type="module" src="\./sports/router\.js\?)([^"]+)("></script>)'
          match = re.search(pattern, text)
          if not match:
              raise SystemExit('index router module marker not found')

          query = match.group(2)
          parts = [part for part in query.split('&') if part and not part.startswith('nflprop=')]
          parts.append('nflprop=936')
          replacement = match.group(1) + '&'.join(parts) + match.group(3)
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('index router cache-bust replacement failed')
          index_path.write_text(text)
          PY

      - name: Run Player Prop Tool regressions
        run: |
          node scripts/nfl-player-prop-tool-v923-selftest.mjs
          node scripts/mobile-swipe-anywhere-selftest.mjs
          grep -q "import('./nfl-preview-v893.js?v=93.6')" sports/router.js
          grep -q "player-prop-tool-theme-v936.js?v=93.6" sports/nfl-preview-v893.js
          grep -q -- '--ppt-bg:#050a14' sports/nfl/player-prop-tool-theme-v936.css
          grep -q -- '--ppt-blue:#2d7fff' sports/nfl/player-prop-tool-theme-v936.css
          grep -q 'sports/router.js?.*nflprop=936' index.html

      - name: Commit cache bust to main
        run: |
          if git diff --quiet -- sports/router.js index.html; then
            echo 'NFL Prop Tool v93.6 cache keys already present.'
            exit 0
          fi
          git config user.name 'TSO NFL Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/router.js index.html
          git commit -m 'Cache-bust NFL Player Prop Tool theme v93.6'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
