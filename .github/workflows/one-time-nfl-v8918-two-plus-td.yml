name: One-time NFL v89.18 two-plus TD
on:
  push:
    paths:
      - '.github/workflows/one-time-nfl-v8918-two-plus-td.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebase onto latest main
        run: |
          git fetch origin main
          git rebase origin/main || true
      - name: Apply 2+ TD UI wiring
        run: python scripts/apply-nfl-v8918-two-plus-td.py
      - name: Validate syntax
        run: |
          node --check sports/nfl/prop-model-edge-v8918.js
          node --check sports/nfl-preview-v893.js
          node --check sports/router.js
      - name: Run 2+ TD regression
        run: node scripts/nfl-v8918-two-plus-td-selftest.mjs
      - name: Existing NFL prop regression
        run: node scripts/nfl-v8917-prop-ui-selftest.mjs
      - name: Commit production wiring
        run: |
          git config user.name 'TSO NFL 2+ TD Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/nfl-preview-v893.js sports/router.js sports/registry.js index.html
          git commit -m 'nfl: surface exact 2+ TD simulation probability' || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
