name: One-time NFL v89.20 simulation loader fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-nfl-v8920-sim-loader-fix.py'
      - 'scripts/nfl-v8920-sim-loader-selftest.mjs'
      - 'scripts/nfl-v8918-two-plus-td-selftest.mjs'
      - 'scripts/apply-nfl-all-players-controls-v8921.py'
      - 'scripts/nfl-all-players-controls-v8921-selftest.mjs'
      - 'sports/nfl/all-players-controls-v8921.js'
      - 'scripts/apply-nfl-readability-v8922.py'
      - 'scripts/nfl-readability-v8922-selftest.mjs'
      - 'sports/nfl/readability-v8922.js'
      - 'sports/nfl-preview-v893.js'
      - '.github/workflows/one-time-nfl-v8920-sim-loader-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebase onto latest main
        run: |
          git fetch origin main
          git rebase origin/main || true
      - name: Apply readability cache bust
        run: python scripts/apply-nfl-readability-v8922.py
      - name: Check NFL readability and wrapper syntax
        run: |
          node --check sports/nfl/readability-v8922.js
          node --check sports/nfl/all-players-controls-v8921.js
          node --check sports/nfl-preview-v893.js
          node --check sports/router.js
      - name: Run readability regression
        run: node scripts/nfl-readability-v8922-selftest.mjs
      - name: Run All Players regression
        run: node scripts/nfl-all-players-controls-v8921-selftest.mjs
      - name: Run simulation loader regression
        run: node scripts/nfl-v8920-sim-loader-selftest.mjs
      - name: Run 2+ TD engine regression
        run: node scripts/nfl-v8918-two-plus-td-selftest.mjs
      - name: Run native 2+ TD UI regression
        run: node scripts/nfl-v8919-native-two-plus-selftest.mjs
      - name: Commit production cache bust
        run: |
          git config user.name 'TSO NFL Readability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/router.js index.html
          git commit -m 'nfl: deploy readability pass' || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
