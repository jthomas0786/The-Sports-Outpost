name: One-time NFL v900 stale live expiry
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-nfl-v900-stale-live-expiry.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stale-live expiry
        run: python3 scripts/apply-nfl-v900-stale-live-expiry.py
      - name: Validate NFL Live freshness
        run: |
          node --check sports/nfl-preview.js
          node --check sports/nfl-preview-v890.js
          node --check sports/nfl-preview-v893.js
          node --check sports/nfl/live-game-switcher-v894.js
          node --check sports/router.js
          node scripts/nfl-v900-stale-live-selftest.mjs
          node scripts/live-game-switcher-selftest.mjs
          grep -F "./nfl-preview-v893.js?v=89.37" sports/router.js
          grep -F "./nfl-preview-v890.js?v=89.37" sports/nfl-preview-v893.js
          grep -F "./nfl-preview.js?v=89.37" sports/nfl-preview-v890.js
          grep -F "./nfl/live-game-switcher-v894.js?v=89.37" sports/nfl-preview-v893.js
          grep -F "./sports/router.js?v=90.48" index.html
          grep -F "./nhl/view-v906.js?v=90.18" sports/router.js
          grep -F "./mlb/playstage-concept-v921-mobile.js?v=92.10" sports/router.js
      - name: Commit production fix
        run: |
          git config user.name 'TSO NFL v900 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sports/nfl-preview.js sports/nfl-preview-v890.js sports/nfl-preview-v893.js sports/nfl/live-game-switcher-v894.js sports/router.js index.html scripts/live-game-switcher-selftest.mjs
          git commit -m 'nfl: expire stale games from Live'
          git reset --hard HEAD
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
