name: One-time NFL win probability repair v89.34

on:
  push:
    paths:
      - '.github/workflows/one-time-nfl-winprob-v8934.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair live win probability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if new in s:
                  print(label, 'already applied'); return
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              p.write_text(s.replace(old,new,1))
              print('applied', label)

          replace_once(
              'sports/nfl/playstage-v886e.js',
              "import { ensureNflPlaystageV886EStyles } from './gamecast-v886e-styles.js';",
              "import { ensureNflPlaystageV886EStyles } from './gamecast-v886e-styles.js';\nimport { liveWinProb } from './winprob.js?v=89.34';",
              'PlayStage win-prob model import')

          replace_once(
              'sports/nfl/playstage-v886e.js',
              "function winProb(g){const a=clamp(g?.winProbAway??g?.liveScore?.winProbAway??68,0,100);return{away:Math.round(a),home:Math.round(100-a)}}",
              "function probPct(v){const n=Number(v);return Number.isFinite(n)?clamp(n<=1?n*100:n,0,100):null}\nfunction winProb(g){\n  const explicit=probPct(g?.winProbAway??g?.liveScore?.winProbAway??g?.winProbability?.away??g?.liveScore?.winProbability?.away??g?.winProb?.away);\n  if(explicit!=null)return{away:Math.round(explicit),home:Math.round(100-explicit)};\n  try{const modeled=liveWinProb(g),a=probPct(modeled?.awayPct);if(a!=null)return{away:Math.round(a),home:Math.round(100-a)}}catch{}\n  return{away:50,home:50};\n}",
              'remove hard-coded 68 percent fallback')

          replace_once(
              'sports/nfl/playstage-v886e.js',
              "chart:Array.isArray(p.chart)&&p.chart.length?p.chart:[44,46,45,48,47,53,49,52,55,58,57,61,63,66,68]",
              "chart:Array.isArray(p.chart)&&p.chart.length?p.chart:[]",
              'remove fake 68 percent chart history')

          replace_once(
              'sports/nfl/playstage-v886e.js',
              "<path d=\"${chartPath(P.chart)}\" fill=\"none\" stroke=\"#22afff\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"96\" cy=\"${80-clamp((P.chart||[]).slice(-1)[0]||50,0,100)*.62}\" r=\"3.5\" fill=\"#61c9ff\"/>",
              "<path d=\"${chartPath(P.chart?.length?P.chart:[W.away,W.away])}\" fill=\"none\" stroke=\"#22afff\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"96\" cy=\"${80-clamp(P.chart?.length?P.chart.slice(-1)[0]:W.away,0,100)*.62}\" r=\"3.5\" fill=\"#61c9ff\"/>",
              'truthful current-probability chart fallback')

          replace_once(
              'sports/nfl/playstage-v886e.js',
              "export const __V886E_TEST__={scenePoint,lineAt,fieldYardToAbs,ballState,yardLabel,FIELD,SCENE};",
              "export const __V886E_TEST__={scenePoint,lineAt,fieldYardToAbs,ballState,yardLabel,winProb,FIELD,SCENE};",
              'export win probability test hook')

          replace_once(
              'sports/nfl/winprob.js',
              "export function liveWinProb(game) {\n  const away = game.away || {}, home = game.home || {};\n  const awayScore = Number(away.score) || 0;\n  const homeScore = Number(home.score) || 0;\n  const status = game.status || '';\n  const ls = game.liveScore || {};",
              "export function liveWinProb(game) {\n  const away = game.away || {}, home = game.home || {};\n  const ls = game.liveScore || {};\n  const awayScore = Number(ls.awayScore ?? away.score) || 0;\n  const homeScore = Number(ls.homeScore ?? home.score) || 0;\n  const status = String(ls.status || game.status || '').toLowerCase();\n  const detail = String(ls.statusDetail || game.statusDetail || '');",
              'prefer authoritative live score and status')

          replace_once(
              'sports/nfl/winprob.js',
              "  if (status === 'post' || /Final|Game Over/i.test(game.statusDetail || '')) {",
              "  if (status === 'post' || /Final|Game Over/i.test(detail)) {",
              'final status uses live detail')

          replace_once(
              'sports/nfl/winprob.js',
              "  if (status === 'pre' || !ls.period || ls.period < 1) {",
              "  if (!ls.period || ls.period < 1) {",
              'live period overrides stale pregame shell status')

          replace_once(
              'sports/nfl/winprob.js',
              "  const possessionEdge = ls.possession === 'away' ? +ep\n    : ls.possession === 'home' ? -ep : 0;",
              "  const possRaw=String(ls.possession ?? game.possession ?? '').toUpperCase();\n  const awayAbbr=String(away.abbr||away.code||'').toUpperCase(),homeAbbr=String(home.abbr||home.code||'').toUpperCase();\n  const possSide=possRaw==='AWAY'||possRaw===awayAbbr?'away':possRaw==='HOME'||possRaw===homeAbbr?'home':String(ls.possession||'').toLowerCase();\n  const possessionEdge = possSide === 'away' ? +ep\n    : possSide === 'home' ? -ep : 0;",
              'normalize possession side')

          replace_once('sports/nfl-preview.js',"./nfl/playstage-v886e.js?v=88.6e","./nfl/playstage-v886e.js?v=89.34",'PlayStage cache')
          replace_once('sports/nfl-preview-v890.js',"./nfl-preview.js?v=89.33","./nfl-preview.js?v=89.34",'base NFL cache')
          replace_once('sports/nfl-preview-v893.js',"./nfl-preview-v890.js?v=89.33","./nfl-preview-v890.js?v=89.34",'NFL wrapper cache')
          replace_once('sports/router.js',"./nfl-preview-v893.js?v=89.33","./nfl-preview-v893.js?v=89.34",'NFL router cache')
          replace_once('index.html','./sports/router.js?v=90.30','./sports/router.js?v=90.31','index router cache')

          p=Path('scripts/live-game-switcher-selftest.mjs')
          p.write_text(p.read_text().replace("./nfl-preview-v893.js?v=89.33","./nfl-preview-v893.js?v=89.34"))
          PY

      - name: Validate win probability repair
        run: |
          node --check sports/nfl/playstage-v886e.js
          node --check sports/nfl/winprob.js
          node --check sports/nfl-preview.js
          node --check sports/nfl-preview-v890.js
          node --check sports/nfl-preview-v893.js
          node --check sports/router.js
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {__V886E_TEST__ as T} from './sports/nfl/playstage-v886e.js';
          import {liveWinProb} from './sports/nfl/winprob.js';
          const game={status:'in',away:{abbr:'MIA',name:'Dolphins',score:13},home:{abbr:'LV',name:'Raiders',score:27},liveScore:{status:'in',period:4,clockMin:5+58/60,awayScore:13,homeScore:27,possession:'home',yardFromOwn:22}};
          const model=liveWinProb(game),shown=T.winProb(game);
          assert.ok(model.homePct>.90,`Raiders should be a heavy favorite, got ${model.homePct}`);
          assert.ok(shown.home>90&&shown.away<10,`PlayStage reversed/stale: ${JSON.stringify(shown)}`);
          assert.deepEqual(T.winProb({...game,liveScore:{...game.liveScore,winProbAway:7}}),{away:7,home:93});
          console.log(`MIA 13 @ LV 27, Q4 5:58 => MIA ${shown.away}% / LV ${shown.home}%`);
          NODE
          grep -F "playstage-v886e.js?v=89.34" sports/nfl-preview.js
          grep -F "./nfl-preview.js?v=89.34" sports/nfl-preview-v890.js
          grep -F "./nfl-preview-v890.js?v=89.34" sports/nfl-preview-v893.js
          grep -F "./nfl-preview-v893.js?v=89.34" sports/router.js
          grep -F './sports/router.js?v=90.31' index.html
          node scripts/live-game-switcher-selftest.mjs

      - name: Commit production repair
        run: |
          git config user.name "TSO NFL Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports/nfl/playstage-v886e.js sports/nfl/winprob.js sports/nfl-preview.js sports/nfl-preview-v890.js sports/nfl-preview-v893.js sports/router.js index.html scripts/live-game-switcher-selftest.mjs
          git diff --staged --quiet && echo "Already applied." && exit 0
          git commit -m "Fix reversed NFL live win probability"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 2))
          done
          exit 1
