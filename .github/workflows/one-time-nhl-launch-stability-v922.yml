name: One-time NHL Launch Stability v90.22
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-nhl-launch-stability-v922.yml'
      - 'scripts/apply-nhl-launch-v922-stability.py'
permissions:
  contents: write
concurrency:
  group: one-time-nhl-launch-stability-v922
  cancel-in-progress: false
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stable Props controls fix
        run: python3 scripts/apply-nhl-launch-v922-stability.py
      - name: Verify launch controller
        run: |
          node --check sports/nhl/launch-v922.js
          node scripts/nhl-launch-v922-selftest.mjs
      - name: Commit production fix
        run: |
          git config user.name "TSO NHL Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports/nhl/launch-v922.js scripts/nhl-launch-v922-selftest.mjs
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "nhl: stabilize launch Props controls"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
