name: One-time ParlayPing Esports Odds QA

on:
  push:
    paths:
      - '.github/workflows/one-time-parlayping-esports-odds-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Clone staged Esports odds refresh
        run: git clone --depth 1 --branch esports-odds-fix-stage https://github.com/jthomas0786/The-Sports-Outpost.git outpost
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify zero-credit sportsbook coverage gate
        working-directory: outpost
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: |
          node scripts/parlayping-extended-odds-refresh.mjs ESPORTS
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('slates/esports-odds.json','utf8'));
          if(d?.meta?.sport!=='ESPORTS')throw new Error('bad esports snapshot');
          const allowed=new Set(['draftkings','fanduel','caesars','betmgm','fanatics','pinnacle','bet365','betrivers','hardrock','parx','bovada']);
          const byKey=new Map((d.meta?.bySportKey||[]).map(x=>[x.sportKey,x]));
          for(const sportKey of ['esports_cs2','esports_valorant','esports_lol']){
            const item=byKey.get(sportKey);if(!item)throw new Error(`missing ${sportKey}`);
            const allowedVisible=(item.coverage||[]).filter(x=>allowed.has(String(x.bookmaker||''))&&Number(x.apiVisibleRows||0)>0);
            if(!allowedVisible.length&&item.paidPropsCall!==false)throw new Error(`${sportKey} spent paid props call without sportsbook coverage`);
            if(allowedVisible.length&&item.paidPropsCall!==true)throw new Error(`${sportKey} skipped paid props call despite sportsbook coverage`);
            if(!allowedVisible.length&&item.skipReason!=='no-sportsbook-coverage')throw new Error(`${sportKey} missing no-sportsbook-coverage reason`);
          }
          for(const row of d.rows||[]){
            if(!allowed.has(String(row.bookKey||'')))throw new Error(`non-sportsbook row accepted: ${row.bookKey}`);
            if(!row.player||!row.market||!row.sportKey)throw new Error('invalid accepted esports row');
          }
          console.log('ESPORTS coverage gate QA passed. Accepted sportsbook rows:',d.rows?.length||0);
          console.log(JSON.stringify(d.meta?.bySportKey||[],null,2));
          NODE
