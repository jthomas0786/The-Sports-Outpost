name: One-time ParlayPing Esports Odds QA

on:
  push:
    paths:
      - '.github/workflows/one-time-parlayping-esports-odds-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe zero-credit Esports coverage
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.PARLAY_API_KEY;if(!key)throw new Error('PARLAY_API_KEY missing');
          for(const sport of ['esports_cs2','esports_valorant','esports_lol']){
            const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);
            try{
              const r=await fetch(`https://parlay-api.com/v1/sports/${sport}/props/coverage`,{headers:{'X-API-Key':key,accept:'application/json'},signal:controller.signal});
              const text=await r.text();console.log(`\n=== ${sport} coverage HTTP ${r.status} ===`);console.log(text.slice(0,12000));
            }finally{clearTimeout(timer);}
          }
          NODE
