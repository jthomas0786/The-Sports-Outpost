name: One-time ParlayPing Golf Coverage Probe

on:
  workflow_dispatch:
  push:
    branches:
      - parlayping-golf-stage
    paths:
      - '.github/workflows/one-time-parlayping-golf-coverage-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe free Pinnacle outright coverage for every current Golf key
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: |
          node - <<'NODE'
          const API='https://parlay-api.com/v1';
          const key=process.env.PARLAY_API_KEY;
          if(!key) throw new Error('PARLAY_API_KEY missing');
          const arr=p=>Array.isArray(p)?p:Array.isArray(p?.data)?p.data:Array.isArray(p?.sports)?p.sports:[];
          const tournament=k=>/^golf_/.test(k)&&!/^disc_golf/.test(k)&&!/(?:^|_)(?:1st|2nd|3rd|4th)_round(?:_|$)/.test(k)&&!/(?:^|_)round_[1-4](?:_|$)/.test(k);
          async function get(url,auth=true){
            const res=await fetch(url,{headers:{accept:'application/json',...(auth?{'X-API-Key':key}:{})}});
            const text=await res.text();
            if(!res.ok) throw new Error(`${res.status} ${text.slice(0,300)}`);
            return text?JSON.parse(text):null;
          }
          const catalog=arr(await get(`${API}/sports`,false));
          const keys=catalog.map(x=>String(x?.key||'')).filter(tournament);
          console.log('GOLF_KEYS',JSON.stringify(keys));
          for(const sportKey of keys){
            const params=new URLSearchParams({regions:'us',markets:'outrights',bookmakers:'pinnacle'});
            try{
              const payload=await get(`${API}/sports/${encodeURIComponent(sportKey)}/odds/coverage?${params}`);
              const root=payload&&typeof payload==='object'&&!Array.isArray(payload)?payload:{};
              const data=root.data&&typeof root.data==='object'&&!Array.isArray(root.data)?root.data:null;
              const source=data||root;
              const summary={
                sportKey,
                rootKeys:Object.keys(root).slice(0,30),
                dataKeys:data?Object.keys(data).slice(0,30):[],
                total_games_pregame:source.total_games_pregame??source.totalGamesPregame??null,
                total_games_in_play:source.total_games_in_play??source.totalGamesInPlay??null,
                total_games:source.total_games??source.totalGames??null,
                bookmakers:source.bookmakers??source.available_bookmakers??null,
                markets:source.markets??source.available_markets??null
              };
              console.log('COVERAGE',JSON.stringify(summary));
            }catch(error){console.log('COVERAGE_ERROR',JSON.stringify({sportKey,error:error.message}));}
          }
          NODE
