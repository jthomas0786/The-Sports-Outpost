name: ParlayPing HR Odds Preview

on:
  push:
    branches:
      - parlayping-hr-odds-preview
    paths:
      - '.github/workflows/one-time-parlayping-hr-odds-preview.yml'

permissions:
  contents: read

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
    steps:
      - name: Fetch current real MLB home run prices
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const key=process.env.PARLAY_API_KEY;
          if(!key)throw new Error('PARLAY_API_KEY is not configured');
          const base='https://parlay-api.com/v1';
          const books='draftkings,fanduel,caesars,betmgm,fanatics,pinnacle,bet365,betrivers,hardrock,parx,bovada';
          const marketAliases=['batter_home_runs','player_home_runs','home_runs','player_home_run'];
          const wanted=new Set(['kazuma okamoto','cj abrams']);
          const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
          const num=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null};
          const bookLabel=row=>String(row.bookmaker_title||row.source_title||row.bookmaker||row.source||'').trim();
          const americanPrice=row=>{
            for(const key of ['over_price','yes_price','price','odds']){const n=num(row?.[key]);if(n!==null&&n!==0)return Math.round(n)}
            return null;
          };
          const lineValue=row=>{for(const k of ['line','point','threshold']){const n=num(row?.[k]);if(n!==null)return n}return null};
          const isOver=row=>{
            const value=norm(row?.side||row?.outcome||row?.selection||row?.name||'');
            return !value||value==='over'||value==='yes';
          };
          const out={fetchedAt:new Date().toISOString(),source:'ParlayAPI',players:{}};
          for(const market of marketAliases){
            const q=new URLSearchParams({markets:market,bookmakers:books,limit:'500',maxAgeSec:'1800'});
            const r=await fetch(`${base}/sports/baseball_mlb/props?${q}`,{headers:{accept:'application/json','X-API-Key':key}});
            const text=await r.text();
            if(!r.ok){console.log(`market ${market} HTTP ${r.status}`);continue;}
            let body=null;try{body=text?JSON.parse(text):null}catch{continue}
            const rows=Array.isArray(body)?body:Array.isArray(body?.data)?body.data:[];
            console.log(`market ${market}: ${rows.length} rows`);
            for(const row of rows){
              const player=norm(row?.player_name||row?.player||row?.description);
              if(!wanted.has(player)||!isOver(row))continue;
              const line=lineValue(row);if(line!==null&&Math.abs(line-.5)>.001)continue;
              const price=americanPrice(row);if(price===null)continue;
              const label=player==='kazuma okamoto'?'Kazuma Okamoto':'CJ Abrams';
              const book=bookLabel(row)||'Unknown';
              out.players[label]||={matchup:[row?.away_team,row?.home_team].filter(Boolean).join(' @ '),commenceTime:row?.commence_time||null,market:row?.market_key||row?.market||market,books:{}};
              out.players[label].books[book]={price,line:line??.5,bookmaker:row?.bookmaker||row?.source||null};
            }
            if(Object.keys(out.players).length===wanted.size)break;
          }
          fs.writeFileSync('hr-odds-preview.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(!out.players['Kazuma Okamoto']&&!out.players['CJ Abrams'])throw new Error('Neither preview player has a current HR market in ParlayAPI');
          NODE
      - name: Upload preview odds
        uses: actions/upload-artifact@v4
        with:
          name: parlayping-hr-odds-preview
          path: hr-odds-preview.json
          retention-days: 1
