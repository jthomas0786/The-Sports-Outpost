name: One-time ParlayPing MMA Adapter QA

on:
  push:
    paths:
      - '.github/workflows/one-time-parlayping-mma-adapter-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Clone staged ParlayPing MMA adapter
        run: git clone --depth 1 --branch mma-esports-live-stage https://github.com/jthomas0786/ParlayPing.git parlayping
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify MMA through router and public reply
        working-directory: parlayping
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {analyzeMultiSport}=require('./api/lib/sport-router');
          const {applyCorrelationSafety,buildPublicReply}=require('./api/lib/analysis-safety');
          const base='https://raw.githubusercontent.com/jthomas0786/The-Sports-Outpost/main/slates';
          (async()=>{
            const r=await fetch(`${base}/mma-live.json`,{headers:{accept:'application/json'}});
            assert.equal(r.ok,true,'mma-live.json must be published on TSO main');
            const live=await r.json();
            const fight=Object.values(live.fights||{}).find(f=>f.final&&(f.fighters||[]).filter(x=>x.winner===true).length===1);
            assert.ok(fight,'expected a final UFC fight with one official winner');
            const winner=fight.fighters.find(x=>x.winner===true);
            const loser=fight.fighters.find(x=>x.winner===false);
            assert.ok(winner&&loser,'expected winner and loser');
            const now=Date.parse(fight.startTime||'')+8*3600_000;
            const analysis=await analyzeMultiSport([
              {sport:'MMA',player:winner.name,market:'fightWinner',side:'yes',line:null,inclusive:true},
              {sport:'MMA',player:loser.name,market:'fightWinner',side:'yes',line:null,inclusive:true}
            ],{referenceTime:fight.startTime,now,baseUrl:'https://parlayping.net'});
            assert.equal(analysis.counts.hit,1);
            assert.equal(analysis.counts.miss,1);
            assert.equal(analysis.counts.unresolved,0);
            const byPlayer=new Map(analysis.results.map(x=>[x.player,x]));
            assert.equal(byPlayer.get(winner.name)?.status,'HIT');
            assert.equal(byPlayer.get(loser.name)?.status,'MISS');
            const safe=applyCorrelationSafety(analysis);
            const reply=buildPublicReply(safe,{maxLegs:3});
            assert.ok(reply?.startsWith('🔔 ParlayPing Live'));
            assert.ok(!reply.includes('Reply STOP to opt out'));
            assert.ok(!reply.includes('null/1'));
            console.log('MMA real QA:',fight.event,'winner=',winner.name,'loser=',loser.name);
            console.log(reply);
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE
