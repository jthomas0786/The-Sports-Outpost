name: One-time ParlayPing MMA Live QA

on:
  push:
    paths:
      - '.github/workflows/one-time-parlayping-mma-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Clone staged Sports Outpost MMA collector
        run: git clone --depth 1 --branch mma-esports-live-stage https://github.com/jthomas0786/The-Sports-Outpost.git outpost
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run and validate real MMA collector
        working-directory: outpost
        run: |
          node scripts/parlayping-mma-live-refresh.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('slates/mma-live.json','utf8'));
          if(d.schemaVersion!==1||d.source!=='espn-public'||d.sport!=='MMA')throw new Error('bad MMA snapshot schema');
          const fights=Object.values(d.fights||{});
          if(!fights.length)throw new Error('expected MMA fights from ESPN');
          const finals=fights.filter(f=>f.final);
          if(!finals.length)throw new Error('expected at least one final MMA fight');
          for(const f of finals){if(!f.fighters?.some(x=>x.winner===true))throw new Error(`final fight missing winner ${f.id}`);}
          const sample=finals.find(f=>f.fighters?.some(x=>x.winner===true));
          console.log('MMA QA:',d.meta,'sample final:',sample.event,sample.fighters.map(x=>`${x.name}:${x.winner}`).join(' vs '));
          NODE
