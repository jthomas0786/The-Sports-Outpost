name: One-time ParlayPing remaining sports discovery

on:
  push:
    paths:
      - '.github/workflows/one-time-parlayping-remaining-sports-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover active sports and prop markets
        shell: bash
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PARLAY_API_KEY:-}" ]; then
            echo '::error::PARLAY_API_KEY is missing.'
            exit 2
          fi
          node - <<'NODE'
          const key=process.env.PARLAY_API_KEY;
          const base='https://parlay-api.com/v1';
          const targets=[
            'soccer_epl','soccer_spain_la_liga','soccer_germany_bundesliga','soccer_italy_serie_a','soccer_france_ligue_one','soccer_usa_mls','soccer_uefa_champs_league','soccer_uefa_europa_league',
            'tennis','tennis_atp','tennis_wta',
            'mma_mixed_martial_arts','mma_ufc','boxing_boxing','boxing_boxing_matches',
            'golf_pga_championship','golf_other','other_golf',
            'esports','esports_lol','esports_cs2','esports_valorant','esports_dota_2',
            'cricket_ipl','cricket_test_match','cricket_one_day_international','cricket_twenty20_international',
            'rugbyleague_nrl','volleyball','table_tennis'
          ];
          async function get(path){
            const r=await fetch(`${base}${path}`,{headers:{accept:'application/json','X-API-Key':key}});
            const text=await r.text();
            let body=null;try{body=text?JSON.parse(text):null}catch{body=text}
            return {status:r.status,body};
          }
          const sports=await get('/sports');
          if(sports.status!==200)throw new Error(`/sports failed ${sports.status}`);
          const rows=Array.isArray(sports.body)?sports.body:Array.isArray(sports.body?.data)?sports.body.data:[];
          const active=new Map(rows.map(r=>[r.key||r.sport_key,r]));
          console.log('SELECTED_ACTIVE_SPORTS');
          for(const target of targets){
            const r=active.get(target);
            if(r)console.log(JSON.stringify({key:target,title:r.title||r.sport_title||null,active:r.active??true,hasOutrights:r.has_outrights??r.hasOutrights??null}));
          }
          console.log('MARKET_DISCOVERY');
          for(const target of targets){
            if(!active.has(target))continue;
            const res=await get(`/sports/${encodeURIComponent(target)}/props/markets`);
            const payload=res.body;
            const list=Array.isArray(payload)?payload:Array.isArray(payload?.data)?payload.data:Array.isArray(payload?.markets)?payload.markets:[];
            const markets=list.map(x=>typeof x==='string'?x:(x.key||x.market_key||x.market)).filter(Boolean);
            console.log(JSON.stringify({key:target,status:res.status,marketCount:markets.length,markets:markets.slice(0,120)}));
          }
          NODE
