name: One-time ParlayPing Soccer/Tennis Source Probe

on:
  push:
    paths:
      - '.github/workflows/one-time-parlayping-soccer-tennis-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe ESPN soccer and tennis player-stat structures
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const UA='okhttp/4.12.0';
          const get=async url=>{
            const r=await fetch(url,{headers:{'user-agent':UA,accept:'application/json','cache-control':'no-cache'}});
            if(!r.ok)throw new Error(`${r.status} ${r.statusText} ${url}`);
            return r.json();
          };
          const safe=(value,max=14000)=>{const s=JSON.stringify(value,null,2);return typeof s==='string'?s.slice(0,max):String(value);};
          const compactAthlete=a=>({
            id:a?.id||a?.athlete?.id||null,
            name:a?.displayName||a?.fullName||a?.athlete?.displayName||a?.athlete?.fullName||null,
            starter:a?.starter??null,
            position:a?.position?.abbreviation||a?.athlete?.position?.abbreviation||null,
            stats:a?.stats||a?.statistics||null,
            keys:Object.keys(a||{})
          });
          async function soccer(label,base){
            console.log(`\n===== ${label} =====`);
            const board=await get(`${base}/scoreboard?limit=500`);
            const event=board?.events?.find(e=>e?.competitions?.length)||board?.events?.[0];
            if(!event){console.log('no current event');return;}
            const summary=await get(`${base}/summary?event=${encodeURIComponent(event.id)}`);
            console.log('event',event.id,event.name,event?.status?.type?.state,event?.status?.type?.shortDetail);
            console.log('summary keys',Object.keys(summary));
            console.log('rosters count',summary?.rosters?.length||0);
            for(const roster of summary?.rosters||[]){
              console.log('roster team',roster?.team?.abbreviation||roster?.team?.displayName||null,'keys',Object.keys(roster||{}));
              console.log('roster athletes sample',safe((roster?.roster||roster?.athletes||[]).slice(0,3).map(compactAthlete),12000));
              console.log('roster raw sample',safe((roster?.roster||roster?.athletes||[]).slice(0,1),16000));
            }
            console.log('keyEvents sample',safe((summary?.keyEvents||[]).slice(0,5),10000));
            console.log('commentary sample',safe((summary?.commentary||[]).slice(0,3),8000));
            console.log('scoreboard details sample',safe((event?.competitions?.[0]?.details||[]).slice(0,8),10000));
          }
          async function tennis(label,base){
            console.log(`\n===== ${label} =====`);
            const board=await get(`${base}/scoreboard?limit=500`);
            console.log('tournaments',board?.events?.length||0);
            const event=board?.events?.find(e=>(e?.groupings||[]).some(g=>(g?.competitions||[]).length))||board?.events?.[0];
            if(!event){console.log('no current tournament');return;}
            console.log('tournament',event.id,event.name,event?.status?.type?.state,event?.status?.type?.shortDetail);
            console.log('groupings',safe((event.groupings||[]).map(g=>({grouping:g.grouping,competitionCount:g?.competitions?.length||0})),8000));
            const comps=(event.groupings||[]).flatMap(g=>g?.competitions||[]);
            const comp=comps.find(c=>c?.competitors?.length>=2)||comps[0];
            if(!comp){console.log('no competition');return;}
            console.log('competition keys',Object.keys(comp));
            console.log('competition sample',safe({
              id:comp.id,
              uid:comp.uid,
              date:comp.date,
              status:comp.status,
              type:comp.type,
              round:comp.round,
              notes:comp.notes,
              format:comp.format,
              competitors:(comp.competitors||[]).map(c=>({
                id:c.id,
                winner:c.winner,
                score:c.score,
                linescores:c.linescores,
                athlete:c.athlete,
                statistics:c.statistics,
                keys:Object.keys(c||{})
              }))
            },22000));
            for(const id of [comp.id,comp.uid].filter(Boolean)){
              try{
                const summary=await get(`${base}/summary?event=${encodeURIComponent(id)}`);
                console.log('summary success for',id,'keys',Object.keys(summary));
                console.log('summary sample',safe(summary,16000));
                break;
              }catch(e){console.log('summary failed for',id,e.message);}
            }
          }
          for(const [label,base] of [
            ['SOCCER EPL','https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1'],
            ['SOCCER MLS','https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1']
          ]){try{await soccer(label,base);}catch(e){console.error(label,e.message);}}
          for(const [label,base] of [
            ['TENNIS ATP','https://site.api.espn.com/apis/site/v2/sports/tennis/atp'],
            ['TENNIS WTA','https://site.api.espn.com/apis/site/v2/sports/tennis/wta']
          ]){try{await tennis(label,base);}catch(e){console.error(label,e.message);}}
          NODE
