name: One-time outer router cache bust

on:
  push:
    paths:
      - '.github/workflows/one-time-router-cache-bust.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force browser to load hardened modal header router
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          out,n=re.subn(r'(\./sports/router\.js\?v=)[A-Za-z0-9._-]+',r'\g<1>90.6',s,count=1)
          if n != 1:
              raise SystemExit('Could not find the outer sports/router.js cache key')
          p.write_text(out)
          PY
      - name: Commit cache bust
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already current'
            exit 0
          fi
          git config user.name 'TSO Cache Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Force-load hardened player modal header router'
          git push
