name: One-time Table Tennis Source Probe

on:
  push:
    paths:
      - '.github/workflows/one-time-table-tennis-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe official World Table Tennis result APIs
        run: |
          node --input-type=module <<'NODE'
          const base='https://wtt-web-cms-api-prod.azurewebsites.net';
          const controllerFor=()=>{const c=new AbortController();setTimeout(()=>c.abort(),12000);return c;};
          async function get(label,path){
            try{
              const c=controllerFor();
              const r=await fetch(`${base}${path}`,{headers:{accept:'application/json','user-agent':'ParlayPing/0.9'},signal:c.signal});
              const text=await r.text();
              let data=null;try{data=text?JSON.parse(text):null}catch{data={raw:text.slice(0,1200)}}
              console.log(`\n=== ${label} ===`);
              console.log('status',r.status,'contentType',r.headers.get('content-type'));
              if(Array.isArray(data)){
                console.log('rows',data.length);
                for(const row of data.slice(0,2)) console.log(JSON.stringify(row,null,2).slice(0,6000));
              }else{
                console.log('topKeys',data&&typeof data==='object'?Object.keys(data):[]);
                console.log(JSON.stringify(data,null,2).slice(0,6000));
              }
            }catch(error){console.log(`\n=== ${label} ERROR ===`,error.name,error.message);}
          }
          await get('WTT live results','/api/cms/GetLiveResult');
          await get('WTT past results','/api/cms/GetPastResults');
          await get('WTT results','/api/cms/GetResults');
          await get('WTT official results','/api/cms/GetOfficialResult');
          await get('WTT live event','/api/cms/GetLiveEvent');
          NODE
