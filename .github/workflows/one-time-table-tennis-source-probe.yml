name: One-time Table Tennis Source Probe

on:
  push:
    paths:
      - '.github/workflows/one-time-table-tennis-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe Table Tennis live/final result sources
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.PARLAY_API_KEY;
          if(!key) throw new Error('PARLAY_API_KEY missing');
          const api='https://parlay-api.com/v1';
          const controllerFor=()=>{const c=new AbortController();setTimeout(()=>c.abort(),12000);return c;};
          async function get(label,url){
            try{
              const c=controllerFor();
              const r=await fetch(url,{headers:{'X-API-Key':key,accept:'application/json'},signal:c.signal});
              const text=await r.text();
              let data=null;try{data=text?JSON.parse(text):null}catch{data={raw:text.slice(0,800)}}
              const arr=Array.isArray(data)?data:Array.isArray(data?.data)?data.data:Array.isArray(data?.results)?data.results:Array.isArray(data?.matches)?data.matches:[];
              const top=data&&typeof data==='object'&&!Array.isArray(data)?Object.keys(data):[];
              console.log(`\n=== ${label} ===`);
              console.log('status',r.status,'topKeys',top,'rows',arr.length);
              for(const row of arr.slice(0,3)) console.log(JSON.stringify(row,null,2).slice(0,5000));
              if(!arr.length&&data) console.log('body',JSON.stringify(data,null,2).slice(0,3000));
            }catch(error){console.log(`\n=== ${label} ERROR ===`,error.name,error.message);}
          }
          const dates=[0,-1,-2].map(off=>new Date(Date.now()+off*86400000).toISOString().slice(0,10));
          await get('table_tennis live points',`${api}/sports/table_tennis/live/points`);
          await get('table_tennis scores',`${api}/sports/table_tennis/scores?daysFrom=3`);
          for(const date of dates) await get(`table_tennis matches ${date}`,`${api}/historical/sports/table_tennis/matches?date=${date}`);
          NODE
