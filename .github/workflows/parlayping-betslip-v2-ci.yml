name: ParlayPing External Handoff CI

on:
  pull_request:
    paths:
      - 'sports/parlayping-external-handoff.js'
      - 'sports/gambly-web-fallback-v895.js'
      - 'supabase/functions/parlayping-share/index.ts'
      - 'scripts/parlayping-betslip-v2-selftest.mjs'
      - '.github/workflows/parlayping-betslip-v2-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Syntax check external handoff
        run: node --check sports/parlayping-external-handoff.js
      - name: Type-check secure share proxy
        run: deno check supabase/functions/parlayping-share/index.ts
      - name: Run external handoff regression
        run: node scripts/parlayping-betslip-v2-selftest.mjs
