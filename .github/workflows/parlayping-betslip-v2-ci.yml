name: ParlayPing Betslip v2 CI

on:
  pull_request:
    paths:
      - 'sports/parlayping-betslip-v2.js'
      - 'sports/parlayping-betslip-v2.css'
      - 'sports/parlayping-betslip-v2-polish.js'
      - 'sports/gambly-web-fallback-v895.js'
      - 'scripts/parlayping-betslip-v2-selftest.mjs'
      - '.github/workflows/parlayping-betslip-v2-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check ParlayPing v2
        run: |
          node --check sports/parlayping-betslip-v2.js
          node --check sports/parlayping-betslip-v2-polish.js
      - name: Run ParlayPing v2 concept regression
        run: node scripts/parlayping-betslip-v2-selftest.mjs
