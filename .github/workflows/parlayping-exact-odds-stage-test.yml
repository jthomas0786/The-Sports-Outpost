name: ParlayPing Exact Odds Stage Test

on:
  push:
    branches:
      - parlayping-exact-leg-book-odds-stage

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify ParlayPing handoff exact-leg odds
        run: node scripts/parlayping-betslip-v2-selftest.mjs
