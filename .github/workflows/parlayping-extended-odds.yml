name: ParlayPing Extended Odds Snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/parlayping-extended-odds-refresh.mjs'
      - '.github/workflows/parlayping-extended-odds.yml'

permissions:
  contents: write

concurrency:
  group: parlayping-extended-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh soccer, tennis, MMA, esports and table tennis props
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: node scripts/parlayping-extended-odds-refresh.mjs
      - name: Commit changed snapshots
        shell: bash
        run: |
          set -euo pipefail
          files=(slates/soccer-odds.json slates/tennis-odds.json slates/mma-odds.json slates/esports-odds.json slates/table-tennis-odds.json)
          changes="$(git status --porcelain -- "${files[@]}")"
          if [ -z "$changes" ]; then
            echo 'No extended sports snapshot changes.'
            exit 0
          fi
          printf '%s\n' "$changes"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Refresh ParlayPing extended sports odds'
          git pull --rebase origin main
          git push origin HEAD:main
