name: ParlayPing v2 Browser Preview

on:
  pull_request:
    paths:
      - 'sports/parlayping-betslip-v2.js'
      - 'sports/parlayping-betslip-v2.css'
      - 'tests/parlayping-v2-preview.html'
      - '.github/workflows/parlayping-v2-browser-preview.yml'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/parlayping-preview-server.log 2>&1 &
          sleep 2
      - name: Capture coded ParlayPing UI
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=941,1672 --virtual-time-budget=4500 \
            --screenshot=parlayping-v2-coded-preview.png \
            http://127.0.0.1:4173/tests/parlayping-v2-preview.html
          test -s parlayping-v2-coded-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: parlayping-v2-coded-preview
          path: parlayping-v2-coded-preview.png
          if-no-files-found: error
          retention-days: 7
