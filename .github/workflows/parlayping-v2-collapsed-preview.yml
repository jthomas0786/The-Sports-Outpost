name: ParlayPing v2 Collapsed Preview
on:
  pull_request:
    paths:
      - 'tests/parlayping-v2-collapsed-preview.html'
      - '.github/workflows/parlayping-v2-collapsed-preview.yml'
      - 'sports/parlayping-betslip-v2.js'
      - 'sports/parlayping-betslip-v2.css'
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/pp-preview.log 2>&1 &
          sleep 2
      - name: Capture collapsed sportsbook state
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=941,1672 --virtual-time-budget=4200 \
            --screenshot=parlayping-v2-collapsed.png \
            http://127.0.0.1:4173/tests/parlayping-v2-collapsed-preview.html
          test -s parlayping-v2-collapsed.png
      - uses: actions/upload-artifact@v4
        with:
          name: parlayping-v2-collapsed
          path: parlayping-v2-collapsed.png
          retention-days: 7