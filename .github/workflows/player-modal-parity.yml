name: Player Modal Parity Checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'sports/router.js'
      - 'sports/mlb/player-modal-parity-v901.js'
      - 'sports/nhl/player-modal-v918.js'
      - 'sports/nhl/player-modal-v918.css'
      - 'sports/nhl/view-v906.js'
      - 'scripts/player-modal-parity-selftest.mjs'
      - '.github/workflows/player-modal-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check sports/router.js
          node --check sports/mlb/player-modal-parity-v901.js
          node --check sports/nhl/player-modal-v918.js
      - name: Player modal parity regression
        run: node scripts/player-modal-parity-selftest.mjs
