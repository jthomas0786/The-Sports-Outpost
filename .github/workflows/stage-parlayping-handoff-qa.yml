name: Stage ParlayPing Handoff QA

on:
  push:
    branches: [parlayping-functional-handoff-stage]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact sportsbook betslip transport
        run: node scripts/parlayping-betslip-v2-selftest.mjs
