name: TSO2 Decision Dashboard Staging Browser QA

on:
  push:
    branches: [tso-2.0-restructure]
    paths:
      - 'tso2/decision-dashboard-browser-qa.cjs'
      - '.github/workflows/tso2-decision-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tso-2.0-restructure
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose staged decision assets before browser setup
        run: |
          set -euo pipefail
          base="https://staging.thesportsoutpost.com"
          bust="$(date +%s)"
          for name in index.html app.js decision-dashboard.js decision-dashboard.css; do
            file="/tmp/tso2-${name//\//_}"
            status="$(curl --retry 2 --connect-timeout 10 --max-time 35 -sSL -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}' "$base/$name?qa=$bust")"
            echo "$name returned HTTP $status; $(wc -c <"$file") bytes; content prefix: $(head -c 55 "$file")"
            test "$status" = 200
          done
          grep -Fq 'decision-dashboard.js' /tmp/tso2-index.html || { echo "::error::Staging index is not the new decision dashboard"; exit 1; }
          grep -Fq 'window.TSO2Decision' /tmp/tso2-decision-dashboard.js || { echo "::error::Staging does not serve new decision-dashboard.js"; exit 1; }
          grep -Fq 'renderDecisionDashboard' /tmp/tso2-app.js || { echo "::error::Staging still serves old app.js"; exit 1; }
          grep -Fq '.decision-game-columns' /tmp/tso2-decision-dashboard.css || { echo "::error::Staging serves wrong decision stylesheet"; exit 1; }
          echo "Current decision dashboard assets are present on staging."
      - name: Install temporary Chromium automation
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check real TSO 2.0 staging Today and Game Hub
        env:
          TSO2_QA_URL: https://staging.thesportsoutpost.com
        run: node tso2/decision-dashboard-browser-qa.cjs
      - name: Upload screenshots and inspect visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tso2-decision-dashboard-screenshots
          path: artifacts/decision-dashboard/*.png
          if-no-files-found: ignore
          retention-days: 5
