name: TSO 2.0 Device Push Smoke
on:
  push:
    branches: [tso-2.0-restructure]
    paths:
      - '.github/workflows/tso2-device-push-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-opted-in-device:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned push sender dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deliver one background Web Push test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TSO2_TEST_SUBSCRIPTION_ID: '1711'
        run: node tso2/tools/device-push-smoke.mjs
