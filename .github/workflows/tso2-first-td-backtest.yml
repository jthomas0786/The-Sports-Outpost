name: TSO 2.0 NFL First TD Backtest

on:
  push:
    branches: [tso-2.0-restructure]
    paths:
      - 'tso2/backtest-nfl-first-td.py'
      - '.github/workflows/tso2-first-td-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tso2-first-td-backtest
  cancel-in-progress: true

jobs:
  historical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tso-2.0-restructure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline leakage and calibration selftest
        run: python tso2/backtest-nfl-first-td.py --selftest
      - name: Walk-forward player backtest from nflverse 2024–2026
        run: python tso2/backtest-nfl-first-td.py
      - name: Assert historical data and no automatic model promotion
        run: |
          python - <<'PY'
          import json
          with open('tso2/data/nfl-first-td-backtest.json') as f:
              data=json.load(f)
          assert all(v>=30 for v in data['historicalSeasonGames'].values())
          assert data['publishCalibratedFirstTd'] is False
          assert data['training']['games']>0
          assert data['heldOut']['year2025']>0
          assert data['heldOut']['rawHeuristic']['logLoss'] is not None
          assert data['heldOut']['baselineHistoricalScoring']['logLoss'] is not None
          print('PASS player-level holdout, actual outcomes and safe calibration gate')
          PY
      - name: Commit isolated TSO 2.0 calibration report
        run: |
          git config user.name "TSO 2.0 Model Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tso2/data/nfl-first-td-backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "TSO2 data: publish verified NFL First TD backtest [skip ci]"
          git pull --rebase origin tso-2.0-restructure
          git push origin HEAD:tso-2.0-restructure
