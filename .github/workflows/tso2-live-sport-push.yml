# Shared Actions scheduler; actual product code is exclusively on TSO2 branch.
# GitHub's scheduled workflows ONLY run from the default branch.
name: TSO 2.0 Live NHL NBA Push
on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tso2-live-sport-push.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect live feeds without sending notifications'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: tso2-nba-nhl-live-push
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tso-2.0-restructure
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify trigger logic, preferences, and service worker syntax
        run: |
          node --check tso2/sw.js
          node --check tso2/push-client.js
          node --check tso2/tools/live-sports-push.mjs
          node tso2/tools/live-sports-push.mjs --selftest
      - name: Poll official NHL and ESPN NBA verified live events
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POLL_MS: '45000'
          MAX_TICKS: ${{ inputs.dry_run == true && '2' || '0' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tso2/tools/live-sports-push.mjs --dry-run
          else
            node tso2/tools/live-sports-push.mjs
          fi
