name: TSO 2.0 NFL 50K Roster-Verified Recalculation

on:
  push:
    branches:
      - tso-2.0-restructure
    paths:
      - .github/workflows/tso2-nfl-50k-recalculate.yml
      - scripts/nfl-simulate.mjs
      - sports/nfl/sim/availability.js
      - sports/nfl/sim/injury-audit.js
      - tso2/data/nfl-availability-2026.json
  # GitHub schedules only default-branch workflows. The minimal main
  # scheduler calls this staging-only job using workflow_call.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tso2-nfl-50k-verified-one-time
  cancel-in-progress: true

jobs:
  recalculate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout TSO 2.0 only
        uses: actions/checkout@v4
        with:
          ref: tso-2.0-restructure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stage current NFL source files without modifying main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p /tmp/tso2-nfl-current
          for f in nfl.json nfl-research.json nfl-odds.json; do
            git show "origin/main:slates/${f}" > "/tmp/tso2-nfl-current/${f}"
            test -s "/tmp/tso2-nfl-current/${f}"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/tso2-nfl-current';
          const slate=JSON.parse(fs.readFileSync(root+'/nfl.json'));
          const research=JSON.parse(fs.readFileSync(root+'/nfl-research.json'));
          const odds=JSON.parse(fs.readFileSync(root+'/nfl-odds.json'));
          if(Number(slate.season)!==2026||!Array.isArray(slate.games)||slate.games.length<10)
            throw Error('Current 2026 slate not valid; will not simulate stale or partial schedule');
          if(Number(research.season)!==2026||!Array.isArray(research.players)||research.players.length<150)
            throw Error('2026 player research unavailable/partial; abort');
          if(!Array.isArray(odds.games)||!odds.games.length)
            throw Error('NFL sportsbook odds missing; abort');
          console.log('Validated current NFL input:',slate.games.length,'games,',research.players.length,'research players,',odds.games.length,'odds games.');
          NODE
      - name: Run 50,000 with engine-level verified-player whitelist for all NFL games
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        shell: bash
        run: |
          set -euo pipefail
          node sports/nfl/sim/availability-selftest.mjs
          node tso2/simulations-selftest.mjs
          node scripts/nfl-simulate.mjs \
            --slate /tmp/tso2-nfl-current/nfl.json \
            --research /tmp/tso2-nfl-current/nfl-research.json \
            --odds /tmp/tso2-nfl-current/nfl-odds.json \
            --iterations 50000 --no-live \
            --out tso2/data/nfl-sim.json
      - name: Validate every game, identity, roster, and run count
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('tso2/data/nfl-sim.json','utf8');
          const doc=JSON.parse(raw);
          const slate=JSON.parse(fs.readFileSync('/tmp/tso2-nfl-current/nfl.json','utf8'));
          const ids=new Set(slate.games.map(g=>String(g.gameId||g.id)));
          const config=JSON.parse(fs.readFileSync('sports/nfl/sim/config.json','utf8'));
          if(doc.engineVersion!==config.engineVersion)
            throw Error('Batch did not use current engine '+config.engineVersion+'; got '+doc.engineVersion);
          if(doc.gameCount!==ids.size||doc.games?.length!==ids.size)
            throw Error('Game count mismatch: '+doc.games?.length+'/'+ids.size);
          const errors=[],summaries=[];
          const normalize=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
          for(const g of doc.games){
            const id=String(g.game?.gameId||'');
            if(!ids.has(id))errors.push('Unexpected game '+id);
            if(g.iterations!==50000)errors.push('Not 50000 iterations: '+id+' '+g.iterations);
            const world=g.representativeWorld;
            if(!world||world.selection!=='central-correlated-sampled-world'||world.iterations!==50000||
              !Number.isInteger(world.sampledIndex)||world.sampledIndex<0||world.sampledIndex>=50000)
              errors.push('Missing actual representative 50K sampled world for '+id);
            if(world){
              const scoreAway=Number(world.awayScore),scoreHome=Number(world.homeScore);
              const meanAway=Number(g.outcomes?.away?.score?.mean),meanHome=Number(g.outcomes?.home?.score?.mean);
              if(!Number.isFinite(scoreAway)||!Number.isFinite(scoreHome)||
                Math.abs(scoreAway-meanAway)>12||Math.abs(scoreHome-meanHome)>12)
                errors.push('Representative world not close to scoring center for '+id);
              const unavailableKeys=new Set((g.availabilityAudit?.exclusions||[]).map(p=>
                String(p.team).toUpperCase()+'|'+normalize(p.name)));
              for(const player of world.players||[]){
                if(unavailableKeys.has(String(player.team).toUpperCase()+'|'+normalize(player.name)))
                  errors.push('Representative world includes excluded player '+id+' '+player.name);
              }
            }

            if(g.availabilityAudit?.rosterVerified!==true)errors.push('Roster not checked for '+id);
            const audit=g.availabilityAudit?.rosterAudit;
            if(audit?.injuryReportVerified!==true||!audit.injuryReportCheckedAt)
              errors.push('Full 2026 injury report not verified for '+id);
            if(audit?.injuryTeams?.length!==2||audit.injuryTeams.some(t=>!t.reported))
              errors.push('Missing injury report for one or both teams: '+id);
            if(g.availabilityAudit?.rosterAudit?.finalInactivesVerified===true)errors.push('Incorrect final inactives claim '+id);
            const unavailable=new Set((g.availabilityAudit?.exclusions||[]).map(p=>String(p.team).toUpperCase()+'|'+normalize(p.name)));
            for(const p of g.players||[]){
              if(unavailable.has(String(p.team).toUpperCase()+'|'+normalize(p.name)))
                errors.push('Ineligible result player '+p.name+' for '+id);
            }
            const home=Number(g.outcomes?.home?.score?.mean),away=Number(g.outcomes?.away?.score?.mean);
            if(!Number.isFinite(home)||!Number.isFinite(away))errors.push('Invalid scoring projections '+id);
            summaries.push({gameId:id,matchup:(g.game?.away?.abbr||'?')+' @ '+(g.game?.home?.abbr||'?'),
              iterations:g.iterations,homeMean:home,awayMean:away,
              representativeSampleIndex:g.representativeWorld?.sampledIndex??null,
              representativeAwayScore:g.representativeWorld?.awayScore??null,
              representativeHomeScore:g.representativeWorld?.homeScore??null,
              rosterCheckedAt:g.availabilityAudit?.rosterAudit?.checkedAt,
              injuryCheckedAt:g.availabilityAudit?.rosterAudit?.injuryReportCheckedAt,
              injuryReportVerified:g.availabilityAudit?.rosterAudit?.injuryReportVerified===true,
              questionables:g.availabilityAudit?.rosterAudit?.injuryTeams?.reduce((n,t)=>n+(t.uncertain||[]).length,0)||0,
              excluded:(g.availabilityAudit?.exclusions||[]).length});
          }
          if(errors.length)throw Error(errors.slice(0,30).join('\n'));
          const report={status:'verified',generatedAt:doc.generatedAt,season:2026,
            eligibilityGate:'engine-profile-injury-whitelist-v3',
            verifiedRosters:true,finalGamedayInactivesVerified:false,
            gameCount:doc.games.length,totalIterations:doc.games.reduce((a,g)=>a+g.iterations,0),
            summaries};
          fs.writeFileSync('tso2/data/nfl-sim-run-report.json',JSON.stringify(report,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## TSO 2.0: 50K NFL simulations\n\nGames: '+report.gameCount+' | Iterations: '+report.totalIterations.toLocaleString()+'\nAll model player pools checked against both 2026 active rosters and current injury designations (not final game-day inactives).\n');
          console.log('PASS: '+report.gameCount+' games, '+report.totalIterations+' iterations, roster + injury audits for all matchups');
          NODE
      - name: Commit staging-only results, never main or production
        shell: bash
        run: |
          set -euo pipefail
          # workflow_dispatch / schedule events may originate on main, while
          # checkout above deliberately selects TSO2 staging. Guard the actual
          # checked-out branch, never the event source branch.
          test "$(git symbolic-ref --short HEAD)" = "tso-2.0-restructure"
          test "$(git remote get-url origin | grep -c 'The-Sports-Outpost')" -ge 1
          git config user.name "TSO 2.0 Simulation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tso2/data/nfl-sim.json tso2/data/nfl-sim-run-report.json
          git diff --staged --quiet && { echo "No new simulation data."; exit 1; }
          git commit -m "Recalculate 2026 NFL simulations with 50K verified-roster iterations per game"
          for retry in 1 2 3 4 5; do
            if git push origin HEAD:tso-2.0-restructure; then exit 0; fi
            git pull --rebase --autostash origin tso-2.0-restructure
            sleep $((retry*3))
          done
          exit 1
