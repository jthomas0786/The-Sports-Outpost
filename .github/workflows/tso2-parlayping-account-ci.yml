name: TSO 2.0 Parlay Ping Account Bridge
on:
  pull_request:
    branches: [tso-2.0-restructure]
    paths:
      - 'tso2/auth.js'
      - 'tso2/app.js'
      - 'tso2/pages.js'
      - 'tso2/parlayping-integration-selftest.mjs'
      - '.github/workflows/tso2-parlayping-account-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check tso2/app.js
      - run: node --check tso2/auth.js
      - run: node tso2/parlayping-integration-selftest.mjs
      - run: node tso2/auth-signin-selftest.mjs
