name: TSO 2.0 QB Simulation Validation
on:
  push:
    branches: [tso-2.0-restructure]
    paths:
      - 'sports/nfl/sim/engine.js'
      - 'sports/nfl/sim/config.json'
      - 'tso2/qb-playing-time-selftest.mjs'
      - 'scripts/nfl-sim-auto.mjs'
      - 'tso2/validate-nfl-model-output.mjs'
      - '.github/workflows/tso2-qb-sim-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax validation
        run: |
          node --check sports/nfl/sim/engine.js
          node --check sports/nfl/sim/profile.js
          node --check tso2/qb-playing-time-selftest.mjs
      - name: QB rotation scenarios
        run: node tso2/qb-playing-time-selftest.mjs
      - name: Full NFL simulation regression
        run: node scripts/nfl-sim-selftest.mjs
      - name: Automated NFL simulation regression
        run: node scripts/nfl-sim-auto-selftest.mjs
      - name: Load current NFL inputs from main without changing 1.0
        run: |
          mkdir -p tso2/source
          git fetch origin main
          for file in nfl.json nfl-research.json nfl-odds.json; do
            git show "origin/main:slates/$file" > "tso2/source/$file"
          done
      - name: Generate isolated TSO 2.0 50K NFL slate
        run: |
          mkdir -p tso2/data
          node scripts/nfl-sim-auto.mjs --force --no-live --slate tso2/source/nfl.json --research tso2/source/nfl-research.json --odds tso2/source/nfl-odds.json --out tso2/data/nfl-sim.json --state tso2/data/nfl-sim-state.json --halftime-out tso2/data/nfl-halftime.json --quarter-out tso2/data/nfl-quarter.json
          node -e "const fs=require('fs'); const p='tso2/data/nfl-sim.json';if(!fs.existsSync(p))throw Error('No TSO2 NFL simulation produced'); const d=JSON.parse(fs.readFileSync(p)); if(!d.games?.length)throw Error('No simulated NFL games');for(const g of d.games){if(g.automation?.phase==='pregame'&&!g.propStyles?.candidates)throw Error('Pregame props missing for '+g.game?.gameId)} console.log('TSO2 games:',d.games.length)"
      - name: Validate model probability integrity
        run: node tso2/validate-nfl-model-output.mjs tso2/data/nfl-sim.json
      - name: Publish validated TSO 2.0 slate to isolated branch
        run: |
          git config user.name 'TSO 2.0 Model Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f tso2/data/nfl-sim.json
          if git diff --staged --quiet; then
            echo 'TSO 2.0 model unchanged'
          else
            git commit -m 'Update validated TSO 2.0 NFL simulation'
            git push origin HEAD:tso-2.0-restructure
          fi
      - name: Upload isolated NFL simulation for inspection
        uses: actions/upload-artifact@v4
        with:
          name: tso2-nfl-simulation-candidate
          path: tso2/data/*.json
          retention-days: 7
