name: TSO 2.0 Team Statistics Source Probe
on:
  push:
    branches: [tso-2.0-restructure]
    paths: [scripts/tso2-team-stat-source-probe.mjs]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/tso2-team-stat-source-probe.mjs
