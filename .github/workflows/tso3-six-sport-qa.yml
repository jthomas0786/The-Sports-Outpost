name: TSO 3.0 Six-Sport Quality Gate
on:
  push:
    branches: [tso-3.0]
    paths:
      - 'tso3/**'
      - '.github/workflows/tso3-six-sport-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tso3-six-sport-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check preview source and icon/app bundle syntax
        run: |
          node --check tso3/app.js
          node --check tso3/preview-worker.js
          node --check tso3/nfl-lab.js
          node --check tso3/nfl-props.js
          node --check tso3/nfl-validation.js
          node --check tso3/nba-lab.js
          node --check tso3/nba-depth.js
      - name: Validate all source integrity, sportsbook freshness and research architecture
        run: node --test tso3/tests/*.test.mjs
