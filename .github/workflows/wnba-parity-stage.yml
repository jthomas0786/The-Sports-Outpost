name: WNBA Odds Parity Stage

on:
  push:
    paths:
      - '.github/workflows/wnba-parity-stage.yml'
  workflow_dispatch:

permissions:
  contents: write

# staging refresh v4: inspect combo-alt milestone aliases and exact sportsbook coverage
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh WNBA sportsbook props only
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: node scripts/basketball-odds-refresh.mjs WNBA
      - name: Show WNBA coverage
        run: |
          node - <<'NODE'
          const d=require('./slates/wnba-odds.json');
          console.log(JSON.stringify({rows:d.meta?.sportsbookRows,currentRows:d.meta?.currentRows,preservedRows:d.meta?.preservedRows,nativeLinkRows:d.meta?.nativeLinkRows,nativeSidRows:d.meta?.nativeSidRows,books:d.meta?.books,markets:d.meta?.markets,rawMarketKeys:d.meta?.rawMarketKeys},null,2));
          for (const player of ['Jordin Canada','Allisha Gray','Angel Reese','Pauline Astier','Breanna Stewart','Jonquel Jones']) {
            const rows=(d.rows||[]).filter(r=>String(r.player).toLowerCase()===player.toLowerCase());
            console.log(player, JSON.stringify([...new Set(rows.map(r=>`${r.market}:${r.line}:${r.book}:${r.overPrice}:${r.preserved?'preserved':'live'}:${r.overLink||r.overSid?'linkable':'no-native-link'}:${r.marketKey||''}`))].slice(0,220)));
          }
          NODE
      - name: Commit WNBA staging snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- slates/wnba-odds.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add slates/wnba-odds.json
          git commit -m 'Refresh WNBA parity staging snapshot'
          git push origin HEAD:wnba-odds-parity-stage
