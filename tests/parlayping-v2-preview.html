<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../">
  <title>ParlayPing v2 browser preview</title>
  <style>html,body{margin:0;background:#020b15}#bsText{position:fixed;left:-9999px}</style>
</head>
<body>
  <button id="bsText">Open ParlayPing</button>
  <script type="module">
    const books=[
      ['FanDuel','https://www.fanduel.com/',13490],
      ['DraftKings','https://sportsbook.draftkings.com/',12953],
      ['BetMGM','https://sports.betmgm.com/',12800],
      ['Caesars','https://www.caesars.com/sportsbook-and-casino',12555],
      ['ESPN BET','https://espnbet.com/',12000],
      ['Fanatics','https://sportsbook.fanatics.com/',12140],
      ['Hard Rock Bet','https://www.hardrock.bet/',11900],
    ];
    const parlayOdds=Object.fromEntries(books.map(([book,,odds])=>[book,odds]));
    function bookOffers(line,basePrice,probability,alts){
      const rows=[];
      books.forEach(([book,link],i)=>rows.push({book,line,price:basePrice-(i*15),link,probability}));
      for(const [altLine,altPrice] of alts)rows.push({book:'FanDuel',line:altLine,price:altPrice,link:'https://www.fanduel.com/'});
      return rows;
    }
    const slip=[
      {id:'rice-atd',sport:'NFL',player:'Rashee Rice',player_id:'4428331',market:'atd',side:'over',line:.5,price:140,book:'FanDuel',link:'https://www.fanduel.com/',pct:.432,game_pk:'kc-ind',away:'IND',home:'KC',kickoff:new Date(Date.now()+3600000).toISOString(),parlayOdds,offers:bookOffers(.5,140,.432,[[1.5,320],[2,650],[3,1200]])},
      {id:'warren-atd',sport:'NFL',player:'Tyler Warren',player_id:'4431457',market:'atd',side:'over',line:.5,price:250,book:'FanDuel',link:'https://www.fanduel.com/',pct:.286,game_pk:'kc-ind',away:'IND',home:'KC',kickoff:new Date(Date.now()+3600000).toISOString(),parlayOdds,offers:bookOffers(.5,250,.286,[[1.5,520],[2,1200],[3,2500]])},
      {id:'chase-rec',sport:'NFL',player:"Ja'Marr Chase",player_id:'4362628',market:'recyds',side:'over',line:74.5,price:120,book:'FanDuel',link:'https://www.fanduel.com/',pct:.521,game_pk:'bal-cin',away:'BAL',home:'CIN',kickoff:new Date(Date.now()+6900000).toISOString(),parlayOdds,offers:bookOffers(74.5,120,.521,[[54.5,-110],[64.5,-105],[84.5,165],[94.5,220]])},
      {id:'lamar-td',sport:'NFL',player:'Lamar Jackson',player_id:'3916387',market:'passtds',side:'over',line:1.5,price:180,book:'FanDuel',link:'https://www.fanduel.com/',pct:.378,game_pk:'bal-cin',away:'BAL',home:'CIN',kickoff:new Date(Date.now()+6900000).toISOString(),parlayOdds,offers:bookOffers(1.5,180,.378,[[.5,100],[2.5,340],[3.5,600]])},
    ];
    localStorage.setItem('dw_betslip',JSON.stringify(slip));
    const {installParlayPingBetslipV2}=await import('./sports/parlayping-betslip-v2.js?v=browser-preview');
    installParlayPingBetslipV2();
    setTimeout(()=>document.getElementById('bsText')?.click(),100);
    setTimeout(()=>{
      const fd=[...document.querySelectorAll('[data-book]')].find(el=>el.dataset.book==='FanDuel');
      fd?.click();
      setTimeout(()=>document.getElementById('ppBookToggle')?.click(),100);
      setTimeout(()=>document.getElementById('ppTune')?.click(),200);
    },1400);
  </script>
</body>
</html>
